<section class="cards" id="cards"><article class="card" data-key="grammar-basic arabic grammar · a0–a2 アラビア語文法｜基礎 A0–A2 الْقَوَاعِدُ الْأَسَاسِيَّةُ"><div class="cardtop"><span class="tag"><span class="t" data-en="GRAMMAR · A0–A2" data-ja="文法 · A0–A2" data-ar="الْقَوَاعِدُ · A0–A2"></span></span><span class="meta">CH. 01–35</span></div><h3><span class="t" data-en="Arabic Grammar · A0–A2" data-ja="アラビア語文法｜基礎 A0–A2" data-ar="الْقَوَاعِدُ الْأَسَاسِيَّةُ"></span></h3><p><span class="t" data-en="Alphabet, verbs, questions, numbers and everyday sentence structures. Switch English, Japanese and Arabic within one book." data-ja="文字、動詞、疑問文、数字、日常の文型。ひとつの文法書で英語・日本語・アラビア語を切り替えられます。" data-ar="الْحُرُوفُ وَالْأَفْعَالُ وَالْأَسْئِلَةُ وَالْأَعْدَادُ وَالتَّرَاكِيبُ الْأَسَاسِيَّةُ."></span></p><div class="arline" lang="ar" dir="rtl">أَتَعَلَّمُ الْعَرَبِيَّةَ</div><div class="bottom"><a class="open" href="content/grammar.html?level=basic"><span class="t" data-en="Open book" data-ja="文法書を開く" data-ar="اِفْتَحِ الدَّرْسَ"></span></a><label class="done"><input type="checkbox" data-check="grammar-basic"><span class="t" data-en="Reviewed" data-ja="学習済み" data-ar="أَكْمَلْتُهُ"></span></label></div></article><article class="card" data-key="grammar-advanced arabic grammar · b1–b2 アラビア語文法｜発展 B1–B2 الْقَوَاعِدُ الْمُتَقَدِّمَةُ"><div class="cardtop"><span class="tag"><span class="t" data-en="GRAMMAR · B1–B2" data-ja="文法 · B1–B2" data-ar="الْقَوَاعِدُ · B1–B2"></span></span><span class="meta">CH. 36–51</span></div><h3><span class="t" data-en="Arabic Grammar · B1–B2" data-ja="アラビア語文法｜発展 B1–B2" data-ar="الْقَوَاعِدُ الْمُتَقَدِّمَةُ"></span></h3><p><span class="t" data-en="Verb moods, derived forms, passive voice and complex sentences. Detailed English, concise Japanese notes and Arabic practice." data-ja="動詞のムード、派生形、受動態、複雑な文の入門。英語の詳しい説明と日本語の要点解説、アラビア語練習を収録。" data-ar="صِيَغُ الْأَفْعَالِ وَالْمَبْنِيُّ لِلْمَجْهُولِ وَالْجُمَلُ الْمُرَكَّبَةُ."></span></p><div class="arline" lang="ar" dir="rtl">أُرِيدُ أَنْ أَتَحَسَّنَ</div><div class="bottom"><a class="open" href="content/grammar.html?level=advanced"><span class="t" data-en="Open book" data-ja="文法書を開く" data-ar="اِفْتَحِ الدَّرْسَ"></span></a><label class="done"><input type="checkbox" data-check="grammar-advanced"><span class="t" data-en="Reviewed" data-ja="学習済み" data-ar="أَكْمَلْتُهُ"></span></label></div></article><article class="card" data-key="lesson-01 lesson 01 — introductions Lesson 01 — 自己紹介・日常生活 الدَّرْسُ الْأَوَّلُ — التَّعَارُفُ"><div class="cardtop"><span class="tag"><span class="t" data-en="SPEAKING · WEEK 01" data-ja="会話 · 第1週" data-ar="الْمُحَادَثَةُ · ٠١"></span></span><span class="meta">NOV 2–6 · 6H</span></div><h3><span class="t" data-en="Lesson 01 — Introductions" data-ja="Lesson 01 — 自己紹介・日常生活" data-ar="الدَّرْسُ الْأَوَّلُ — التَّعَارُفُ"></span></h3><p><span class="t" data-en="Introduce yourself and talk about home, daily habits and work." data-ja="自己紹介、生活、仕事について話し、相手にも質問します。" data-ar="تَعَرَّفْ عَلَى الْآخَرِينَ، وَتَحَدَّثْ عَنْ حَيَاتِكَ وَعَمَلِكَ."></span></p><div class="arline" lang="ar" dir="rtl">أَيْنَ تَعْمَلُ؟</div><div class="bottom"><a class="open" href="content/lesson-01.html"><span class="t" data-en="Open lesson" data-ja="教材を開く" data-ar="اِفْتَحِ الدَّرْسَ"></span></a><label class="done"><input type="checkbox" data-check="lesson-01"><span class="t" data-en="Reviewed" data-ja="学習済み" data-ar="أَكْمَلْتُهُ"></span></label></div></article><article class="card" data-key="lesson-02 lesson 02 — café & restaurant Lesson 02 — カフェ・レストラン الدَّرْسُ الثَّانِي — الْمَقْهَى وَالْمَطْعَمُ"><div class="cardtop"><span class="tag"><span class="t" data-en="SPEAKING · WEEK 02" data-ja="会話 · 第2週" data-ar="الْمُحَادَثَةُ · ٠٢"></span></span><span class="meta">NOV 9–13 · 6H</span></div><h3><span class="t" data-en="Lesson 02 — Café & Restaurant" data-ja="Lesson 02 — カフェ・レストラン" data-ar="الدَّرْسُ الثَّانِي — الْمَقْهَى وَالْمَطْعَمُ"></span></h3><p><span class="t" data-en="Order food and drinks, ask prices and change an order politely." data-ja="飲食物を注文し、値段を聞き、注文変更にも対応します。" data-ar="اُطْلُبِ الطَّعَامَ وَالشَّرَابَ، وَاسْأَلْ عَنِ السِّعْرِ."></span></p><div class="arline" lang="ar" dir="rtl">أُرِيدُ قَهْوَةً</div><div class="bottom"><a class="open" href="content/lesson-02.html"><span class="t" data-en="Open lesson" data-ja="教材を開く" data-ar="اِفْتَحِ الدَّرْسَ"></span></a><label class="done"><input type="checkbox" data-check="lesson-02"><span class="t" data-en="Reviewed" data-ja="学習済み" data-ar="أَكْمَلْتُهُ"></span></label></div></article><article class="card" data-key="lesson-03 lesson 03 — shopping & prices Lesson 03 — 買い物・価格・数量 الدَّرْسُ الثَّالِثُ — التَّسَوُّقُ"><div class="cardtop"><span class="tag"><span class="t" data-en="SPEAKING · WEEK 03" data-ja="会話 · 第3週" data-ar="الْمُحَادَثَةُ · ٠٣"></span></span><span class="meta">NOV 16–20 · 6H</span></div><h3><span class="t" data-en="Lesson 03 — Shopping & Prices" data-ja="Lesson 03 — 買い物・価格・数量" data-ar="الدَّرْسُ الثَّالِثُ — التَّسَوُّقُ"></span></h3><p><span class="t" data-en="Shop for items, ask prices, choose colour and size, count quantities and pay." data-ja="値段を聞き、色・サイズ・数量を指定して、支払いまで会話します。" data-ar="اِسْأَلْ عَنِ الْأَسْعَارِ وَالْمَقَاسَاتِ وَالْأَلْوَانِ وَالْعَدَدِ."></span></p><div class="arline" lang="ar" dir="rtl">بِكَمْ هَذَا؟</div><div class="bottom"><a class="open" href="content/lesson-03.html"><span class="t" data-en="Open lesson" data-ja="教材を開く" data-ar="اِفْتَحِ الدَّرْسَ"></span></a><label class="done"><input type="checkbox" data-check="lesson-03"><span class="t" data-en="Reviewed" data-ja="学習済み" data-ar="أَكْمَلْتُهُ"></span></label></div></article><article class="card" data-key="conversation everyday conversation 基本日常会話集 مُحَادَثَاتٌ يَوْمِيَّةٌ"><div class="cardtop"><span class="tag"><span class="t" data-en="CONVERSATION · A0–A2" data-ja="会話集 · A0–A2" data-ar="الْمُحَادَثَاتُ · A0–A2"></span></span><span class="meta">PHRASEBOOK</span></div><h3><span class="t" data-en="Everyday Conversation" data-ja="基本日常会話集" data-ar="مُحَادَثَاتٌ يَوْمِيَّةٌ"></span></h3><p><span class="t" data-en="Useful phrases for greetings, shopping, directions, travel, work and more." data-ja="挨拶、買い物、道案内、旅行、仕事などに役立つ表現集。" data-ar="عِبَارَاتٌ لِلتَّحِيَّاتِ وَالتَّسَوُّقِ وَالسَّفَرِ وَالْعَمَلِ."></span></p><div class="arline" lang="ar" dir="rtl">السَّلَامُ عَلَيْكُمْ</div><div class="bottom"><a class="open" href="content/conversation.html"><span class="t" data-en="Open lesson" data-ja="教材を開く" data-ar="اِفْتَحِ الدَّرْسَ"></span></a><label class="done"><input type="checkbox" data-check="conversation"><span class="t" data-en="Reviewed" data-ja="学習済み" data-ar="أَكْمَلْتُهُ"></span></label></div></article></section>
<section class="notice"><strong><span class="t" data-en="Study progress & language" data-ja="学習記録と言語切替について" data-ar="تَقَدُّمُ التَّعَلُّمِ وَاللُّغَةُ"></span></strong><div><span class="t" data-en="Your language choice is shared across the site. Completion checks are stored only in this browser. Arabic speech depends on installed device voices." data-ja="選択した言語はサイト全体で引き継がれます。完了チェックはこのブラウザだけに保存されます。音声は端末のアラビア語読み上げ機能に依存します。" data-ar="يُحْفَظُ اخْتِيَارُ اللُّغَةِ فِي الْمُتَصَفِّحِ. وَيَعْتَمِدُ النُّطْقُ عَلَى الصَّوْتِ الْمُتَاحِ فِي الْجِهَازِ."></span></div></section></main><footer>Fuṣḥā Study Studio · Modern Standard Arabic</footer>
<script>(()=>{const K="fss-preferred-language-v2";let lang=localStorage.getItem(K)||localStorage.getItem("fusha-language")||"en";if(!["en","ja","ar"].includes(lang))lang="en";
function apply(){document.documentElement.lang=lang;document.querySelectorAll(".t").forEach(el=>{el.textContent=el.getAttribute("data-"+lang);el.lang=lang});document.querySelectorAll(".languages button").forEach(el=>{const active=el.dataset.lang===lang;el.classList.toggle("selected",active);el.setAttribute("aria-pressed",String(active))});document.getElementById("search").placeholder=lang==="ar"?"ابْحَثْ عَنْ دَرْسٍ":lang==="ja"?"教材を検索":"Search lessons";}
document.querySelectorAll(".languages button").forEach(el=>el.onclick=()=>{lang=el.dataset.lang;localStorage.setItem(K,lang);apply()});
document.querySelectorAll("input[data-check]").forEach(el=>{const k="fusha-completed-"+el.dataset.check;el.checked=localStorage.getItem(k)==="yes";el.onchange=()=>localStorage.setItem(k,el.checked?"yes":"no")});
document.getElementById("search").oninput=e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll(".card").forEach(card=>card.hidden=!(card.textContent.toLowerCase().includes(q)||card.dataset.key.toLowerCase().includes(q)))};apply()})();</script></body></html>
