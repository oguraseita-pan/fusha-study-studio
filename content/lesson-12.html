<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fuṣḥā speaking lesson 12: Integrated Speaking Checkpoint"><title>Week 12 — Integrated Speaking Checkpoint | Fuṣḥā Study Studio</title><link rel="stylesheet" href="../assets/lesson-engine.css"><link rel="stylesheet" href="../assets/site-navigation.css"><link rel="stylesheet" href="../assets/lesson-ui.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"></head><body><div class="top"><a href="../index.html">← Fuṣḥā Study Studio</a><div class="tools"><span class="voice-state" id="voice-state">Tap Arabic text for audio</span><button data-switch="ja" aria-pressed="true">日本語</button><button data-switch="en" aria-pressed="true">English</button><button data-switch="answers" aria-pressed="false">Answers</button><button onclick="window.print()">Print / PDF</button></div></div><main id="content" class="wrap"></main><script>window.LESSON_DATA={"week":12,"title":"Integrated Speaking Checkpoint","jaTitle":"総復習・実力確認・実践会話","arTitle":"مُرَاجَعَةٌ شَامِلَةٌ وَمُحَادَثَاتٌ","dates":"18 · 20 · 22 Jan 2027","outcome":"Combine Weeks 1–11: introduce yourself, make requests, tell past events, explain future plans, recover from misunderstandings, and handle simple everyday situations without a script.","goals":["Hold 2–3 minute practical conversations across several topics / 2〜3分の複合会話をする","Use present, past and future forms appropriately / 現在・過去・未来を使い分ける","Initiate questions and respond to unexpected changes / 自分から質問し変化に対応する","Identify three recurring errors and improve on a repeat attempt / 間違い3つを修正し再挑戦する"],"review":[{"en":"Week 1/2: Introduce yourself and order at a café.","ja":"第1・2週：自己紹介とカフェ注文。"},{"en":"Week 5/6: Explain tomorrow's plan and yesterday's activities.","ja":"第5・6週：明日の予定と昨日の行動を話す。"},{"en":"Week 9–11: Handle a sample request, a phone clarification and an airport question.","ja":"第9〜11週：サンプル依頼、電話の聞き返し、空港での質問。"}],"vocab":[{"ar":"أَسْكُنُ","roman":"askunu","en":"I live","ja":"私は住む","type":"verb","past":"سَكَنَ","present":"يَسْكُنُ","me":"أَسْكُنُ","example":{"ar":"أَسْكُنُ فِي دُبَيّ.","en":"I live in Dubai.","ja":"ドバイに住んでいます。"}},{"ar":"أَعْمَلُ","roman":"aʿmalu","en":"I work","ja":"私は働く","type":"verb","past":"عَمِلَ","present":"يَعْمَلُ","me":"أَعْمَلُ","example":{"ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","en":"I work at a Japanese company.","ja":"日本企業で働いています。"}},{"ar":"أَتَعَلَّمُ","roman":"ataʿallamu","en":"I learn","ja":"私は学ぶ","type":"verb","past":"تَعَلَّمَ","present":"يَتَعَلَّمُ","me":"أَتَعَلَّمُ","example":{"ar":"أَتَعَلَّمُ الْعَرَبِيَّةَ.","en":"I am learning Arabic.","ja":"アラビア語を学んでいます。"}},{"ar":"أُرِيدُ","roman":"urīdu","en":"I want","ja":"私は欲しい","type":"verb","past":"أَرَادَ","present":"يُرِيدُ","me":"أُرِيدُ","example":{"ar":"أُرِيدُ قَهْوَةً.","en":"I want coffee.","ja":"コーヒーが欲しいです。"}},{"ar":"أَحْتَاجُ","roman":"aḥtāju","en":"I need","ja":"私は必要とする","type":"verb","past":"اِحْتَاجَ","present":"يَحْتَاجُ","me":"أَحْتَاجُ","example":{"ar":"أَحْتَاجُ إِلَى مُسَاعَدَةٍ.","en":"I need help.","ja":"助けが必要です。"}},{"ar":"أَذْهَبُ","roman":"adhhabu","en":"I go","ja":"私は行く","type":"verb","past":"ذَهَبَ","present":"يَذْهَبُ","me":"أَذْهَبُ","example":{"ar":"أَذْهَبُ إِلَى الْعَمَلِ.","en":"I go to work.","ja":"仕事に行きます。"}},{"ar":"أَشْتَرِي","roman":"ashtarī","en":"I buy","ja":"私は買う","type":"verb","past":"اِشْتَرَى","present":"يَشْتَرِي","me":"أَشْتَرِي","example":{"ar":"أَشْتَرِي هَذَا الْكِتَابَ.","en":"I buy this book.","ja":"この本を買います。"}},{"ar":"أُرْسِلُ","roman":"ursilu","en":"I send","ja":"私は送る","type":"verb","past":"أَرْسَلَ","present":"يُرْسِلُ","me":"أُرْسِلُ","example":{"ar":"أُرْسِلُ عَيِّنَةً.","en":"I send a sample.","ja":"サンプルを送ります。"}},{"ar":"أَتَّصِلُ","roman":"attaṣilu","en":"I call","ja":"私は電話する","type":"verb","past":"اِتَّصَلَ","present":"يَتَّصِلُ","me":"أَتَّصِلُ","example":{"ar":"سَأَتَّصِلُ بِكَ.","en":"I will call you.","ja":"電話します。"}},{"ar":"أَفْهَمُ","roman":"afhamu","en":"I understand","ja":"私は理解する","type":"verb","past":"فَهِمَ","present":"يَفْهَمُ","me":"أَفْهَمُ","example":{"ar":"لَا أَفْهَمُ.","en":"I don't understand.","ja":"分かりません。"}},{"ar":"أَكَلْتُ","roman":"akaltu","en":"I ate","ja":"私は食べた","type":"verb","past":"أَكَلَ","present":"يَأْكُلُ","me":"آكُلُ","example":{"ar":"أَكَلْتُ فِي مَطْعَمٍ.","en":"I ate in a restaurant.","ja":"レストランで食べました。"}},{"ar":"سَأُسَافِرُ","roman":"sa-usāfiru","en":"I will travel","ja":"旅行する予定","type":"verb","past":"سَافَرَ","present":"يُسَافِرُ","me":"أُسَافِرُ","example":{"ar":"سَأُسَافِرُ غَدًا.","en":"I will travel tomorrow.","ja":"明日旅行します。"}},{"ar":"شَرِكَةٌ","roman":"sharikatun","en":"company","ja":"会社","type":"noun","gender":"feminine","plural":"شَرِكَاتٌ","example":{"ar":"هَذِهِ شَرِكَةٌ يَابَانِيَّةٌ.","en":"This is a Japanese company.","ja":"これは日本の会社です。"}},{"ar":"عَيِّنَةٌ","roman":"ʿayyinatun","en":"sample","ja":"サンプル","type":"noun","gender":"feminine","plural":"عَيِّنَاتٌ","example":{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","en":"The sample is ready.","ja":"サンプルの準備ができています。"}},{"ar":"سِعْرٌ","roman":"siʿrun","en":"price","ja":"価格","type":"noun","gender":"masculine","plural":"أَسْعَارٌ","example":{"ar":"مَا السِّعْرُ؟","en":"What is the price?","ja":"価格はいくらですか？"}},{"ar":"مَوْعِدٌ","roman":"mawʿidun","en":"appointment","ja":"約束","type":"noun","gender":"masculine","plural":"مَوَاعِيدُ","example":{"ar":"عِنْدِي مَوْعِدٌ غَدًا.","en":"I have an appointment tomorrow.","ja":"明日約束があります。"}},{"ar":"رِحْلَةٌ","roman":"riḥlatun","en":"flight / trip","ja":"便・旅行","type":"noun","gender":"feminine","plural":"رِحْلَاتٌ","example":{"ar":"الرِّحْلَةُ مُتَأَخِّرَةٌ.","en":"The flight is delayed.","ja":"便は遅れています。"}},{"ar":"تَذْكِرَةٌ","roman":"tadhkiratun","en":"ticket","ja":"チケット","type":"noun","gender":"feminine","plural":"تَذَاكِرُ","example":{"ar":"عِنْدِي تَذْكِرَةٌ.","en":"I have a ticket.","ja":"チケットがあります。"}},{"ar":"غُرْفَةٌ","roman":"ghurfatun","en":"room","ja":"部屋","type":"noun","gender":"feminine","plural":"غُرَفٌ","example":{"ar":"الْغُرْفَةُ نَظِيفَةٌ.","en":"The room is clean.","ja":"部屋は清潔です。"}},{"ar":"صَيْدَلِيَّةٌ","roman":"ṣaydaliyyatun","en":"pharmacy","ja":"薬局","type":"noun","gender":"feminine","plural":"صَيْدَلِيَّاتٌ","example":{"ar":"أَيْنَ الصَّيْدَلِيَّةُ؟","en":"Where is the pharmacy?","ja":"薬局はどこですか？"}},{"ar":"رِسَالَةٌ","roman":"risālatun","en":"message","ja":"メッセージ","type":"noun","gender":"feminine","plural":"رَسَائِلُ","example":{"ar":"أُرْسِلُ رِسَالَةً.","en":"I send a message.","ja":"メッセージを送ります。"}},{"ar":"مَطْعَمٌ","roman":"maṭʿamun","en":"restaurant","ja":"レストラン","type":"noun","gender":"masculine","plural":"مَطَاعِمُ","example":{"ar":"هَذَا مَطْعَمٌ جَيِّدٌ.","en":"This is a good restaurant.","ja":"これは良いレストランです。"}},{"ar":"مُتَاحٌ","roman":"mutāḥun","en":"available (m.)","ja":"空いている（男性形）","type":"adj","fem":"مُتَاحَةٌ","example":{"ar":"أَنَا مُتَاحٌ غَدًا.","en":"I'm free tomorrow.","ja":"明日は空いています。"}},{"ar":"جَاهِزٌ","roman":"jāhizun","en":"ready (m.)","ja":"準備できた（男性形）","type":"adj","fem":"جَاهِزَةٌ","example":{"ar":"الطَّلَبُ جَاهِزٌ.","en":"The order is ready.","ja":"注文の準備ができています。"}}],"grammar":[{"title":"Present: person prefixes","en":"Compare أَكْتُبُ (I write), تَكْتُبُ (you m. write), يَكْتُبُ (he writes), نَكْتُبُ (we write). Many imperfect verbs follow this prefix pattern, but stem vowels must be learned with the verb.","ja":"未完了形の主要接頭辞 أ / ت / ي / ن を復習します。「私は・あなたは・彼は・私たちは」をまず区別。語幹の母音は動詞と一緒に覚えます。","example":{"ar":"أَكْتُبُ · تَكْتُبُ · يَكْتُبُ · نَكْتُبُ","roman":"aktubu · taktubu · yaktubu · naktubu","en":"I / you(m.) / he / we write","ja":"私は／あなたは／彼は／私たちは書く"},"drill":"Teacher gives an action (go, work, learn); change I → you male → he → we."},{"title":"Past: personal endings","en":"Perfect verbs change their ending: ذَهَبَ he went, ذَهَبَتْ she went, ذَهَبْتُ I went, ذَهَبْتَ you (male) went. Practice correct person and time.","ja":"完了形では接尾辞で人称を表します。ذَهَبَ（彼）、ذَهَبَتْ（彼女）、ذَهَبْتُ（私）、ذَهَبْتَ（男性のあなた）。","example":{"ar":"ذَهَبْتُ إِلَى الْعَمَلِ أَمْسِ.","roman":"dhahabtu ilā al-ʿamali amsi","en":"I went to work yesterday.","ja":"昨日仕事に行きました。"},"drill":"Retell the same event as I, she and he; then add one reason."},{"title":"Future and simple negation","en":"Use سَـ before the imperfect for future. Use لَا before an imperfect for a basic present negative and مَا before a perfect for a simple past negative.","ja":"未来は سَـ＋未完了形、現在否定は لَا＋未完了形、過去否定は基本的に مَا＋完了形。","example":{"ar":"لَا أَذْهَبُ الْيَوْمَ، وَلَكِنْ سَأَذْهَبُ غَدًا.","roman":"lā adhhabu al-yawma wa-lākin sa-adhhabu ghadan","en":"I am not going today, but I will go tomorrow.","ja":"今日は行きませんが、明日行きます。"},"drill":"Teacher says today, yesterday, tomorrow; student states the correct time and verb."},{"title":"Ask, clarify, continue","en":"Use أَيْنَ (where), مَتَى (when), كَمْ (how many/how much), مَا (what), هَلْ (yes/no). Do not stop the conversation if you miss a word: ask someone to repeat.","ja":"疑問詞 أَيْنَ / مَتَى / كَمْ / مَا と Yes/No の هَلْ を再確認。聞き取れなければ会話を止めず、聞き返します。","example":{"ar":"لَا أَفْهَمُ. هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"lā afhamu · hal yumkinuka an tukarrira?","en":"I don't understand. Could you repeat?","ja":"分かりません。繰り返してもらえますか？"},"drill":"Teacher asks an unfamiliar question; learner clarifies rather than automatically saying yes."}],"phrases":[{"ar":"أَنَا مِنَ الْيَابَانِ وَأَسْكُنُ فِي دُبَيّ.","roman":"anā mina al-yābāni wa-askunu fī dubayy","en":"I'm from Japan and live in Dubai.","ja":"日本出身でドバイに住んでいます。"},{"ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","roman":"aʿmalu fī sharikatin yābāniyyatin","en":"I work at a Japanese company.","ja":"日本企業で働いています。"},{"ar":"أَتَعَلَّمُ الْعَرَبِيَّةَ.","roman":"ataʿallamu al-ʿarabiyyata","en":"I'm learning Arabic.","ja":"アラビア語を勉強しています。"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُسَاعِدَنِي؟","roman":"hal yumkinuka an tusāʿidanī","en":"Can you help me?","ja":"手伝ってもらえますか？"},{"ar":"أُرِيدُ قَهْوَةً، مِنْ فَضْلِكَ.","roman":"urīdu qahwatan min faḍlika","en":"I would like coffee, please.","ja":"コーヒーをお願いします。"},{"ar":"مَا سِعْرُ هَذَا؟","roman":"mā siʿru hādhā?","en":"How much is this?","ja":"これはいくらですか？"},{"ar":"مَتَى نَلْتَقِي؟","roman":"matā naltaqī?","en":"When shall we meet?","ja":"いつ会いましょうか？"},{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","roman":"al-ʿayyinatu jāhizatun","en":"The sample is ready.","ja":"サンプルの準備ができています。"},{"ar":"سَأُرْسِلُ رِسَالَةً غَدًا.","roman":"sa-ursilu risālatan ghadan","en":"I'll send a message tomorrow.","ja":"明日メッセージを送ります。"},{"ar":"لَا أَفْهَمُ، هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"lā afhamu · hal yumkinuka an tukarrira?","en":"I don't understand; can you repeat?","ja":"分かりません。繰り返してもらえますか？"},{"ar":"ذَهَبْتُ إِلَى الْعَمَلِ أَمْسِ.","roman":"dhahabtu ilā al-ʿamali amsi","en":"I went to work yesterday.","ja":"昨日仕事に行きました。"},{"ar":"أَيْنَ بَوَّابَةُ الصُّعُودِ؟","roman":"ayna bawwābatu aṣ-ṣuʿūdi","en":"Where is the boarding gate?","ja":"搭乗口はどこですか？"}],"dialogues":[{"title":"New friend at a café","turns":[{"role":"A","ar":"مَرْحَبًا، مِنْ أَيْنَ أَنْتَ؟","en":"Hi, where are you from?","ja":"こんにちは、どちらの出身ですか？"},{"role":"B","ar":"أَنَا مِنَ الْيَابَانِ، وَأَسْكُنُ فِي دُبَيّ.","en":"I'm from Japan and live in Dubai.","ja":"日本出身で、ドバイに住んでいます。"},{"role":"A","ar":"مَاذَا تَعْمَلُ؟","en":"What do you do for work?","ja":"お仕事は何ですか？"},{"role":"B","ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","en":"I work at a Japanese company.","ja":"日本の会社で働いています。"},{"role":"A","ar":"هَلْ تَتَعَلَّمُ الْعَرَبِيَّةَ؟","en":"Are you learning Arabic?","ja":"アラビア語を勉強していますか？"},{"role":"B","ar":"نَعَمْ، أَتَعَلَّمُهَا مُنْذُ أَشْهُرٍ.","en":"Yes, I've been learning it for months.","ja":"はい、数か月前からです。"},{"role":"A","ar":"مَاذَا تُرِيدُ أَنْ تَشْرَبَ؟","en":"What would you like to drink?","ja":"何を飲みますか？"},{"role":"B","ar":"أُرِيدُ قَهْوَةً، مِنْ فَضْلِكَ.","en":"Coffee, please.","ja":"コーヒーをお願いします。"}],"twist":"Change your job, language learning time and drink. Speaker A asks a new question not in the model."},{"title":"Customer call and next meeting","turns":[{"role":"A","ar":"مَرْحَبًا، هَلْ وَصَلَتِ الْعَيِّنَةُ؟","en":"Hello, has the sample arrived?","ja":"こんにちは、サンプルは届きましたか？"},{"role":"B","ar":"نَعَمْ، وَصَلَتْ أَمْسِ.","en":"Yes, it arrived yesterday.","ja":"はい、昨日届きました。"},{"role":"A","ar":"هَلْ أَعْجَبَكَ الْقُمَاشُ؟","en":"Did you like the fabric?","ja":"生地はいかがでしたか？"},{"role":"B","ar":"نَعَمْ، وَلَكِنْ عِنْدِي سُؤَالٌ عَنِ السِّعْرِ.","en":"Yes, but I have a price question.","ja":"よかったですが、価格について質問があります。"},{"role":"A","ar":"تَفَضَّلْ، مَا سُؤَالُكَ؟","en":"Please, what's your question?","ja":"どうぞ、ご質問は？"},{"role":"B","ar":"هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ سِعْرًا جَدِيدًا؟","en":"Can you send an updated price?","ja":"新しい価格を送れますか？"},{"role":"A","ar":"نَعَمْ، سَأُرْسِلُهُ غَدًا.","en":"Yes, I'll send it tomorrow.","ja":"はい、明日送ります。"},{"role":"B","ar":"شُكْرًا، مَتَى نَلْتَقِي مَرَّةً أُخْرَى؟","en":"Thanks; when shall we meet again?","ja":"ありがとうございます。次はいつ会いますか？"}],"twist":"Teacher requests a different date and says an unfamiliar word. Learner clarifies before agreeing."},{"title":"Airport + hotel problem","turns":[{"role":"A","ar":"عُذْرًا، أَيْنَ بَوَّابَةُ الصُّعُودِ؟","en":"Excuse me, where is the boarding gate?","ja":"すみません、搭乗口はどこですか？"},{"role":"B","ar":"الْبَوَّابَةُ رَقْمُ سَبْعَةَ.","en":"Gate number seven.","ja":"7番ゲートです。"},{"role":"A","ar":"شُكْرًا. هَلِ الرِّحْلَةُ مُتَأَخِّرَةٌ؟","en":"Thanks. Is the flight delayed?","ja":"ありがとうございます。便は遅れていますか？"},{"role":"B","ar":"نَعَمْ، سَاعَةً وَاحِدَةً.","en":"Yes, by one hour.","ja":"はい、1時間です。"},{"role":"A","ar":"سَأَصِلُ مُتَأَخِّرًا إِلَى الْفُنْدُقِ.","en":"I'll arrive late at the hotel.","ja":"ホテルに遅く到着します。"},{"role":"B","ar":"هَلْ عِنْدَكَ حَجْزٌ؟","en":"Do you have a reservation?","ja":"予約はありますか？"},{"role":"A","ar":"نَعَمْ، وَلَكِنْ عِنْدِي مُشْكِلَةٌ فِي الْغُرْفَةِ.","en":"Yes, but I have a problem in the room.","ja":"はい、でも部屋に問題があります。"},{"role":"B","ar":"مَا الْمُشْكِلَةُ؟","en":"What is the problem?","ja":"どうされましたか？"}],"twist":"Change airport gate, delay, hotel problem and proposed solution. Student must complete both scenarios."}],"classes":[{"day":"Mon 18 Jan 2027","name":"BASELINE · No notes first","goal":"Measure what the learner can do before re-teaching.","missions":[{"en":"Two-minute self-introduction with work and daily routine.","ja":"仕事と生活を2分で自己紹介する。"},{"en":"Order at a café, ask price and make one change.","ja":"カフェで注文し値段を聞き、変更する。"},{"en":"Tell teacher about yesterday and tomorrow.","ja":"昨日と明日のことを話す。"}],"questions":[{"ar":"أَيْنَ تَسْكُنُ؟","en":"Where do you live?","ja":"どこに住んでいますか？"},{"ar":"مَاذَا عَمِلْتَ أَمْسِ؟","en":"What did you do yesterday?","ja":"昨日何をしましたか？"},{"ar":"مَاذَا سَتَفْعَلُ غَدًا؟","en":"What will you do tomorrow?","ja":"明日は何をしますか？"}],"teacher":"Record the first attempt with permission. Do not correct during the baseline.","exit":"Mark score 0/1/2 for meaning, questions, pronunciation and flexibility."},{"day":"Wed 20 Jan 2027","name":"INTEGRATE · Mixed scenarios","goal":"Practice transitions across familiar topics.","missions":[{"en":"Work meeting unexpectedly becomes a phone call.","ja":"商談が突然電話に切り替わる。"},{"en":"Taxi journey is delayed; rearrange a restaurant booking.","ja":"タクシーが遅れ、レストラン予約を変更する。"},{"en":"Hotel problem followed by a pharmacy question.","ja":"ホテルのトラブルから薬局の質問へつなげる。"}],"questions":[{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","en":"Could you repeat?","ja":"繰り返してもらえますか？"},{"ar":"مَتَى نَلْتَقِي؟","en":"When shall we meet?","ja":"いつ会いましょうか？"},{"ar":"كَيْفَ أَصِلُ إِلَى هَذَا الْمَكَانِ؟","en":"How can I get to this place?","ja":"ここにはどうやって行きますか？"}],"teacher":"Keep every task within the student's known vocabulary; surprise with changed information, not advanced grammar.","exit":"Hold 2 separate conversations of 2 minutes with no script."},{"day":"Fri 22 Jan 2027","name":"CHECKPOINT · Independent speaking","goal":"Retest, compare and set the next 4-week priority.","missions":[{"en":"Run the same two-minute introduction as Monday.","ja":"月曜と同じ自己紹介を再録音する。"},{"en":"Do a random role-play selected by the teacher.","ja":"講師が選んだランダム会話に挑戦。"},{"en":"Ask five questions and handle three corrections.","ja":"5つ質問し、3つの修正を反映する。"}],"questions":[{"ar":"لِمَاذَا تَتَعَلَّمُ الْعَرَبِيَّةَ؟","en":"Why do you learn Arabic?","ja":"なぜアラビア語を学びますか？"},{"ar":"هَلْ أَنْتَ مُتَاحٌ غَدًا؟","en":"Are you available tomorrow?","ja":"明日は空いていますか？"},{"ar":"مَاذَا تُرِيدُ أَنْ تَفْعَلَ بَعْدَ الدَّرْسِ؟","en":"What do you want to do after class?","ja":"授業後は何をしたいですか？"}],"teacher":"Give the student feedback about observable progress, not a guessed CEFR level.","exit":"Compare the first and final recordings and agree on 3 weak areas."}],"test":[{"en":"Say your origin and current city.","ja":"出身と住んでいる都市を言う。","answer":{"ar":"أَنَا مِنَ الْيَابَانِ وَأَسْكُنُ فِي دُبَيّ.","roman":"anā mina al-yābāni wa-askunu fī dubayy","en":"Model answer","ja":"回答例"}},{"en":"Use the present to say you study Arabic.","ja":"アラビア語を勉強しています。","answer":{"ar":"أَتَعَلَّمُ الْعَرَبِيَّةَ.","roman":"ataʿallamu al-ʿarabiyyata","en":"Model answer","ja":"回答例"}},{"en":"Use the past to say you went to work yesterday.","ja":"昨日仕事に行きました。","answer":{"ar":"ذَهَبْتُ إِلَى الْعَمَلِ أَمْسِ.","roman":"dhahabtu ilā al-ʿamali amsi","en":"Model answer","ja":"回答例"}},{"en":"Use the future to say you will travel tomorrow.","ja":"明日旅行します。","answer":{"ar":"سَأُسَافِرُ غَدًا.","roman":"sa-usāfiru ghadan","en":"Model answer","ja":"回答例"}},{"en":"Ask for the price of a sample.","ja":"サンプルの価格を尋ねる。","answer":{"ar":"مَا سِعْرُ هَذِهِ الْعَيِّنَةِ؟","roman":"mā siʿru hādhihi al-ʿayyinati","en":"Model answer","ja":"回答例"}},{"en":"Ask someone to repeat what they said.","ja":"繰り返してもらえますか？","answer":{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"hal yumkinuka an tukarrira","en":"Model answer","ja":"回答例"}},{"en":"Ask where the airport is.","ja":"空港はどこですか？","answer":{"ar":"أَيْنَ الْمَطَارُ؟","roman":"ayna al-maṭāru","en":"Model answer","ja":"回答例"}},{"en":"Say the sample is ready and you will send it tomorrow.","ja":"サンプルは準備できており、明日送ります。","answer":{"ar":"الْعَيِّنَةُ جَاهِزَةٌ، وَسَأُرْسِلُهَا غَدًا.","roman":"al-ʿayyinatu jāhizatun wa-sa-ursiluhā ghadan","en":"Model answer","ja":"回答例"}}],"checks":["I can speak for 2 minutes without notes / 2分間台本なしで話せる","I can correctly use present, past and future / 現在・過去・未来を使える","I can ask 5 questions, not only answer / 質問を自分から5つできる","I can recover from an unexpected reply / 予想外の返答に対応できる","I can compare two recordings and identify improvement / 録音を比較して改善点を説明できる"],"speaking":{"fusha":"This is a Fuṣḥā checkpoint, not a CEFR certification. Read the model sentences carefully, but in ordinary connected speech you may omit many short case endings. Keep verb person and key consonant distinctions clear.","real":"A1 everyday conversations in Dubai may involve Gulf, Levantine, Egyptian or other dialects. Use Fuṣḥā as a common foundation and ask speakers to slow down. Being understood matters more than reproducing every formal case ending."}};</script><script src="../assets/lesson-engine.js"></script><script defer src="../assets/site-navigation.js"></script><script defer src="../assets/lesson-ui.js"></script></body></html>
