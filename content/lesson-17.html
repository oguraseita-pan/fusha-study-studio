<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fuṣḥā speaking week 17: Past Experiences & Telling Stories"><title>Lesson 17 — Past Experiences & Telling Stories | Fuṣḥā Study Studio</title><link rel="stylesheet" href="../assets/lesson-engine.css"></head><body><div class="top"><a href="../index.html">← Fuṣḥā Study Studio</a><div class="tools"><span class="voice-state" id="voice-state">Tap Arabic text for audio</span><button data-switch="ja" aria-pressed="true">日本語</button><button data-switch="en" aria-pressed="true">English</button><button data-switch="answers" aria-pressed="false">Answers</button><button onclick="window.print()">Print / PDF</button></div></div><main id="content" class="wrap"></main><script>window.LESSON_DATA={"week":17,"title":"Past Experiences & Telling Stories","jaTitle":"過去の経験・出来事を順序立てて話す","arTitle":"التَّجَارِبُ وَحِكَايَاتُ الْمَاضِي","dates":"22 · 24 · 26 February 2027","outcome":"Describe a past trip or weekend using simple past verbs, a sequence of events, a feeling and a follow-up question.","goals":["Tell a 60–90 second story about your weekend / 週末の出来事を60〜90秒で話す","Use perfect verbs for I, he and she / 完了形の人称変化を使う","Connect events with first, then and finally / 出来事を順序立てて説明する","Describe a feeling and answer why / 感想と理由を述べる"],"review":[{"en":"Week 6: Explain three things you did yesterday.","ja":"第6週：昨日したことを3つ話す。"},{"en":"Week 11: Talk about a trip and airport.","ja":"第11週：旅行と空港について話す。"},{"en":"Week 13: Give a reason for your preference.","ja":"第13週：好みの理由を説明する。"}],"vocab":[{"ar":"ذَهَبْتُ","roman":"dhahabtu","en":"I went","ja":"私は行った","type":"verb","past":"ذَهَبَ","present":"يَذْهَبُ","me":"أَذْهَبُ","example":{"ar":"ذَهَبْتُ إِلَى مَسْقَطَ.","roman":"","en":"I went to Muscat.","ja":"マスカットへ行きました。"}},{"ar":"سَافَرْتُ","roman":"sāfartu","en":"I travelled","ja":"私は旅行した","type":"verb","past":"سَافَرَ","present":"يُسَافِرُ","me":"أُسَافِرُ","example":{"ar":"سَافَرْتُ فِي الْأُسْبُوعِ الْمَاضِي.","roman":"","en":"I travelled last week.","ja":"先週旅行しました。"}},{"ar":"زُرْتُ","roman":"zurtu","en":"I visited","ja":"私は訪れた","type":"verb","past":"زَارَ","present":"يَزُورُ","me":"أَزُورُ","example":{"ar":"زُرْتُ صَدِيقِي.","roman":"","en":"I visited my friend.","ja":"友人を訪れました。"}},{"ar":"قَابَلْتُ","roman":"qābaltu","en":"I met","ja":"私は会った","type":"verb","past":"قَابَلَ","present":"يُقَابِلُ","me":"أُقَابِلُ","example":{"ar":"قَابَلْتُ عَمِيلًا جَدِيدًا.","roman":"","en":"I met a new customer.","ja":"新しい顧客に会いました。"}},{"ar":"بَقِيتُ","roman":"baqītu","en":"I stayed","ja":"私は滞在した","type":"verb","past":"بَقِيَ","present":"يَبْقَى","me":"أَبْقَى","example":{"ar":"بَقِيتُ فِي الْفُنْدُقِ لَيْلَتَيْنِ.","roman":"","en":"I stayed at the hotel for two nights.","ja":"ホテルに2泊しました。"}},{"ar":"بَدَأْتُ","roman":"badaʾtu","en":"I started","ja":"私は始めた","type":"verb","past":"بَدَأَ","present":"يَبْدَأُ","me":"أَبْدَأُ","example":{"ar":"بَدَأْتُ الْعَمَلَ مُبَكِّرًا.","roman":"","en":"I started work early.","ja":"早く仕事を始めました。"}},{"ar":"اِنْتَهَيْتُ","roman":"intahaytu","en":"I finished","ja":"私は終えた","type":"verb","past":"اِنْتَهَى","present":"يَنْتَهِي","me":"أَنْتَهِي","example":{"ar":"اِنْتَهَيْتُ مِنَ الْعَمَلِ مَسَاءً.","roman":"","en":"I finished work in the evening.","ja":"夕方仕事を終えました。"}},{"ar":"رَجَعْتُ","roman":"rajaʿtu","en":"I returned","ja":"私は戻った","type":"verb","past":"رَجَعَ","present":"يَرْجِعُ","me":"أَرْجِعُ","example":{"ar":"رَجَعْتُ إِلَى الْبَيْتِ.","roman":"","en":"I returned home.","ja":"家に戻りました。"}},{"ar":"تَعَلَّمْتُ","roman":"taʿallamtu","en":"I learned","ja":"私は学んだ","type":"verb","past":"تَعَلَّمَ","present":"يَتَعَلَّمُ","me":"أَتَعَلَّمُ","example":{"ar":"تَعَلَّمْتُ كَلِمَاتٍ جَدِيدَةً.","roman":"","en":"I learned new words.","ja":"新しい単語を学びました。"}},{"ar":"شَاهَدْتُ","roman":"shāhadtu","en":"I watched / saw","ja":"私は見た","type":"verb","past":"شَاهَدَ","present":"يُشَاهِدُ","me":"أُشَاهِدُ","example":{"ar":"شَاهَدْتُ فِيلْمًا مَسَاءً.","roman":"","en":"I watched a film in the evening.","ja":"夕方映画を見ました。"}},{"ar":"زِيَارَةٌ","roman":"ziyāratun","en":"visit","ja":"訪問","type":"noun","gender":"feminine","plural":"زِيَارَاتٌ","example":{"ar":"كَانَتِ الزِّيَارَةُ مُمْتِعَةً.","roman":"","en":"The visit was enjoyable.","ja":"訪問は楽しかったです。"}},{"ar":"رِحْلَةٌ","roman":"riḥlatun","en":"trip / journey","ja":"旅行","type":"noun","gender":"feminine","plural":"رِحْلَاتٌ","example":{"ar":"الرِّحْلَةُ كَانَتْ جَمِيلَةً.","roman":"","en":"The trip was lovely.","ja":"良い旅行でした。"}},{"ar":"تَجْرِبَةٌ","roman":"tajribatun","en":"experience","ja":"経験","type":"noun","gender":"feminine","plural":"تَجَارِبُ","example":{"ar":"كَانَتْ تَجْرِبَةً جَدِيدَةً.","roman":"","en":"It was a new experience.","ja":"新しい経験でした。"}},{"ar":"صَدِيقٌ","roman":"ṣadīqun","en":"friend (male)","ja":"友人","type":"noun","gender":"masculine","plural":"أَصْدِقَاءُ","example":{"ar":"قَابَلْتُ صَدِيقًا قَدِيمًا.","roman":"","en":"I met an old friend.","ja":"昔からの友人に会いました。"}},{"ar":"مَدِينَةٌ","roman":"madīnatun","en":"city","ja":"都市","type":"noun","gender":"feminine","plural":"مُدُنٌ","example":{"ar":"زُرْتُ مَدِينَةً جَدِيدَةً.","roman":"","en":"I visited a new city.","ja":"新しい都市を訪れました。"}},{"ar":"أُسْبُوعٌ","roman":"usbūʿun","en":"week","ja":"週","type":"noun","gender":"masculine","plural":"أَسَابِيعُ","example":{"ar":"بَقِيتُ هُنَاكَ أُسْبُوعًا.","roman":"","en":"I stayed there a week.","ja":"そこに1週間滞在しました。"}},{"ar":"يَوْمٌ","roman":"yawmun","en":"day","ja":"日","type":"noun","gender":"masculine","plural":"أَيَّامٌ","example":{"ar":"كَانَ يَوْمًا طَوِيلًا.","roman":"","en":"It was a long day.","ja":"長い一日でした。"}},{"ar":"مَكَانٌ","roman":"makānun","en":"place","ja":"場所","type":"noun","gender":"masculine","plural":"أَمَاكِنُ","example":{"ar":"زُرْتُ مَكَانًا جَمِيلًا.","roman":"","en":"I visited a beautiful place.","ja":"美しい場所を訪れました。"}},{"ar":"جَمِيلٌ","roman":"jamīlun","en":"beautiful / pleasant (m.)","ja":"美しい・良い","type":"adj","fem":"جَمِيلَةٌ","example":{"ar":"الْمَكَانُ جَمِيلٌ.","roman":"","en":"The place is beautiful.","ja":"その場所は美しいです。"}},{"ar":"مُمْتِعٌ","roman":"mumtiʿun","en":"enjoyable (m.)","ja":"楽しい","type":"adj","fem":"مُمْتِعَةٌ","example":{"ar":"كَانَ الْيَوْمُ مُمْتِعًا.","roman":"","en":"The day was enjoyable.","ja":"楽しい一日でした。"}},{"ar":"أَمْسِ","roman":"amsi","en":"yesterday","ja":"昨日","type":"expression","example":{"ar":"قَابَلْتُ صَدِيقِي أَمْسِ.","roman":"","en":"I met my friend yesterday.","ja":"昨日友人に会いました。"}},{"ar":"الْأُسْبُوعَ الْمَاضِيَ","roman":"al-usbūʿa al-māḍiya","en":"last week","ja":"先週","type":"expression","example":{"ar":"سَافَرْتُ الْأُسْبُوعَ الْمَاضِيَ.","roman":"","en":"I travelled last week.","ja":"先週旅行しました。"}},{"ar":"أَوَّلًا","roman":"awwalan","en":"first","ja":"まず","type":"expression","example":{"ar":"أَوَّلًا، ذَهَبْتُ إِلَى الْمَطَارِ.","roman":"","en":"First, I went to the airport.","ja":"まず空港へ行きました。"}},{"ar":"ثُمَّ","roman":"thumma","en":"then","ja":"それから","type":"expression","example":{"ar":"ثُمَّ رَجَعْتُ إِلَى الْفُنْدُقِ.","roman":"","en":"Then I returned to the hotel.","ja":"それからホテルに戻りました。"}}],"grammar":[{"title":"Perfect forms: the person ending","en":"The past/perfect form changes with the speaker: ذَهَبَ he went, ذَهَبَتْ she went, ذَهَبْتُ I went, ذَهَبْتَ you (male) went. Focus on the ending.","ja":"過去（完了形）は動詞の語尾が人称で変わります。「彼」ذَهَبَ、「彼女」ذَهَبَتْ、「私」ذَهَبْتُ、「男性のあなた」ذَهَبْتَ を区別します。","example":{"ar":"ذَهَبَتْ إِلَى السُّوقِ، وَلَكِنِّي ذَهَبْتُ إِلَى الْعَمَلِ.","roman":"dhahabat ilā as-sūqi wa-lākinnī dhahabtu ilā al-ʿamali","en":"She went to the market, but I went to work.","ja":"彼女は市場へ、私は仕事へ行きました。"},"drill":"Change I went into he went, she went and you (male) went; replace market with café."},{"title":"Build a chronological story","en":"Connect 3 or 4 short sentences with أَوَّلًا (first), ثُمَّ (then), بَعْدَ ذَلِكَ (after that) and أَخِيرًا (finally). These organize your story without complicated grammar.","ja":"「まず」「それから」「その後」「最後に」を使えば、難しい文法なしで出来事を筋道立てて説明できます。","example":{"ar":"أَوَّلًا ذَهَبْتُ إِلَى الْمَطَارِ، ثُمَّ سَافَرْتُ إِلَى مَسْقَطَ.","roman":"awwalan dhahabtu ilā al-maṭāri thumma sāfartu ilā masqaṭa","en":"First I went to the airport; then I travelled to Muscat.","ja":"まず空港へ行き、それからマスカットへ行きました。"},"drill":"Give 4 picture prompts: airport → meeting → restaurant → hotel. Student narrates in order."},{"title":"Describe how an experience was","en":"كَانَ / كَانَتْ means 'was'. After these verbs, the predicate adjective is accusative in fully vocalized Fuṣḥā; when speaking casually the final case ending is commonly not pronounced.","ja":"「〜だった」は كَانَ（男性主語）・كَانَتْ（女性主語）。完全なフスハーでは後ろの述語形容詞が対格になります。会話では語尾は省かれることがあります。","example":{"ar":"كَانَتِ الرِّحْلَةُ مُمْتِعَةً.","roman":"kānati ar-riḥlatu mumtiʿatan","en":"The trip was enjoyable.","ja":"旅行は楽しかったです。"},"drill":"Teacher asks whether the trip was interesting, tiring or enjoyable. Respond and explain why."},{"title":"Past negative with مَا","en":"Place مَا before a perfect verb to say you didn't do something. Example: مَا زُرْتُ = I did not visit. Compare with لَا + imperfect for ordinary present negation.","ja":"過去の否定の基本は مَا＋完了形。現在形の否定 لَا＋未完了形との違いも復習します。","example":{"ar":"مَا زُرْتُ السُّوقَ، وَلَكِنْ زُرْتُ صَدِيقِي.","roman":"mā zurtu as-sūqa wa-lākin zurtu ṣadīqī","en":"I didn't visit the market, but I visited my friend.","ja":"市場へは行かず、友人を訪ねました。"},"drill":"Teacher asks 3 yes/no questions about yesterday; student gives both a negative and an alternative."}],"phrases":[{"ar":"مَاذَا فَعَلْتَ فِي نِهَايَةِ الْأُسْبُوعِ؟","roman":"mādhā faʿalta fī nihāyati al-usbūʿi","en":"What did you do on the weekend? (to a man)","ja":"週末は何をしましたか？"},{"ar":"سَافَرْتُ إِلَى مَسْقَطَ الْأُسْبُوعَ الْمَاضِيَ.","roman":"sāfartu ilā masqaṭa al-usbūʿa al-māḍiya","en":"I went to Muscat last week.","ja":"先週マスカットへ行きました。"},{"ar":"قَابَلْتُ عَمِيلًا جَدِيدًا.","roman":"qābaltu ʿamīlan jadīdan","en":"I met a new customer.","ja":"新しい顧客に会いました。"},{"ar":"أَوَّلًا ذَهَبْتُ إِلَى الْعَمَلِ.","roman":"awwalan dhahabtu ilā al-ʿamali","en":"First I went to work.","ja":"まず仕事に行きました。"},{"ar":"ثُمَّ زُرْتُ صَدِيقِي.","roman":"thumma zurtu ṣadīqī","en":"Then I visited my friend.","ja":"それから友人を訪ねました。"},{"ar":"بَعْدَ ذَلِكَ رَجَعْتُ إِلَى الْفُنْدُقِ.","roman":"baʿda dhālika rajaʿtu ilā al-funduqi","en":"After that I returned to the hotel.","ja":"その後ホテルへ戻りました。"},{"ar":"أَخِيرًا، رَجَعْتُ إِلَى الْبَيْتِ.","roman":"akhīran rajaʿtu ilā al-bayti","en":"Finally I went home.","ja":"最後に帰宅しました。"},{"ar":"كَانَتِ الرِّحْلَةُ مُمْتِعَةً.","roman":"kānati ar-riḥlatu mumtiʿatan","en":"The trip was enjoyable.","ja":"旅行は楽しかったです。"},{"ar":"كَانَ يَوْمًا طَوِيلًا.","roman":"kāna yawman ṭawīlan","en":"It was a long day.","ja":"長い一日でした。"},{"ar":"مَا ذَهَبْتُ إِلَى السُّوقِ.","roman":"mā dhahabtu ilā as-sūqi","en":"I didn't go to the market.","ja":"市場には行きませんでした。"},{"ar":"مَعَ مَنْ ذَهَبْتَ؟","roman":"maʿa man dhahabta","en":"Who did you go with? (to a man)","ja":"誰と行きましたか？"},{"ar":"هَلْ تُرِيدُ أَنْ تَحْكِيَ لِي أَكْثَرَ؟","roman":"hal turīdu an taḥkiya lī akthara","en":"Would you like to tell me more? (to a man)","ja":"もっと聞かせてもらえますか？"}],"dialogues":[{"title":"Tell a friend about last weekend","turns":[{"role":"A","ar":"مَاذَا فَعَلْتَ فِي نِهَايَةِ الْأُسْبُوعِ؟","en":"What did you do last weekend?","ja":"週末は何をしましたか？"},{"role":"B","ar":"زُرْتُ صَدِيقِي فِي دُبَيّ.","en":"I visited my friend in Dubai.","ja":"ドバイで友人を訪ねました。"},{"role":"A","ar":"مَاذَا فَعَلْتُمَا؟","en":"What did you two do?","ja":"2人で何をしましたか？"},{"role":"B","ar":"أَوَّلًا ذَهَبْنَا إِلَى مَقْهًى، ثُمَّ تَنَاوَلْنَا الْعَشَاءَ.","en":"First we went to a café, then we had dinner.","ja":"まずカフェへ行き、その後夕食をとりました。"},{"role":"A","ar":"هَلْ كَانَ الْيَوْمُ مُمْتِعًا؟","en":"Was the day enjoyable?","ja":"楽しい一日でしたか？"},{"role":"B","ar":"نَعَمْ، كَانَ يَوْمًا جَمِيلًا.","en":"Yes, it was a nice day.","ja":"はい、良い一日でした。"}],"twist":"Friend actually went on a business trip. Learner asks where, with whom and why."},{"title":"Explain a business trip","turns":[{"role":"A","ar":"أَيْنَ سَافَرْتَ الْأُسْبُوعَ الْمَاضِيَ؟","en":"Where did you travel last week?","ja":"先週どこへ出張しましたか？"},{"role":"B","ar":"سَافَرْتُ إِلَى مَسْقَطَ.","en":"I travelled to Muscat.","ja":"マスカットに行きました。"},{"role":"A","ar":"لِمَاذَا سَافَرْتَ؟","en":"Why did you travel?","ja":"なぜ行きましたか？"},{"role":"B","ar":"قَابَلْتُ عَمِيلًا جَدِيدًا وَشَاهَدْتُ عَيِّنَاتٍ.","en":"I met a new customer and saw samples.","ja":"新しい顧客に会い、サンプルを見ました。"},{"role":"A","ar":"كَمْ يَوْمًا بَقِيتَ هُنَاكَ؟","en":"How many days did you stay there?","ja":"何日滞在しましたか？"},{"role":"B","ar":"بَقِيتُ يَوْمَيْنِ، ثُمَّ رَجَعْتُ إِلَى دُبَيّ.","en":"I stayed two days, then returned to Dubai.","ja":"2日滞在してドバイへ戻りました。"}],"twist":"The customer meeting was delayed. Learner describes what happened first and what changed."},{"title":"Tell a story with a problem","turns":[{"role":"A","ar":"كَيْفَ كَانَتْ رِحْلَتُكَ؟","en":"How was your trip?","ja":"旅行はいかがでしたか？"},{"role":"B","ar":"كَانَتْ جَيِّدَةً، وَلَكِنْ حَدَثَتْ مُشْكِلَةٌ.","en":"It was good, but there was a problem.","ja":"良かったですが、問題がありました。"},{"role":"A","ar":"مَاذَا حَدَثَ؟","en":"What happened?","ja":"何が起こりましたか？"},{"role":"B","ar":"تَأَخَّرَتِ الطَّائِرَةُ سَاعَةً.","en":"The plane was delayed one hour.","ja":"飛行機が1時間遅れました。"},{"role":"A","ar":"وَمَاذَا فَعَلْتَ؟","en":"And what did you do?","ja":"それでどうしましたか？"},{"role":"B","ar":"اِنْتَظَرْتُ، ثُمَّ اتَّصَلْتُ بِالْفُنْدُقِ.","en":"I waited, then called the hotel.","ja":"待ってからホテルに電話しました。"}],"twist":"Teacher changes the event to a late taxi, closed restaurant or missing bag."}],"classes":[{"day":"Mon 22 Feb 2027","name":"BUILD · Tell yesterday's story","goal":"Use perfect tense and sequence markers confidently.","missions":[{"en":"Say what you did yesterday in three steps.","ja":"昨日の行動を3段階で話す。"},{"en":"Describe a real weekend using at least four past verbs.","ja":"実際の週末を過去動詞4つで説明する。"},{"en":"Swap I/he/she and answer teacher questions.","ja":"私・彼・彼女の主語を変えて答える。"}],"questions":[{"ar":"مَاذَا فَعَلْتَ أَمْسِ؟","en":"What did you do yesterday?","ja":"昨日何をしましたか？"},{"ar":"إِلَى أَيْنَ ذَهَبْتَ؟","en":"Where did you go?","ja":"どこに行きましたか？"},{"ar":"مَعَ مَنْ كُنْتَ؟","en":"Who were you with?","ja":"誰と一緒でしたか？"}],"teacher":"Ask for details, not a memorised paragraph. Correct only the highest-value tense errors.","exit":"60 sec: tell a real experience in order, then answer two questions."},{"day":"Wed 24 Feb 2027","name":"USE · Describe a trip","goal":"Talk about a trip, a meeting and an opinion.","missions":[{"en":"Talk about a recent trip or a trip in Japan.","ja":"最近の旅行または日本での旅行を話す。"},{"en":"Explain why the trip was enjoyable or difficult.","ja":"楽しかった・大変だった理由を説明する。"},{"en":"Teacher changes the trip length and asks for clarification.","ja":"滞在日数を変更され、聞き返して確認する。"}],"questions":[{"ar":"كَمْ يَوْمًا بَقِيتَ؟","en":"How many days did you stay?","ja":"何日滞在しましたか？"},{"ar":"مَاذَا شَاهَدْتَ؟","en":"What did you see?","ja":"何を見ましたか？"},{"ar":"لِمَاذَا كَانَتْ مُهِمَّةً؟","en":"Why was it important?","ja":"なぜ重要でしたか？"}],"teacher":"Recast errors after the story; ask for a new version with clearer connectors.","exit":"2 min: a coherent trip story and three follow-up answers."},{"day":"Fri 26 Feb 2027","name":"TRANSFER · Recover a story","goal":"Respond naturally to an unexpected event.","missions":[{"en":"Explain a travel delay and what you did afterwards.","ja":"旅行の遅延とその後の対応を説明する。"},{"en":"Ask your teacher five questions about their weekend.","ja":"講師の週末について5つ質問する。"},{"en":"Retell the story from another person's point of view.","ja":"別の人を主語にして話し直す。"}],"questions":[{"ar":"مَاذَا حَدَثَ بَعْدَ ذَلِكَ؟","en":"What happened next?","ja":"その後何が起こりましたか？"},{"ar":"هَلْ كَانَتْ تَجْرِبَةً جَيِّدَةً؟","en":"Was it a good experience?","ja":"良い経験でしたか？"},{"ar":"هَلْ تُرِيدُ أَنْ تُكَرِّرَ هَذِهِ التَّجْرِبَةَ؟","en":"Would you like to repeat that experience?","ja":"また同じ経験をしたいですか？"}],"teacher":"Change the timeline twice. Student must keep a sensible order without notes.","exit":"90 sec: talk about past event, problem, outcome and reaction."}],"test":[{"en":"Say: I travelled last week.","ja":"先週旅行しました。","answer":{"ar":"سَافَرْتُ الْأُسْبُوعَ الْمَاضِيَ.","roman":"sāfartu al-usbūʿa al-māḍiya","en":"Model answer","ja":"回答例"}},{"en":"Ask a man: What did you do yesterday?","ja":"昨日何をしましたか？","answer":{"ar":"مَاذَا فَعَلْتَ أَمْسِ؟","roman":"mādhā faʿalta amsi","en":"Model answer","ja":"回答例"}},{"en":"Say: First I went to work, then I returned home.","ja":"まず仕事へ行き、その後帰宅しました。","answer":{"ar":"أَوَّلًا ذَهَبْتُ إِلَى الْعَمَلِ، ثُمَّ رَجَعْتُ إِلَى الْبَيْتِ.","roman":"awwalan dhahabtu ilā al-ʿamali thumma rajaʿtu ilā al-bayti","en":"Model answer","ja":"回答例"}},{"en":"Say: The trip was enjoyable.","ja":"旅行は楽しかったです。","answer":{"ar":"كَانَتِ الرِّحْلَةُ مُمْتِعَةً.","roman":"kānati ar-riḥlatu mumtiʿatan","en":"Model answer","ja":"回答例"}},{"en":"Say: I didn't go to the market.","ja":"市場には行きませんでした。","answer":{"ar":"مَا ذَهَبْتُ إِلَى السُّوقِ.","roman":"mā dhahabtu ilā as-sūqi","en":"Model answer","ja":"回答例"}},{"en":"Ask a man: How many days did you stay?","ja":"何日滞在しましたか？","answer":{"ar":"كَمْ يَوْمًا بَقِيتَ؟","roman":"kam yawman baqīta","en":"Model answer","ja":"回答例"}},{"en":"Say: I met a new customer.","ja":"新しい顧客に会いました。","answer":{"ar":"قَابَلْتُ عَمِيلًا جَدِيدًا.","roman":"qābaltu ʿamīlan jadīdan","en":"Model answer","ja":"回答例"}}],"checks":["I speak about an experience for 90 seconds without a script / 台本なしで90秒話せる","I connect at least three past events / 過去の出来事を3つつなげられる","I answer unexpected follow-up questions / 追加質問に答えられる","I ask questions proactively / 自分から質問できる","I repeat a corrected version more clearly / 修正を反映して話し直せる"],"speaking":{"fusha":"Careful Fuṣḥā marks person in the perfect verb's suffix. For stories, the sequence of events and understandable verb forms matter more than memorising every case vowel. The teacher can model final endings in careful reading.","real":"A native Syrian speaker will normally narrate stories in a Levantine dialect. Ask your teacher to retell the same short story once in Fuṣḥā and once in Syrian Arabic, explaining only the 2–3 biggest differences."}};</script><script src="../assets/lesson-engine.js"></script></body></html>
