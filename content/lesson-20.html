<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103741"><meta name="description" content="Modern Standard Arabic speaking lesson 20 with Japanese and English explanations."><title>Lesson 20 | Fuṣḥā Study Studio</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"><link rel="stylesheet" href="../assets/lesson-v3.css"><link rel="stylesheet" href="../assets/site-navigation.css"></head><body><main id="content" aria-label="Arabic learning lesson"></main><script>window.LESSON_DATA={"week":20,"title":"Final Speaking Assessment & Next Steps","jaTitle":"5か月コース総合評価・復習・次の学習計画","arTitle":"التَّقْيِيمُ النِّهَائِيُّ وَالْمُرَاجَعَةُ","outcome":"Demonstrate independent beginner Fuṣḥā across social, travel and work situations; record progress, identify three priorities and set a realistic next study plan.","goals":["Introduce yourself and your work for 90–120 seconds / 90〜120秒で自己紹介と仕事を説明する","Tell a past story and a future plan / 過去の経験と未来の計画を話す","Handle 3 unpredictable situations without a script / 予想外の3場面に台本なしで対応する","Compare recordings and receive concrete speaking partner feedback / 録音を比較し改善点を確認する"],"review":[{"en":"Revisit your recorded Lesson 12 introduction before Practice 1, if available.","ja":"可能なら第12課で録音した自己紹介を聴く。"},{"en":"Select ten weak vocabulary items from Weeks 1–19 and practice recalling them.","ja":"第1〜19週から苦手な10語を選んで復習する。"},{"en":"Prepare one real-life issue you'd like to explain to a native speaker.","ja":"ネイティブに説明したい実生活の問題を1つ準備する。"}],"vocab":[{"ar":"أَسْكُنُ","roman":"askunu","en":"I live","ja":"私は住む","type":"verb","past":"سَكَنَ","present":"يَسْكُنُ","me":"أَسْكُنُ","example":{"ar":"أَسْكُنُ فِي دُبَيّ.","roman":"","en":"I live in Dubai.","ja":"ドバイに住んでいます。"}},{"ar":"أَعْمَلُ","roman":"aʿmalu","en":"I work","ja":"私は働く","type":"verb","past":"عَمِلَ","present":"يَعْمَلُ","me":"أَعْمَلُ","example":{"ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","roman":"","en":"I work for a Japanese company.","ja":"日本の会社で働いています。"}},{"ar":"أَتَعَلَّمُ","roman":"ataʿallamu","en":"I learn","ja":"私は学ぶ","type":"verb","past":"تَعَلَّمَ","present":"يَتَعَلَّمُ","me":"أَتَعَلَّمُ","example":{"ar":"أَتَعَلَّمُ الْعَرَبِيَّةَ.","roman":"","en":"I am learning Arabic.","ja":"アラビア語を勉強しています。"}},{"ar":"أَذْهَبُ","roman":"adhhabu","en":"I go","ja":"私は行く","type":"verb","past":"ذَهَبَ","present":"يَذْهَبُ","me":"أَذْهَبُ","example":{"ar":"سَأَذْهَبُ إِلَى الْمَطْعَمِ.","roman":"","en":"I will go to the restaurant.","ja":"レストランへ行きます。"}},{"ar":"أُرِيدُ","roman":"urīdu","en":"I want","ja":"私は欲しい","type":"verb","past":"أَرَادَ","present":"يُرِيدُ","me":"أُرِيدُ","example":{"ar":"أُرِيدُ قَهْوَةً.","roman":"","en":"I want coffee.","ja":"コーヒーが欲しいです。"}},{"ar":"أَحْتَاجُ","roman":"aḥtāju","en":"I need","ja":"私は必要とする","type":"verb","past":"اِحْتَاجَ","present":"يَحْتَاجُ","me":"أَحْتَاجُ","example":{"ar":"أَحْتَاجُ إِلَى مُسَاعَدَةٍ.","roman":"","en":"I need help.","ja":"手助けが必要です。"}},{"ar":"أَفْهَمُ","roman":"afhamu","en":"I understand","ja":"私は理解する","type":"verb","past":"فَهِمَ","present":"يَفْهَمُ","me":"أَفْهَمُ","example":{"ar":"لَا أَفْهَمُ هَذَا.","roman":"","en":"I don't understand this.","ja":"これは分かりません。"}},{"ar":"أَتَّصِلُ","roman":"attaṣilu","en":"I call","ja":"私は電話する","type":"verb","past":"اِتَّصَلَ","present":"يَتَّصِلُ","me":"أَتَّصِلُ","example":{"ar":"سَأَتَّصِلُ بِكَ غَدًا.","roman":"","en":"I'll call you tomorrow.","ja":"明日電話します。"}},{"ar":"أُرْسِلُ","roman":"ursilu","en":"I send","ja":"私は送る","type":"verb","past":"أَرْسَلَ","present":"يُرْسِلُ","me":"أُرْسِلُ","example":{"ar":"أُرْسِلُ رِسَالَةً.","roman":"","en":"I send a message.","ja":"メッセージを送ります。"}},{"ar":"أَشْتَرِي","roman":"ashtarī","en":"I buy","ja":"私は買う","type":"verb","past":"اِشْتَرَى","present":"يَشْتَرِي","me":"أَشْتَرِي","example":{"ar":"أَشْتَرِي هَذَا الْكِتَابَ.","roman":"","en":"I am buying this book.","ja":"この本を買います。"}},{"ar":"صَدِيقٌ","roman":"ṣadīqun","en":"friend (male)","ja":"友人（男性）","type":"noun","gender":"masculine","plural":"أَصْدِقَاءُ","example":{"ar":"زُرْتُ صَدِيقِي أَمْسِ.","roman":"","en":"I visited my friend yesterday.","ja":"昨日友人を訪ねました。"}},{"ar":"شَرِكَةٌ","roman":"sharikatun","en":"company","ja":"会社","type":"noun","gender":"feminine","plural":"شَرِكَاتٌ","example":{"ar":"هَذِهِ شَرِكَةٌ يَابَانِيَّةٌ.","roman":"","en":"This is a Japanese company.","ja":"これは日本の会社です。"}},{"ar":"مَطْعَمٌ","roman":"maṭʿamun","en":"restaurant","ja":"レストラン","type":"noun","gender":"masculine","plural":"مَطَاعِمُ","example":{"ar":"هَذَا مَطْعَمٌ جَيِّدٌ.","roman":"","en":"This is a good restaurant.","ja":"良いレストランです。"}},{"ar":"سِعْرٌ","roman":"siʿrun","en":"price","ja":"値段","type":"noun","gender":"masculine","plural":"أَسْعَارٌ","example":{"ar":"مَا سِعْرُ هَذَا؟","roman":"","en":"How much is this?","ja":"これはいくらですか？"}},{"ar":"مَوْعِدٌ","roman":"mawʿidun","en":"appointment","ja":"約束・予定","type":"noun","gender":"masculine","plural":"مَوَاعِيدُ","example":{"ar":"عِنْدِي مَوْعِدٌ غَدًا.","roman":"","en":"I have an appointment tomorrow.","ja":"明日約束があります。"}},{"ar":"رِسَالَةٌ","roman":"risālatun","en":"message","ja":"メッセージ","type":"noun","gender":"feminine","plural":"رَسَائِلُ","example":{"ar":"أُرْسِلُ رِسَالَةً.","roman":"","en":"I send a message.","ja":"メッセージを送ります。"}},{"ar":"عَيِّنَةٌ","roman":"ʿayyinatun","en":"sample","ja":"サンプル","type":"noun","gender":"feminine","plural":"عَيِّنَاتٌ","example":{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","roman":"","en":"The sample is ready.","ja":"サンプルは準備できています。"}},{"ar":"مُشْكِلَةٌ","roman":"mushkilatun","en":"problem","ja":"問題","type":"noun","gender":"feminine","plural":"مَشَاكِلُ","example":{"ar":"عِنْدِي مُشْكِلَةٌ.","roman":"","en":"I have a problem.","ja":"問題があります。"}},{"ar":"مَطَارٌ","roman":"maṭārun","en":"airport","ja":"空港","type":"noun","gender":"masculine","plural":"مَطَارَاتٌ","example":{"ar":"أَيْنَ الْمَطَارُ؟","roman":"","en":"Where is the airport?","ja":"空港はどこですか？"}},{"ar":"مَشْغُولٌ","roman":"mashghūlun","en":"busy (male)","ja":"忙しい（男性形）","type":"adj","fem":"مَشْغُولَةٌ","example":{"ar":"أَنَا مَشْغُولٌ الْيَوْمَ.","roman":"","en":"I'm busy today.","ja":"今日は忙しいです。"}},{"ar":"جَاهِزٌ","roman":"jāhizun","en":"ready (male)","ja":"準備できている","type":"adj","fem":"جَاهِزَةٌ","example":{"ar":"الطَّلَبُ جَاهِزٌ.","roman":"","en":"The order is ready.","ja":"注文の準備はできています。"}},{"ar":"قَرِيبٌ","roman":"qarībun","en":"near (male)","ja":"近い（男性形）","type":"adj","fem":"قَرِيبَةٌ","example":{"ar":"الْمَطْعَمُ قَرِيبٌ مِنْ هُنَا.","roman":"","en":"The restaurant is near here.","ja":"店はここから近いです。"}},{"ar":"أَمْسِ","roman":"amsi","en":"yesterday","ja":"昨日","type":"expression","example":{"ar":"دَرَسْتُ أَمْسِ.","roman":"","en":"I studied yesterday.","ja":"昨日勉強しました。"}},{"ar":"غَدًا","roman":"ghadan","en":"tomorrow","ja":"明日","type":"expression","example":{"ar":"سَأَذْهَبُ غَدًا.","roman":"","en":"I will go tomorrow.","ja":"明日行きます。"}}],"grammar":[{"title":"Present: person prefixes and basic endings","en":"Review أَكْتُبُ (I), نَكْتُبُ (we), تَكْتُبُ (you, male), يَكْتُبُ (he). For you female, تَكْتُبِينَ has a different ending. Not all verbs share the same internal vowels.","ja":"未完了形の主な接頭辞 أ / ن / ت / ي を復習。女性のあなたは تَكْتُبِينَ のように語尾も変わります。語幹母音は動詞ごとに確認します。","example":{"ar":"أَكْتُبُ · نَكْتُبُ · تَكْتُبُ · يَكْتُبُ","roman":"aktubu · naktubu · taktubu · yaktubu","en":"I / we / you(m.) / he write","ja":"私は／私たちは／あなたは／彼は書く"},"drill":"Give one verb and four people; learner produces all four forms."},{"title":"Past versus future","en":"Past/completed actions commonly use perfect forms: ذَهَبْتُ (I went). A simple future uses سَـ + imperfect: سَأَذْهَبُ (I will go). Mix both in a short real story.","ja":"過去の完了形 ذَهَبْتُ と、未来の سَـ＋未完了形 سَأَذْهَبُ を使い分けます。","example":{"ar":"ذَهَبْتُ أَمْسِ، وَسَأَذْهَبُ غَدًا.","roman":"dhahabtu amsi wa-sa-adhhabu ghadan","en":"I went yesterday, and I'll go tomorrow.","ja":"昨日行って、明日も行きます。"},"drill":"Teacher gives yesterday/tomorrow; learner switches time and verb accurately."},{"title":"Questions, negation and requests","en":"Use مَا / مَاذَا for what, أَيْنَ for where, مَتَى for when, كَمْ for how much, هَلْ for yes/no. Use لَا + imperfect for a basic present negative and مَا + perfect for a past negative.","ja":"疑問詞と否定文を総復習。「どこ・いつ・何・いくら・はい／いいえ」を自分から質問できるようにします。","example":{"ar":"لَا أَفْهَمُ. هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"lā afhamu · hal yumkinuka an tukarrira","en":"I don't understand. Can you repeat?","ja":"分かりません。繰り返してもらえますか？"},"drill":"Teacher gives one unexpected reply. Student must repair the conversation."},{"title":"Gender, plurals and formal case endings","en":"Arabic nouns have grammatical gender; adjectives agree with it. Learn singular and plural as pairs, especially broken plurals. Case endings (-un/-an/-in) help formal grammar but are often not fully pronounced in practical spoken Fuṣḥā.","ja":"名詞の男女・単複と形容詞の一致を復習します。形式的な格語尾は読解で重要ですが、会話中は省略されることが多いため、まず伝わる内容を重視します。","example":{"ar":"الطَّلَبُ جَاهِزٌ، وَالْعَيِّنَةُ جَاهِزَةٌ.","roman":"aṭ-ṭalabu jāhizun wa-l-ʿayyinatu jāhizatun","en":"The order is ready and the sample is ready.","ja":"注文とサンプルの準備ができています。"},"drill":"Teacher gives a masculine and feminine noun; student changes the adjective accordingly."}],"phrases":[{"ar":"أَنَا مِنَ الْيَابَانِ وَأَسْكُنُ فِي دُبَيّ.","roman":"anā mina al-yābāni wa-askunu fī dubayy","en":"I'm from Japan and live in Dubai.","ja":"日本出身でドバイに住んでいます。"},{"ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","roman":"aʿmalu fī sharikatin yābāniyyatin","en":"I work at a Japanese company.","ja":"日本企業で働いています。"},{"ar":"أَتَعَلَّمُ الْعَرَبِيَّةَ لِأَنَّهَا مُهِمَّةٌ لِي.","roman":"ataʿallamu al-ʿarabiyyata liʾannahā muhimmatun lī","en":"I'm learning Arabic because it's important to me.","ja":"大切なのでアラビア語を学んでいます。"},{"ar":"مَاذَا فَعَلْتَ أَمْسِ؟","roman":"mādhā faʿalta amsi","en":"What did you do yesterday? (to a man)","ja":"昨日何をしましたか？"},{"ar":"ذَهَبْتُ إِلَى الْعَمَلِ ثُمَّ رَجَعْتُ إِلَى الْبَيْتِ.","roman":"dhahabtu ilā al-ʿamali thumma rajaʿtu ilā al-bayti","en":"I went to work, then returned home.","ja":"仕事へ行き、その後帰宅しました。"},{"ar":"مَا رَأْيُكَ فِي هَذَا؟","roman":"mā raʾyuka fī hādhā","en":"What do you think about this?","ja":"これをどう思いますか？"},{"ar":"هَلْ نَذْهَبُ لِلْعَشَاءِ غَدًا؟","roman":"hal nadhhabu lil-ʿashāʾi ghadan","en":"Shall we have dinner tomorrow?","ja":"明日夕食に行きませんか？"},{"ar":"مَا سِعْرُ هَذَا؟","roman":"mā siʿru hādhā","en":"How much is this?","ja":"これはいくらですか？"},{"ar":"عِنْدِي مُشْكِلَةٌ، وَأَحْتَاجُ إِلَى مُسَاعَدَةٍ.","roman":"ʿindī mushkilatun wa-aḥtāju ilā musāʿadatin","en":"I have a problem and need help.","ja":"問題があり、助けが必要です。"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ بِبُطْءٍ؟","roman":"hal yumkinuka an tukarrira bibuṭʾin","en":"Could you repeat slowly? (to a man)","ja":"ゆっくり繰り返してもらえますか？"},{"ar":"سَأُرْسِلُ لَكَ رِسَالَةً غَدًا.","roman":"sa-ursilu laka risālatan ghadan","en":"I'll send you a message tomorrow. (to a man)","ja":"明日メッセージを送ります。"},{"ar":"مَتَى نَلْتَقِي وَأَيْنَ؟","roman":"matā naltaqī wa-ayna","en":"When and where shall we meet?","ja":"いつ、どこで会いましょうか？"}],"dialogues":[{"title":"Assessment model A: new acquaintance","turns":[{"role":"A","ar":"مَرْحَبًا، مِنْ أَيْنَ أَنْتَ؟","en":"Hello, where are you from?","ja":"こんにちは。ご出身は？"},{"role":"B","ar":"أَنَا مِنَ الْيَابَانِ وَأَسْكُنُ فِي دُبَيّ.","en":"I'm from Japan and live in Dubai.","ja":"日本出身でドバイに住んでいます。"},{"role":"A","ar":"مَاذَا تَعْمَلُ؟","en":"What do you do for work?","ja":"お仕事は？"},{"role":"B","ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","en":"I work for a Japanese company.","ja":"日本の会社で働いています。"},{"role":"A","ar":"وَلِمَاذَا تَتَعَلَّمُ الْعَرَبِيَّةَ؟","en":"Why are you learning Arabic?","ja":"なぜアラビア語を学んでいますか？"},{"role":"B","ar":"لِأَنَّنِي أَعْمَلُ هُنَا وَأُرِيدُ أَنْ أَتَكَلَّمَ مَعَ النَّاسِ.","en":"Because I work here and want to talk with people.","ja":"ここで働いており、人々と話したいからです。"},{"role":"A","ar":"هَلْ تُحِبُّ الْحَيَاةَ فِي دُبَيّ؟","en":"Do you like life in Dubai?","ja":"ドバイでの生活は好きですか？"},{"role":"B","ar":"نَعَمْ، وَلَكِنْ أَشْتَاقُ أَحْيَانًا إِلَى الْيَابَانِ.","en":"Yes, but I sometimes miss Japan.","ja":"はい。でも日本が恋しくなることもあります。"}],"twist":"Teacher asks two unfamiliar but simple follow-up questions. Learner answers by paraphrasing."},{"title":"Assessment model B: booking and change","turns":[{"role":"A","ar":"مَرْحَبًا، أُرِيدُ أَنْ أَحْجِزَ طَاوِلَةً لِشَخْصَيْنِ.","en":"Hello, I want to reserve a table for two.","ja":"こんにちは、2名で席を予約したいです。"},{"role":"B","ar":"مَتَى تُرِيدُ الْحَجْزَ؟","en":"When would you like the reservation?","ja":"いつのご予約ですか？"},{"role":"A","ar":"غَدًا فِي السَّاعَةِ السَّادِسَةِ.","en":"Tomorrow at six.","ja":"明日の6時です。"},{"role":"B","ar":"عُذْرًا، لَا تُوجَدُ طَاوِلَةٌ فِي السَّادِسَةِ.","en":"Sorry, there isn't a table at six.","ja":"すみません。6時は空席がありません。"},{"role":"A","ar":"هَلْ تُوجَدُ طَاوِلَةٌ فِي السَّابِعَةِ؟","en":"Is there a table at seven?","ja":"7時は空いていますか？"},{"role":"B","ar":"نَعَمْ، هُنَاكَ طَاوِلَةٌ فِي السَّابِعَةِ.","en":"Yes, there is a table at seven.","ja":"はい、7時ならあります。"},{"role":"A","ar":"جَيِّدٌ، هَلْ يُمْكِنُكَ أَنْ تُؤَكِّدَ الْحَجْزَ؟","en":"Good. Can you confirm the reservation?","ja":"よかった。予約を確認してもらえますか？"},{"role":"B","ar":"نَعَمْ، الْحَجْزُ لِشَخْصَيْنِ فِي السَّابِعَةِ.","en":"Yes, your booking is for two at seven.","ja":"はい。2名、7時の予約です。"}],"twist":"Change time and party size, then unexpectedly request a phone number. Learner confirms all details."},{"title":"Assessment model C: work sample and delay","turns":[{"role":"A","ar":"مَرْحَبًا، هَلْ وَصَلَتِ الْعَيِّنَةُ؟","en":"Hello, has the sample arrived?","ja":"こんにちは。サンプルは届きましたか？"},{"role":"B","ar":"لَا، لَمْ تَصِلْ بَعْدُ.","en":"No, it hasn't arrived yet.","ja":"いいえ、まだです。"},{"role":"A","ar":"مَا الْمُشْكِلَةُ؟","en":"What's the problem?","ja":"何が問題ですか？"},{"role":"B","ar":"هُنَاكَ تَأْخِيرٌ فِي التَّسْلِيمِ.","en":"There is a delay in delivery.","ja":"納品が遅れています。"},{"role":"A","ar":"مَتَى سَتَصِلُ الْعَيِّنَةُ؟","en":"When will the sample arrive?","ja":"いつ届きますか？"},{"role":"B","ar":"أَعْتَقِدُ أَنَّهَا سَتَصِلُ غَدًا.","en":"I think it will arrive tomorrow.","ja":"明日届くと思います。"},{"role":"A","ar":"هَلْ يُمْكِنُكَ أَنْ تُؤَكِّدَ ذَلِكَ فِي رِسَالَةٍ؟","en":"Can you confirm that in a message?","ja":"メッセージで確認できますか？"},{"role":"B","ar":"نَعَمْ، سَأَتَحَقَّقُ وَأُرْسِلُ رِسَالَةً الْيَوْمَ.","en":"Yes, I'll check and send a message today.","ja":"はい、確認して今日連絡します。"}],"twist":"Teacher changes the delivery estimate and asks for a new plan. Learner restates the next step."}],"classes":[{"goal":"Record the learner's unscripted performance before the final week's focused review.","jaGoal":"","missions":[{"en":"Give a 90-second self-introduction and describe your work.","ja":"90秒で自己紹介と仕事を説明する。"},{"en":"Tell a 60-second story about yesterday or a past trip.","ja":"昨日または旅行の話を60秒で話す。"},{"en":"Role-play a café or restaurant change without seeing the model.","ja":"カフェ・レストランでの予定変更を台本なしで行う。"}],"questions":[{"ar":"مِنْ أَيْنَ أَنْتَ؟","en":"Where are you from?","ja":"どこ出身ですか？"},{"ar":"مَاذَا فَعَلْتَ أَمْسِ؟","en":"What did you do yesterday?","ja":"昨日何をしましたか？"},{"ar":"لِمَاذَا تَتَعَلَّمُ الْعَرَبِيَّةَ؟","en":"Why are you learning Arabic?","ja":"なぜアラビア語を学んでいますか？"}]},{"goal":"Use baseline errors to run mixed scenarios with new details.","jaGoal":"","missions":[{"en":"Repeat a weak scenario after three precise corrections.","ja":"苦手場面を3つの修正を受けて再挑戦する。"},{"en":"Handle an unexpected phone or travel question.","ja":"予想外の電話・移動質問に答える。"},{"en":"Ask five questions yourself rather than only answering.","ja":"自分から5つ質問する。"}],"questions":[{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","en":"Can you repeat?","ja":"繰り返してもらえますか？"},{"ar":"مَاذَا تَعْنِي؟","en":"What do you mean?","ja":"どういう意味ですか？"},{"ar":"مَا الَّذِي سَتَفْعَلُهُ غَدًا؟","en":"What will you do tomorrow?","ja":"明日は何をしますか？"}]},{"goal":"Run the same benchmark tasks, score improvement and plan the next stage.","jaGoal":"","missions":[{"en":"Repeat the same self-introduction and story from Monday.","ja":"月曜日と同じ自己紹介・経験談を再録音する。"},{"en":"Do three surprise role-plays: social, travel and work.","ja":"日常・移動・仕事の3場面をランダムで行う。"},{"en":"Review six rubric scores and choose three priorities.","ja":"評価6項目を確認し、今後の課題を3つ決める。"}],"questions":[{"ar":"مَا رَأْيُكَ فِي تَعَلُّمِ الْعَرَبِيَّةِ؟","en":"What do you think of learning Arabic?","ja":"アラビア語学習をどう思いますか？"},{"ar":"هَلْ أَنْتَ مُتَاحٌ الْأُسْبُوعَ الْقَادِمَ؟","en":"Are you available next week?","ja":"来週は空いていますか？"},{"ar":"مَاذَا سَتَفْعَلُ لِتَتَحَسَّنَ؟","en":"What will you do to improve?","ja":"上達のために何をしますか？"}]}],"test":[{"en":"Say: I am from Japan and live in Dubai.","ja":"日本出身でドバイに住んでいます。","answer":{"ar":"أَنَا مِنَ الْيَابَانِ وَأَسْكُنُ فِي دُبَيّ.","roman":"anā mina al-yābāni wa-askunu fī dubayy","en":"Say: I am from Japan and live in Dubai.","ja":"日本出身でドバイに住んでいます。"}},{"en":"Say: I am learning Arabic.","ja":"アラビア語を学んでいます。","answer":{"ar":"أَتَعَلَّمُ الْعَرَبِيَّةَ.","roman":"ataʿallamu al-ʿarabiyyata","en":"Say: I am learning Arabic.","ja":"アラビア語を学んでいます。"}},{"en":"Say: I went to work yesterday.","ja":"昨日仕事に行きました。","answer":{"ar":"ذَهَبْتُ إِلَى الْعَمَلِ أَمْسِ.","roman":"dhahabtu ilā al-ʿamali amsi","en":"Say: I went to work yesterday.","ja":"昨日仕事に行きました。"}},{"en":"Say: I will go tomorrow.","ja":"明日行きます。","answer":{"ar":"سَأَذْهَبُ غَدًا.","roman":"sa-adhhabu ghadan","en":"Say: I will go tomorrow.","ja":"明日行きます。"}},{"en":"Ask: What is the price?","ja":"価格はいくらですか？","answer":{"ar":"مَا السِّعْرُ؟","roman":"mā as-siʿru","en":"Ask: What is the price?","ja":"価格はいくらですか？"}},{"en":"Say: I have a problem and need help.","ja":"問題があり、助けが必要です。","answer":{"ar":"عِنْدِي مُشْكِلَةٌ وَأَحْتَاجُ إِلَى مُسَاعَدَةٍ.","roman":"ʿindī mushkilatun wa-aḥtāju ilā musāʿadatin","en":"Say: I have a problem and need help.","ja":"問題があり、助けが必要です。"}},{"en":"Ask: Can you repeat slowly?","ja":"ゆっくり繰り返してもらえますか？","answer":{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ بِبُطْءٍ؟","roman":"hal yumkinuka an tukarrira bibuṭʾin","en":"Ask: Can you repeat slowly?","ja":"ゆっくり繰り返してもらえますか？"}},{"en":"Ask: When and where shall we meet?","ja":"いつ、どこで会いましょうか？","answer":{"ar":"مَتَى نَلْتَقِي وَأَيْنَ؟","roman":"matā naltaqī wa-ayna","en":"Ask: When and where shall we meet?","ja":"いつ、どこで会いましょうか？"}}],"checks":["I speak for 90–120 seconds without notes / 台本なしで90〜120秒話せる","I use present, past and future appropriately / 現在・過去・未来を使い分ける","I ask at least five questions / 自分から5つ以上質問できる","I confirm dates and recover from misunderstandings / 日時確認と聞き返しができる","I can compare the first and last recordings / 初回と最終回の録音を比較できる"],"assessment":{"note":"This rubric is an internal learning measure, not a CEFR certification. Use the same task difficulty in both attempts and compare scores cautiously. Ask permission before recording.","criteria":[{"key":"comprehension","en":"Comprehension","ja":"聞き取り・理解","desc":"Understands questions and necessary details without repeated English explanations"},{"key":"meaning","en":"Meaning & task completion","ja":"伝達・目的達成","desc":"Communicates the required information and reaches an outcome"},{"key":"interaction","en":"Interaction & repair","ja":"質問・聞き返し","desc":"Asks questions, clarifies uncertainty and keeps the conversation moving"},{"key":"grammar","en":"Core grammar","ja":"基礎文法","desc":"Uses basic person forms, past/future, questions and noun agreement"},{"key":"vocabulary","en":"Vocabulary access","ja":"語彙の取り出し","desc":"Uses known words without relying on a script for every sentence"},{"key":"pronunciation","en":"Pronunciation & fluency","ja":"発音・流暢さ","desc":"Speech is intelligible with manageable pauses; consonant length and key sounds are reasonably clear"}],"scale":["0 = no useful response / 回答不可","1 = needs continuous prompting / 頻繁な助けが必要","2 = some success with prompts / 助けがあれば一部できる","3 = largely independent / おおむね自力でできる","4 = independent and flexible / 自力で応用できる"],"benchmark":["Task A: 90-second introduction (origin, home, work, why Arabic) / 自己紹介90秒","Task B: 60–90-second past story plus one future plan / 過去の経験＋今後の予定","Task C: 2-minute customer/booking role-play with two unexpected changes / 予想外の変更2回を含む会話","Task D: Ask at least five spontaneous questions across themes / 異なる話題で質問を5つ"],"roadmap":["Next 4 weeks: recycle 150–250 useful words and speak 10 minutes each day; do not prioritise new grammar over retrieval.","Each week: one 3-minute free talk and one practical role-play, with three corrected expressions.","Add simple listening: 3–5 minutes of clear native Fuṣḥā, replaying only difficult short sections.","Compare Fuṣḥā and regional dialect in a separate labelled section; do not mix their grammatical forms.","At the next checkpoint, repeat the same rubric and task themes. If tasks are too easy, extend to 4–5 minute stories and explanations."]}}</script><script src="../assets/lesson-v3.js"></script><script defer src="../assets/site-navigation.js"></script></body></html>
