<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fuṣḥā speaking lesson 11: Airport, Travel & Unexpected Changes"><title>Week 11 — Airport, Travel & Unexpected Changes | Fuṣḥā Study Studio</title><link rel="stylesheet" href="../assets/lesson-engine.css"><link rel="stylesheet" href="../assets/site-navigation.css"></head><body><div class="top"><a href="../index.html">← Fuṣḥā Study Studio</a><div class="tools"><span class="voice-state" id="voice-state">Tap Arabic text for audio</span><button data-switch="ja" aria-pressed="true">日本語</button><button data-switch="en" aria-pressed="true">English</button><button data-switch="answers" aria-pressed="false">Answers</button><button onclick="window.print()">Print / PDF</button></div></div><main id="content" class="wrap"></main><script>window.LESSON_DATA={"week":11,"title":"Airport, Travel & Unexpected Changes","jaTitle":"空港・旅行・予定変更","arTitle":"فِي الْمَطَارِ وَأَثْنَاءَ السَّفَرِ","dates":"11 · 13 · 15 Jan 2027","outcome":"Navigate an airport, ask about a flight and gate, explain a baggage problem, and change a travel plan.","goals":["Ask the check-in or boarding-gate location / チェックインと搭乗口を尋ねる","Understand a departure time and flight delay / 出発時刻と遅延を理解する","Request a seat or information politely / 座席や情報を丁寧に依頼する","Explain an airport problem with simple sentences / 空港の問題を簡単に説明する"],"review":[{"en":"Week 5: Ask about the time, then change an appointment.","ja":"第5週：時間を尋ね、予定を変更する。"},{"en":"Week 10: Ask someone to speak slowly and repeat a number.","ja":"第10週：ゆっくり話すよう頼み、番号を復唱する。"},{"en":"Week 7: Explain a hotel room problem and ask for help.","ja":"第7週：ホテルの問題を説明し、助けを求める。"}],"vocab":[{"ar":"أُسَافِرُ","roman":"usāfiru","en":"I travel","ja":"私は旅行する","type":"verb","past":"سَافَرَ","present":"يُسَافِرُ","me":"أُسَافِرُ","example":{"ar":"أُسَافِرُ إِلَى الْيَابَانِ.","en":"I travel to Japan.","ja":"日本へ旅行します。"}},{"ar":"أَصِلُ","roman":"aṣilu","en":"I arrive","ja":"私は到着する","type":"verb","past":"وَصَلَ","present":"يَصِلُ","me":"أَصِلُ","example":{"ar":"أَصِلُ فِي السَّابِعَةِ.","en":"I arrive at seven.","ja":"7時に到着します。"}},{"ar":"أُغَادِرُ","roman":"ughādiru","en":"I leave / depart","ja":"私は出発する","type":"verb","past":"غَادَرَ","present":"يُغَادِرُ","me":"أُغَادِرُ","example":{"ar":"أُغَادِرُ دُبَيّ غَدًا.","en":"I leave Dubai tomorrow.","ja":"明日ドバイを出発します。"}},{"ar":"أَحْجِزُ","roman":"aḥjizu","en":"I book / reserve","ja":"私は予約する","type":"verb","past":"حَجَزَ","present":"يَحْجِزُ","me":"أَحْجِزُ","example":{"ar":"أَحْجِزُ تَذْكِرَةً.","en":"I book a ticket.","ja":"航空券を予約します。"}},{"ar":"أَنْتَظِرُ","roman":"antaẓiru","en":"I wait","ja":"私は待つ","type":"verb","past":"اِنْتَظَرَ","present":"يَنْتَظِرُ","me":"أَنْتَظِرُ","example":{"ar":"أَنْتَظِرُ فِي الْمَطَارِ.","en":"I wait at the airport.","ja":"空港で待ちます。"}},{"ar":"أَبْحَثُ","roman":"abḥathu","en":"I look for","ja":"私は探す","type":"verb","past":"بَحَثَ","present":"يَبْحَثُ","me":"أَبْحَثُ","example":{"ar":"أَبْحَثُ عَنْ بَوَّابَتِي.","en":"I am looking for my gate.","ja":"自分の搭乗口を探しています。"}},{"ar":"أَجِدُ","roman":"ajidu","en":"I find","ja":"私は見つける","type":"verb","past":"وَجَدَ","present":"يَجِدُ","me":"أَجِدُ","example":{"ar":"لَا أَجِدُ حَقِيبَتِي.","en":"I cannot find my bag.","ja":"バッグが見つかりません。"}},{"ar":"مَطَارٌ","roman":"maṭārun","en":"airport","ja":"空港","type":"noun","gender":"masculine","plural":"مَطَارَاتٌ","example":{"ar":"الْمَطَارُ كَبِيرٌ.","en":"The airport is large.","ja":"空港は大きいです。"}},{"ar":"طَائِرَةٌ","roman":"ṭāʾiratun","en":"airplane","ja":"飛行機","type":"noun","gender":"feminine","plural":"طَائِرَاتٌ","example":{"ar":"الطَّائِرَةُ جَاهِزَةٌ.","en":"The airplane is ready.","ja":"飛行機は準備できています。"}},{"ar":"رِحْلَةٌ","roman":"riḥlatun","en":"flight / trip","ja":"便・旅行","type":"noun","gender":"feminine","plural":"رِحْلَاتٌ","example":{"ar":"رِحْلَتِي غَدًا.","en":"My flight is tomorrow.","ja":"私の便は明日です。"}},{"ar":"تَذْكِرَةٌ","roman":"tadhkiratun","en":"ticket","ja":"チケット","type":"noun","gender":"feminine","plural":"تَذَاكِرُ","example":{"ar":"هَذِهِ تَذْكِرَتِي.","en":"This is my ticket.","ja":"これが私のチケットです。"}},{"ar":"جَوَازُ سَفَرٍ","roman":"jawāzu safarin","en":"passport","ja":"パスポート","type":"noun","gender":"masculine","plural":"جَوَازَاتُ سَفَرٍ","example":{"ar":"هَذَا جَوَازُ سَفَرِي.","en":"This is my passport.","ja":"これがパスポートです。"}},{"ar":"حَقِيبَةٌ","roman":"ḥaqībatun","en":"bag / suitcase","ja":"荷物・バッグ","type":"noun","gender":"feminine","plural":"حَقَائِبُ","example":{"ar":"حَقِيبَتِي مَفْقُودَةٌ.","en":"My bag is missing.","ja":"私の荷物が見つかりません。"}},{"ar":"بَوَّابَةٌ","roman":"bawwābatun","en":"gate","ja":"ゲート","type":"noun","gender":"feminine","plural":"بَوَّابَاتٌ","example":{"ar":"أَيْنَ الْبَوَّابَةُ؟","en":"Where is the gate?","ja":"ゲートはどこですか？"}},{"ar":"مَقْعَدٌ","roman":"maqʿadun","en":"seat","ja":"座席","type":"noun","gender":"masculine","plural":"مَقَاعِدُ","example":{"ar":"أُرِيدُ مَقْعَدًا بِجَانِبِ النَّافِذَةِ.","en":"I want a window seat.","ja":"窓側の席が欲しいです。"}},{"ar":"نَافِذَةٌ","roman":"nāfidhatun","en":"window","ja":"窓","type":"noun","gender":"feminine","plural":"نَوَافِذُ","example":{"ar":"أُرِيدُ مَقْعَدًا بِجَانِبِ النَّافِذَةِ.","en":"I want a window seat.","ja":"窓側の席を希望します。"}},{"ar":"تَأْشِيرَةٌ","roman":"taʾshīratun","en":"visa","ja":"ビザ","type":"noun","gender":"feminine","plural":"تَأْشِيرَاتٌ","example":{"ar":"عِنْدِي تَأْشِيرَةٌ.","en":"I have a visa.","ja":"ビザを持っています。"}},{"ar":"وَقْتٌ","roman":"waqtun","en":"time","ja":"時間","type":"noun","gender":"masculine","plural":"أَوْقَاتٌ","example":{"ar":"مَا وَقْتُ الْإِقْلَاعِ؟","en":"What is the departure time?","ja":"離陸時刻は何時ですか？"}},{"ar":"مُغَادَرَةٌ","roman":"mughādaratun","en":"departure","ja":"出発","type":"noun","gender":"feminine","plural":"مُغَادَرَاتٌ","example":{"ar":"صَالَةُ الْمُغَادَرَاتِ هُنَاكَ.","en":"The departures hall is over there.","ja":"出発ロビーはあちらです。"}},{"ar":"وُصُولٌ","roman":"wuṣūlun","en":"arrival","ja":"到着","type":"noun","gender":"masculine","plural":"—","example":{"ar":"وَقْتُ الْوُصُولِ مَسَاءً.","en":"Arrival time is in the evening.","ja":"到着予定は夕方です。"}},{"ar":"مُبَاشِرٌ","roman":"mubāshirun","en":"direct (m.)","ja":"直行の（男性形）","type":"adj","fem":"مُبَاشِرَةٌ","example":{"ar":"هَذِهِ رِحْلَةٌ مُبَاشِرَةٌ.","en":"This is a direct flight.","ja":"直行便です。"}},{"ar":"مُتَأَخِّرٌ","roman":"mutaʾakhkhirun","en":"late / delayed (m.)","ja":"遅れた（男性形）","type":"adj","fem":"مُتَأَخِّرَةٌ","example":{"ar":"الرِّحْلَةُ مُتَأَخِّرَةٌ.","en":"The flight is delayed.","ja":"便は遅れています。"}},{"ar":"مَفْقُودٌ","roman":"mafqūdun","en":"missing (m.)","ja":"紛失した（男性形）","type":"adj","fem":"مَفْقُودَةٌ","example":{"ar":"حَقِيبَتِي مَفْقُودَةٌ.","en":"My bag is missing.","ja":"荷物が見つかりません。"}},{"ar":"صَحِيحٌ","roman":"ṣaḥīḥun","en":"correct (m.)","ja":"正しい（男性形）","type":"adj","fem":"صَحِيحَةٌ","example":{"ar":"هَلْ هَذَا الرَّقْمُ صَحِيحٌ؟","en":"Is this number correct?","ja":"この番号は正しいですか？"}}],"grammar":[{"title":"Travel with إِلَى and مِنْ","en":"Use إِلَى for your destination (to) and مِنْ for your starting point (from). Both are followed by a noun in the genitive in fully vocalized Fuṣḥā.","ja":"行き先は إِلَى（〜へ）、出発点は مِنْ（〜から）。フスハーの完全な格語尾では前置詞の後は属格です。","example":{"ar":"أُسَافِرُ مِنْ دُبَيّ إِلَى الْيَابَانِ.","roman":"usāfiru min dubayy ilā al-yābāni","en":"I travel from Dubai to Japan.","ja":"ドバイから日本へ行きます。"},"drill":"Change the destination to Muscat, Riyadh and Tokyo."},{"title":"Future versus past travel","en":"Use سَـ + imperfect for the future: سَأُسَافِرُ. Use the perfect for a completed trip: سَافَرْتُ. Notice the difference between a person prefix and a past ending.","ja":"「旅行する予定」は سَأُسَافِرُ、「旅行した」は سَافَرْتُ。未完了形は接頭辞、完了形の「私」は語尾 ـتُ で区別します。","example":{"ar":"سَافَرْتُ أَمْسِ، وَسَأُسَافِرُ غَدًا.","roman":"sāfartu amsi · wa-sa-usāfiru ghadan","en":"I travelled yesterday, and will travel tomorrow.","ja":"昨日旅行し、明日も旅行する予定です。"},"drill":"Teacher says yesterday or tomorrow; student changes the verb to the appropriate tense."},{"title":"Flights and feminine adjective agreement","en":"رِحْلَةٌ is feminine. Therefore 'direct', 'delayed' or 'new' in a description typically uses a feminine adjective form.","ja":"便（رِحْلَةٌ）は女性名詞。直行便・遅延した便などは形容詞の女性形にします。","example":{"ar":"هَذِهِ رِحْلَةٌ مُبَاشِرَةٌ.","roman":"hādhihi riḥlatun mubāshiratun","en":"This is a direct flight.","ja":"これは直行便です。"},"drill":"Ask 'Is the flight direct/delayed?' and change each answer from positive to negative."},{"title":"Where is the boarding gate?","en":"Use أَيْنَ followed by a definite noun phrase to ask for a place. To ask for a window seat, use بِجَانِبِ النَّافِذَةِ (beside the window).","ja":"場所を聞くときは أَيْنَ + 名詞。窓側の席は بِجَانِبِ النَّافِذَةِ と言えます。","example":{"ar":"أَيْنَ بَوَّابَةُ الصُّعُودِ؟","roman":"ayna bawwābatu aṣ-ṣuʿūdi?","en":"Where is the boarding gate?","ja":"搭乗口はどこですか？"},"drill":"Ask for baggage claim, gate and airline counter; teacher points in different directions."}],"phrases":[{"ar":"أُسَافِرُ إِلَى الْيَابَانِ غَدًا.","roman":"usāfiru ilā al-yābāni ghadan","en":"I am travelling to Japan tomorrow.","ja":"明日、日本へ行きます。"},{"ar":"عِنْدِي حَجْزٌ عَلَى هَذِهِ الرِّحْلَةِ.","roman":"ʿindī ḥajzun ʿalā hādhihi ar-riḥlati","en":"I have a booking on this flight.","ja":"この便を予約しています。"},{"ar":"أَيْنَ مَكْتَبُ شَرِكَةِ الطَّيَرَانِ؟","roman":"ayna maktabu sharikati aṭ-ṭayarāni?","en":"Where is the airline counter?","ja":"航空会社のカウンターはどこですか？"},{"ar":"هَذَا جَوَازُ سَفَرِي.","roman":"hādhā jawāzu safarī","en":"This is my passport.","ja":"これが私のパスポートです。"},{"ar":"أَيْنَ بَوَّابَةُ الصُّعُودِ؟","roman":"ayna bawwābatu aṣ-ṣuʿūdi?","en":"Where is the boarding gate?","ja":"搭乗口はどこですか？"},{"ar":"مَتَى تُقْلِعُ الطَّائِرَةُ؟","roman":"matā tuqliʿu aṭ-ṭāʾiratu?","en":"When does the plane take off?","ja":"何時に離陸しますか？"},{"ar":"هَلْ تَأَخَّرَتِ الرِّحْلَةُ؟","roman":"hal taʾakhkharati ar-riḥlatu?","en":"Has the flight been delayed?","ja":"飛行機は遅れていますか？"},{"ar":"هَلْ هَذِهِ الرِّحْلَةُ مُبَاشِرَةٌ؟","roman":"hal hādhihi ar-riḥlatu mubāshiratun?","en":"Is this a direct flight?","ja":"これは直行便ですか？"},{"ar":"أُرِيدُ مَقْعَدًا بِجَانِبِ النَّافِذَةِ.","roman":"urīdu maqʿadan bijānibi an-nāfidhati","en":"I would like a window seat.","ja":"窓側の席をお願いします。"},{"ar":"لَا أَجِدُ حَقِيبَتِي.","roman":"lā ajidu ḥaqībatī","en":"I cannot find my bag.","ja":"荷物が見つかりません。"},{"ar":"أَيْنَ اسْتِلَامُ الْأَمْتِعَةِ؟","roman":"ayna istilāmu al-amtiʿati?","en":"Where is baggage claim?","ja":"手荷物受取所はどこですか？"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُسَاعِدَنِي؟","roman":"hal yumkinuka an tusāʿidanī?","en":"Can you help me? (to a man)","ja":"手伝ってもらえますか？"}],"dialogues":[{"title":"Check in for a flight","turns":[{"role":"A","ar":"مَرْحَبًا، عِنْدِي حَجْزٌ عَلَى هَذِهِ الرِّحْلَةِ.","en":"Hello, I have a booking on this flight.","ja":"こんにちは。この便を予約しています。"},{"role":"B","ar":"مَرْحَبًا. هَلْ مَعَكَ جَوَازُ السَّفَرِ؟","en":"Hello. Do you have your passport?","ja":"こんにちは。パスポートはありますか？"},{"role":"A","ar":"نَعَمْ، هَذَا جَوَازُ سَفَرِي.","en":"Yes, here is my passport.","ja":"はい、こちらです。"},{"role":"B","ar":"هَلْ عِنْدَكَ حَقِيبَةٌ؟","en":"Do you have a bag?","ja":"荷物はありますか？"},{"role":"A","ar":"نَعَمْ، عِنْدِي حَقِيبَةٌ وَاحِدَةٌ.","en":"Yes, I have one bag.","ja":"はい、1つあります。"},{"role":"B","ar":"حَسَنًا. رَقْمُ بَوَّابَةِ الصُّعُودِ خَمْسَةٌ.","en":"Okay. Your boarding gate is number five.","ja":"分かりました。搭乗口は5番です。"}],"twist":"Change the boarding gate from 5 to 8 and request a window seat."},{"title":"A delayed flight","turns":[{"role":"A","ar":"عُذْرًا، هَلْ تَأَخَّرَتِ الرِّحْلَةُ؟","en":"Excuse me, has the flight been delayed?","ja":"すみません、便は遅れていますか？"},{"role":"B","ar":"نَعَمْ، تَأَخَّرَتْ سَاعَةً وَاحِدَةً.","en":"Yes, it is delayed by one hour.","ja":"はい、1時間遅れています。"},{"role":"A","ar":"مَتَى تُقْلِعُ الطَّائِرَةُ الْآنَ؟","en":"When will the plane take off now?","ja":"今の出発時刻は？"},{"role":"B","ar":"فِي السَّاعَةِ الثَّامِنَةِ.","en":"At eight o'clock.","ja":"8時です。"},{"role":"A","ar":"هَلْ بَوَّابَةُ الصُّعُودِ نَفْسُهَا؟","en":"Is the boarding gate the same?","ja":"搭乗口は同じですか？"},{"role":"B","ar":"نَعَمْ، نَفْسُ الْبَوَّابَةِ.","en":"Yes, the same gate.","ja":"はい、同じ搭乗口です。"}],"twist":"Teacher changes time and gate; student must repeat both back accurately."},{"title":"Missing luggage","turns":[{"role":"A","ar":"عُذْرًا، لَا أَجِدُ حَقِيبَتِي.","en":"Excuse me, I cannot find my suitcase.","ja":"すみません、荷物が見つかりません。"},{"role":"B","ar":"هَلْ وَصَلْتَ الْيَوْمَ؟","en":"Did you arrive today?","ja":"今日到着しましたか？"},{"role":"A","ar":"نَعَمْ، وَصَلْتُ مِنْ دُبَيّ.","en":"Yes, I arrived from Dubai.","ja":"はい、ドバイから到着しました。"},{"role":"B","ar":"هَلْ عِنْدَكَ رَقْمُ الرِّحْلَةِ؟","en":"Do you have the flight number?","ja":"便名は分かりますか？"},{"role":"A","ar":"نَعَمْ، هَذَا رَقْمُ الرِّحْلَةِ.","en":"Yes, here is the flight number.","ja":"はい、これが便名です。"},{"role":"B","ar":"سَنَتَحَقَّقُ مِنَ الْمَعْلُومَاتِ.","en":"We will check the information.","ja":"情報を確認します。"}],"twist":"The staff asks for bag colour and a phone number; learner uses descriptions and clarification language."}],"classes":[{"day":"Mon 11 Jan 2027","name":"BUILD · Check in and find the gate","goal":"Ask for a location and show documents.","missions":[{"en":"Check in with your flight booking and passport.","ja":"便の予約とパスポートを示してチェックインする。"},{"en":"Ask for a boarding gate and confirm its number.","ja":"搭乗口を尋ねて番号を確認する。"},{"en":"Ask whether the flight is direct.","ja":"直行便かどうか質問する。"}],"questions":[{"ar":"أَيْنَ بَوَّابَةُ الصُّعُودِ؟","en":"Where is the boarding gate?","ja":"搭乗口はどこですか？"},{"ar":"هَلْ مَعَكَ جَوَازُ السَّفَرِ؟","en":"Do you have your passport?","ja":"パスポートは？"},{"ar":"هَلْ هَذِهِ الرِّحْلَةُ مُبَاشِرَةٌ؟","en":"Is this a direct flight?","ja":"直行便ですか？"}],"teacher":"Change gate numbers and ask the learner to repeat each one.","exit":"45 sec: complete check-in without reading."},{"day":"Wed 13 Jan 2027","name":"USE · A flight delay","goal":"Ask about delay and new departure time.","missions":[{"en":"Teacher announces a delayed flight; ask for the new time.","ja":"遅延を告げられ、新しい出発時刻を聞く。"},{"en":"The gate changes; ask for directions.","ja":"ゲートが変わり、道順を聞く。"},{"en":"Ask for help and confirm information again.","ja":"助けを求め、情報を復唱する。"}],"questions":[{"ar":"مَتَى تُقْلِعُ الطَّائِرَةُ؟","en":"When does the plane depart?","ja":"何時に出発しますか？"},{"ar":"هَلْ تَأَخَّرَتِ الرِّحْلَةُ؟","en":"Is the flight delayed?","ja":"便は遅れていますか？"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","en":"Can you repeat?","ja":"繰り返してもらえますか？"}],"teacher":"Change the time once more; student must handle the unexpected second delay.","exit":"2 min: obtain and confirm gate plus departure time."},{"day":"Fri 15 Jan 2027","name":"TRANSFER · Solve baggage problem","goal":"Explain problem, answer questions and request next step.","missions":[{"en":"Your suitcase is missing. Explain the issue.","ja":"荷物紛失を説明する。"},{"en":"Give flight number and describe your bag.","ja":"便名と荷物の特徴を説明する。"},{"en":"Arrange when the airline can contact you.","ja":"航空会社からの連絡時刻を調整する。"}],"questions":[{"ar":"مِنْ أَيْنَ وَصَلْتَ؟","en":"Where did you arrive from?","ja":"どこから到着しましたか？"},{"ar":"مَا لَوْنُ حَقِيبَتِكَ؟","en":"What colour is your bag?","ja":"荷物は何色ですか？"},{"ar":"مَا رَقْمُ هَاتِفِكَ؟","en":"What is your phone number?","ja":"電話番号は？"}],"teacher":"Teach the colour word only if needed; learner must create a complete description and ask for the next step.","exit":"90 sec: explain lost luggage and confirm contact details."}],"test":[{"en":"Say: I will travel to Japan tomorrow.","ja":"明日、日本へ行きます。","answer":{"ar":"سَأُسَافِرُ إِلَى الْيَابَانِ غَدًا.","roman":"sa-usāfiru ilā al-yābāni ghadan","en":"Model answer","ja":"回答例"}},{"en":"Ask where the boarding gate is.","ja":"搭乗口はどこですか？","answer":{"ar":"أَيْنَ بَوَّابَةُ الصُّعُودِ؟","roman":"ayna bawwābatu aṣ-ṣuʿūdi","en":"Model answer","ja":"回答例"}},{"en":"Ask whether the flight is delayed.","ja":"便が遅れているか尋ねる。","answer":{"ar":"هَلْ تَأَخَّرَتِ الرِّحْلَةُ؟","roman":"hal taʾakhkharati ar-riḥlatu","en":"Model answer","ja":"回答例"}},{"en":"Request a window seat.","ja":"窓側の席をお願いする。","answer":{"ar":"أُرِيدُ مَقْعَدًا بِجَانِبِ النَّافِذَةِ.","roman":"urīdu maqʿadan bijānibi an-nāfidhati","en":"Model answer","ja":"回答例"}},{"en":"Say: I cannot find my bag.","ja":"荷物が見つかりません。","answer":{"ar":"لَا أَجِدُ حَقِيبَتِي.","roman":"lā ajidu ḥaqībatī","en":"Model answer","ja":"回答例"}},{"en":"Ask a man to help you.","ja":"手伝ってもらえますか？","answer":{"ar":"هَلْ يُمْكِنُكَ أَنْ تُسَاعِدَنِي؟","roman":"hal yumkinuka an tusāʿidanī","en":"Model answer","ja":"回答例"}}],"checks":["I can ask questions proactively / 自分から質問できる","I can answer without notes / 資料なしで答えられる","I can clarify a misunderstanding / 聞き返し・確認ができる","I can reuse earlier grammar / 既習文法を組み合わせられる","I can repeat the role-play after feedback / 修正後に言い直せる"],"speaking":{"fusha":"Use clear place questions (أَيْنَ), time questions (مَتَى), and short complete sentences. You can pronounce with or without word-final case endings in connected practical speech, but understand the grammar in the written model.","real":"Airport personnel in Dubai commonly use English with international travellers. Arabic is useful for practice and local interactions, but signs and announcements may use formal Arabic and English. Expect a mixture of regional accents."}};</script><script src="../assets/lesson-engine.js"></script><script defer src="../assets/site-navigation.js"></script></body></html>
