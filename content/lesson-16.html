<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103741"><meta name="description" content="Modern Standard Arabic speaking lesson 16 with Japanese and English explanations."><title>Lesson 16 | Fuṣḥā Study Studio</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"><link rel="stylesheet" href="../assets/lesson-v3.css"><link rel="stylesheet" href="../assets/site-navigation.css"></head><body><main id="content" aria-label="Arabic learning lesson"></main><script>window.LESSON_DATA={"week":16,"title":"Business Meetings, Terms & Follow-up","jaTitle":"商談・条件の確認・次のアクション","arTitle":"الِاجْتِمَاعَاتُ وَالشُّرُوطُ وَالْمُتَابَعَةُ","outcome":"Hold a short business meeting: confirm price and quantity, discuss delivery and payment timing, propose a condition and summarise the next steps.","goals":["Open a business discussion and introduce the topic / 会議の話題を示す","Ask and answer price, quantity and delivery questions / 価格・数量・納期を確認する","Explain a basic condition or requirement / 条件を短く説明する","Summarise who will do what by when / 誰がいつ何をするか確認する"],"review":[{"en":"Lesson 9: Introduce a product and describe a sample.","ja":"第9課：商品を紹介しサンプルを説明する。"},{"en":"Lesson 13: Explain why one option is better than another.","ja":"第13課：どちらが良いか理由を話す。"},{"en":"Lesson 15: Report a delay and confirm a new date.","ja":"第15課：遅延を報告して新しい日付を確認する。"}],"vocab":[{"ar":"أُنَاقِشُ","roman":"unāqishu","en":"I discuss","ja":"私は話し合う","type":"verb","past":"نَاقَشَ","present":"يُنَاقِشُ","me":"أُنَاقِشُ","example":{"ar":"أُنَاقِشُ السِّعْرَ مَعَ الْعَمِيلِ.","roman":"","en":"I discuss the price with the customer.","ja":"顧客と価格を協議します。"}},{"ar":"أُوَافِقُ","roman":"uwāfiqu","en":"I agree","ja":"私は同意する","type":"verb","past":"وَافَقَ","present":"يُوَافِقُ","me":"أُوَافِقُ","example":{"ar":"أُوَافِقُ عَلَى السِّعْرِ.","roman":"","en":"I agree on the price.","ja":"その価格で同意します。"}},{"ar":"أُؤَكِّدُ","roman":"uʾakkidu","en":"I confirm","ja":"私は確認する","type":"verb","past":"أَكَّدَ","present":"يُؤَكِّدُ","me":"أُؤَكِّدُ","example":{"ar":"أُؤَكِّدُ الْمَوْعِدَ.","roman":"","en":"I confirm the time.","ja":"日時を確認します。"}},{"ar":"أُرْسِلُ","roman":"ursilu","en":"I send","ja":"私は送る","type":"verb","past":"أَرْسَلَ","present":"يُرْسِلُ","me":"أُرْسِلُ","example":{"ar":"أُرْسِلُ الْفَاتُورَةَ الْيَوْمَ.","roman":"","en":"I send the invoice today.","ja":"今日請求書を送ります。"}},{"ar":"أَسْتَلِمُ","roman":"astalimu","en":"I receive","ja":"私は受け取る","type":"verb","past":"اِسْتَلَمَ","present":"يَسْتَلِمُ","me":"أَسْتَلِمُ","example":{"ar":"أَسْتَلِمُ الْمَبْلَغَ غَدًا.","roman":"","en":"I will receive the amount tomorrow.","ja":"明日代金を受け取ります。"}},{"ar":"أَدْفَعُ","roman":"adfaʿu","en":"I pay","ja":"私は支払う","type":"verb","past":"دَفَعَ","present":"يَدْفَعُ","me":"أَدْفَعُ","example":{"ar":"أَدْفَعُ الْمَبْلَغَ الْيَوْمَ.","roman":"","en":"I pay the amount today.","ja":"今日支払います。"}},{"ar":"أُسَلِّمُ","roman":"usallimu","en":"I deliver / hand over","ja":"私は納品する","type":"verb","past":"سَلَّمَ","present":"يُسَلِّمُ","me":"أُسَلِّمُ","example":{"ar":"أُسَلِّمُ الْمُنْتَجَ غَدًا.","roman":"","en":"I deliver the product tomorrow.","ja":"明日製品を納めます。"}},{"ar":"أُخَفِّضُ","roman":"ukhaffiḍu","en":"I reduce (price)","ja":"私は値下げする","type":"verb","past":"خَفَّضَ","present":"يُخَفِّضُ","me":"أُخَفِّضُ","example":{"ar":"أُخَفِّضُ السِّعْرَ قَلِيلًا.","roman":"","en":"I lower the price a little.","ja":"少し値下げします。"}},{"ar":"عَقْدٌ","roman":"ʿaqdun","en":"contract","ja":"契約","type":"noun","gender":"masculine","plural":"عُقُودٌ","example":{"ar":"هَذَا عَقْدٌ جَدِيدٌ.","roman":"","en":"This is a new contract.","ja":"これは新しい契約です。"}},{"ar":"شَرْطٌ","roman":"sharṭun","en":"condition / term","ja":"条件","type":"noun","gender":"masculine","plural":"شُرُوطٌ","example":{"ar":"مَا شُرُوطُ الدَّفْعِ؟","roman":"","en":"What are the payment terms?","ja":"決済条件は何ですか？"}},{"ar":"دَفْعٌ","roman":"dafʿun","en":"payment","ja":"支払い","type":"noun","gender":"masculine","plural":"—","example":{"ar":"يَجِبُ الدَّفْعُ قَبْلَ الشَّحْنِ.","roman":"","en":"Payment must be made before shipping.","ja":"出荷前の支払いが必要です。"}},{"ar":"دُفْعَةٌ","roman":"dufʿatun","en":"instalment / payment","ja":"支払い・分割分","type":"noun","gender":"feminine","plural":"دُفْعَاتٌ","example":{"ar":"هَذِهِ الدُّفْعَةُ الْأُولَى.","roman":"","en":"This is the first payment.","ja":"これは最初の支払いです。"}},{"ar":"مَبْلَغٌ","roman":"mablaghun","en":"amount (of money)","ja":"金額","type":"noun","gender":"masculine","plural":"مَبَالِغُ","example":{"ar":"مَا الْمَبْلَغُ الْمَطْلُوبُ؟","roman":"","en":"What amount is required?","ja":"必要金額はいくらですか？"}},{"ar":"سِعْرٌ","roman":"siʿrun","en":"price","ja":"価格","type":"noun","gender":"masculine","plural":"أَسْعَارٌ","example":{"ar":"هَذَا السِّعْرُ نِهَائِيٌّ.","roman":"","en":"This is the final price.","ja":"これが最終価格です。"}},{"ar":"كَمِّيَّةٌ","roman":"kammiyyatun","en":"quantity","ja":"数量","type":"noun","gender":"feminine","plural":"كَمِّيَّاتٌ","example":{"ar":"الْكَمِّيَّةُ كَبِيرَةٌ.","roman":"","en":"The quantity is large.","ja":"数量が多いです。"}},{"ar":"خَصْمٌ","roman":"khaṣmun","en":"discount","ja":"値引き","type":"noun","gender":"masculine","plural":"خُصُومَاتٌ","example":{"ar":"هَلْ يُمْكِنُ تَقْدِيمُ خَصْمٍ؟","roman":"","en":"Is a discount possible?","ja":"値引きは可能ですか？"}},{"ar":"تَسْلِيمٌ","roman":"taslīmun","en":"delivery","ja":"納品","type":"noun","gender":"masculine","plural":"—","example":{"ar":"مَوْعِدُ التَّسْلِيمِ يَوْمُ الْخَمِيسِ.","roman":"","en":"Delivery is on Thursday.","ja":"納品日は木曜です。"}},{"ar":"شَحْنٌ","roman":"shaḥnun","en":"shipping","ja":"出荷・輸送","type":"noun","gender":"masculine","plural":"—","example":{"ar":"الشَّحْنُ بَعْدَ الدَّفْعِ.","roman":"","en":"Shipping is after payment.","ja":"出荷は支払い後です。"}},{"ar":"فَاتُورَةٌ","roman":"fātūratun","en":"invoice","ja":"請求書","type":"noun","gender":"feminine","plural":"فَوَاتِيرُ","example":{"ar":"سَأُرْسِلُ الْفَاتُورَةَ الْيَوْمَ.","roman":"","en":"I'll send the invoice today.","ja":"今日請求書を送ります。"}},{"ar":"عَيِّنَةٌ","roman":"ʿayyinatun","en":"sample","ja":"サンプル","type":"noun","gender":"feminine","plural":"عَيِّنَاتٌ","example":{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","roman":"","en":"The sample is ready.","ja":"サンプルの準備ができています。"}},{"ar":"نِهَائِيٌّ","roman":"nihāʾiyyun","en":"final (m.)","ja":"最終の（男性形）","type":"adj","fem":"نِهَائِيَّةٌ","example":{"ar":"هَذَا سِعْرٌ نِهَائِيٌّ.","roman":"","en":"This is a final price.","ja":"これが最終価格です。"}},{"ar":"مُقَدَّمٌ","roman":"muqaddamun","en":"advance / upfront (m.)","ja":"前払いの（男性形）","type":"adj","fem":"مُقَدَّمَةٌ","example":{"ar":"الدَّفْعُ الْمُقَدَّمُ مَطْلُوبٌ.","roman":"","en":"Advance payment is required.","ja":"前払いが必要です。"}},{"ar":"مُمْكِنٌ","roman":"mumkinun","en":"possible (m.)","ja":"可能な（男性形）","type":"adj","fem":"مُمْكِنَةٌ","example":{"ar":"هَلْ هَذَا مُمْكِنٌ؟","roman":"","en":"Is this possible?","ja":"これは可能ですか？"}},{"ar":"مَطْلُوبٌ","roman":"maṭlūbun","en":"required (m.)","ja":"必要な（男性形）","type":"adj","fem":"مَطْلُوبَةٌ","example":{"ar":"الدَّفْعُ مَطْلُوبٌ.","roman":"","en":"Payment is required.","ja":"支払いが必要です。"}}],"grammar":[{"title":"Ask about commercial terms","en":"To ask about conditions, use مَا شُرُوطُ ...؟ for 'What are the terms of...?' Keep the following noun in a simple phrase such as الدَّفْعِ (payment).","ja":"条件確認には مَا شُرُوطُ ...؟（〜の条件は何ですか？）。たとえば شُرُوطُ الدَّفْعِ（支払い条件）を覚えましょう。","example":{"ar":"مَا شُرُوطُ الدَّفْعِ؟","roman":"mā shurūṭu ad-dafʿi","en":"What are the payment terms?","ja":"決済条件は何ですか？"},"drill":"Ask about payment terms, delivery date and product quantity."},{"title":"Explain a requirement with يَجِبُ","en":"Use يَجِبُ + verbal noun, or يَجِبُ أَنْ + imperfect subjunctive, to say something must be done. First memorise a practical whole phrase.","ja":"必要性は يَجِبُ＋動名詞、または يَجِبُ أَنْ＋動詞で表せます。まずは丸ごと使える短文から覚えます。","example":{"ar":"يَجِبُ الدَّفْعُ قَبْلَ الشَّحْنِ.","roman":"yajibu ad-dafʿu qabla ash-shaḥni","en":"Payment is required before shipping.","ja":"出荷前に支払う必要があります。"},"drill":"Teacher asks whether a deposit is enough; learner explains the general term without arguing."},{"title":"A simple conditional with إِذَا","en":"إِذَا means 'if/when'. A common pattern is إِذَا + past-form verb for the condition, followed by سَـ + imperfect to state a future next action.","ja":"簡単な条件文に إِذَا（もし〜なら）を使います。条件節に完了形、その後に سَـ＋未完了形で今後の行動を述べる形が便利です。","example":{"ar":"إِذَا وَصَلَ الدَّفْعُ، سَنُرْسِلُ الشُّحْنَةَ.","roman":"idhā waṣala ad-dafʿu sa-nursilu ash-shuḥnata","en":"If payment arrives, we'll send the shipment.","ja":"支払いが確認できたら、出荷します。"},"drill":"Teacher changes the payment arrival date; student adjusts the promised shipment timing."},{"title":"Summarise the next step clearly","en":"Close a meeting by repeating what was agreed, who sends the invoice and when the next meeting will be. Use سَـ for promises and فِي / يَوْمَ for dates.","ja":"商談の最後は合意事項を繰り返し、誰が・いつ・何をするか確認します。予定や約束には سَـ＋未完了形を使えます。","example":{"ar":"سَأُرْسِلُ الْفَاتُورَةَ الْيَوْمَ، وَسَنَلْتَقِي غَدًا.","roman":"sa-ursilu al-fātūrata al-yawma wa-sa-naltaqī ghadan","en":"I'll send the invoice today, and we'll meet tomorrow.","ja":"今日請求書を送り、明日会います。"},"drill":"Student ends a meeting by restating the price, quantity and two next actions."}],"phrases":[{"ar":"مَا سِعْرُ هَذَا الْمُنْتَجِ؟","roman":"mā siʿru hādhā al-muntaji","en":"What is the price of this product?","ja":"この製品の価格はいくらですか？"},{"ar":"مَا الْكَمِّيَّةُ الْمَطْلُوبَةُ؟","roman":"mā al-kammiyyatu al-maṭlūbatu","en":"What quantity is required?","ja":"必要数量はいくつですか？"},{"ar":"هَلْ هَذَا السِّعْرُ نِهَائِيٌّ؟","roman":"hal hādhā as-siʿru nihāʾiyyun","en":"Is this the final price?","ja":"これは最終価格ですか？"},{"ar":"هَلْ يُمْكِنُ تَقْدِيمُ خَصْمٍ؟","roman":"hal yumkinu taqdīmu khaṣmin","en":"Is a discount possible?","ja":"値引きは可能ですか？"},{"ar":"مَا شُرُوطُ الدَّفْعِ؟","roman":"mā shurūṭu ad-dafʿi","en":"What are the payment terms?","ja":"支払い条件は何ですか？"},{"ar":"يَجِبُ الدَّفْعُ قَبْلَ الشَّحْنِ.","roman":"yajibu ad-dafʿu qabla ash-shaḥni","en":"Payment is required before shipment.","ja":"出荷前の支払いが必要です。"},{"ar":"مَتَى مَوْعِدُ التَّسْلِيمِ؟","roman":"matā mawʿidu at-taslīmi","en":"When is the delivery date?","ja":"納期はいつですか？"},{"ar":"هَذَا السِّعْرُ مُنَاسِبٌ.","roman":"hādhā as-siʿru munāsibun","en":"This price is reasonable.","ja":"この価格は妥当です。"},{"ar":"أُوَافِقُ عَلَى هَذِهِ الشُّرُوطِ.","roman":"uwāfiqu ʿalā hādhihi ash-shurūṭi","en":"I agree to these terms.","ja":"この条件で同意します。"},{"ar":"إِذَا وَصَلَ الدَّفْعُ، سَنُرْسِلُ الشُّحْنَةَ.","roman":"idhā waṣala ad-dafʿu sa-nursilu ash-shuḥnata","en":"If payment arrives, we'll ship.","ja":"支払いがあれば出荷します。"},{"ar":"سَأُرْسِلُ الْفَاتُورَةَ الْيَوْمَ.","roman":"sa-ursilu al-fātūrata al-yawma","en":"I will send the invoice today.","ja":"今日請求書を送ります。"},{"ar":"هَلْ يُمْكِنُنَا تَأْكِيدُ الْمَوْعِدِ؟","roman":"hal yumkinunā taʾkīdu al-mawʿidi","en":"Can we confirm the date?","ja":"日程を確認できますか？"}],"dialogues":[{"title":"Discuss price and quantity","turns":[{"role":"A","ar":"شُكْرًا عَلَى الِاجْتِمَاعِ. مَا الْكَمِّيَّةُ الْمَطْلُوبَةُ؟","en":"Thanks for the meeting. What quantity do you need?","ja":"お打ち合わせありがとうございます。必要数量は？"},{"role":"B","ar":"نَحْتَاجُ إِلَى كَمِّيَّةٍ كَبِيرَةٍ.","en":"We need a large quantity.","ja":"まとまった数量が必要です。"},{"role":"A","ar":"مَا رَأْيُكَ فِي هَذَا السِّعْرِ؟","en":"What do you think of this price?","ja":"この価格はいかがですか？"},{"role":"B","ar":"السِّعْرُ مُرْتَفِعٌ قَلِيلًا.","en":"The price is a little high.","ja":"少し高いです。"},{"role":"A","ar":"هَلْ تُرِيدُ أَنْ نُنَاقِشَ خَصْمًا؟","en":"Would you like us to discuss a discount?","ja":"値引きを相談しましょうか？"},{"role":"B","ar":"نَعَمْ، مِنْ فَضْلِكَ.","en":"Yes, please.","ja":"はい、お願いします。"},{"role":"A","ar":"سَأَتَحَقَّقُ مِنَ السِّعْرِ وَأَرُدُّ عَلَيْكَ.","en":"I'll check the price and reply to you.","ja":"価格を確認して回答します。"},{"role":"B","ar":"شُكْرًا، سَأَنْتَظِرُ رَدَّكَ.","en":"Thanks, I will wait for your reply.","ja":"ありがとうございます。連絡を待ちます。"}],"twist":"Teacher changes quantity, price and the customer's budget. Student makes a justified counter-proposal."},{"title":"Confirm payment and delivery terms","turns":[{"role":"A","ar":"مَا شُرُوطُ الدَّفْعِ؟","en":"What are the payment terms?","ja":"支払条件は何ですか？"},{"role":"B","ar":"يَجِبُ الدَّفْعُ قَبْلَ الشَّحْنِ.","en":"Payment is required before shipment.","ja":"出荷前支払いが必要です。"},{"role":"A","ar":"مَتَى يُمْكِنُكُمْ شَحْنُ الطَّلَبِ؟","en":"When can you ship the order?","ja":"いつ出荷できますか？"},{"role":"B","ar":"إِذَا وَصَلَ الدَّفْعُ، سَنُرْسِلُ الشُّحْنَةَ.","en":"If payment arrives, we'll send the shipment.","ja":"支払いを確認できたら出荷します。"},{"role":"A","ar":"هَلْ يُمْكِنُنَا تَأْكِيدُ الْمَوْعِدِ؟","en":"Can we confirm the date?","ja":"日程を確認できますか？"},{"role":"B","ar":"نَعَمْ، سَأُرْسِلُ التَّفَاصِيلَ بِالْبَرِيدِ الْإِلِكْتُرُونِيِّ.","en":"Yes, I'll email the details.","ja":"はい、詳細をメールで送ります。"}],"twist":"Buyer asks to ship before payment; learner politely restates the condition and offers a next action."},{"title":"Summarise an agreement","turns":[{"role":"A","ar":"هَلِ اتَّفَقْنَا عَلَى السِّعْرِ؟","en":"Have we agreed on the price?","ja":"価格は合意できましたか？"},{"role":"B","ar":"نَعَمْ، اتَّفَقْنَا عَلَى السِّعْرِ.","en":"Yes, we agreed on the price.","ja":"はい、価格は合意しました。"},{"role":"A","ar":"وَمَاذَا عَنِ الْكَمِّيَّةِ؟","en":"And what about the quantity?","ja":"数量はどうですか？"},{"role":"B","ar":"الْكَمِّيَّةُ مُنَاسِبَةٌ.","en":"The quantity is suitable.","ja":"数量は問題ありません。"},{"role":"A","ar":"سَأُرْسِلُ الْفَاتُورَةَ الْيَوْمَ.","en":"I'll send the invoice today.","ja":"今日請求書を送ります。"},{"role":"B","ar":"وَسَأُؤَكِّدُ الْمَوْعِدَ غَدًا.","en":"And I will confirm the date tomorrow.","ja":"私は明日、日程を確認します。"},{"role":"A","ar":"شُكْرًا، إِلَى اللِّقَاءِ.","en":"Thank you, goodbye.","ja":"ありがとうございました。ではまた。"},{"role":"B","ar":"إِلَى اللِّقَاءِ.","en":"Goodbye.","ja":"またお会いしましょう。"}],"twist":"One party misunderstands the shipping date; learner notices and corrects it."}],"classes":[{"goal":"Ask about prices, quantities and payment requirements.","jaGoal":"","missions":[{"en":"Introduce a fabric product and ask the required quantity.","ja":"生地製品を紹介し数量を確認する。"},{"en":"State a simple payment condition politely.","ja":"決済条件を丁寧に述べる。"},{"en":"Swap buyer and seller roles and confirm the price.","ja":"売り手と買い手を交代して価格を確認する。"}],"questions":[{"ar":"مَا الْكَمِّيَّةُ الْمَطْلُوبَةُ؟","en":"What quantity is required?","ja":"必要数量は？"},{"ar":"مَا شُرُوطُ الدَّفْعِ؟","en":"What are the payment terms?","ja":"支払条件は？"},{"ar":"هَلْ هَذَا السِّعْرُ نِهَائِيٌّ؟","en":"Is this the final price?","ja":"最終価格ですか？"}]},{"goal":"Deal with a price or delivery disagreement.","jaGoal":"","missions":[{"en":"The buyer asks for a discount; explain a reasonable response.","ja":"値引きを求められ、条件を説明する。"},{"en":"Delivery date is later than expected; offer another date.","ja":"納期が遅く、別の日時を提案する。"},{"en":"Payment is late; explain what happens next.","ja":"入金が遅れているときの対応を説明する。"}],"questions":[{"ar":"هَلْ يُمْكِنُ تَقْدِيمُ خَصْمٍ؟","en":"Is a discount possible?","ja":"値引きできますか？"},{"ar":"مَتَى سَتُسَلِّمُونَ الطَّلَبَ؟","en":"When will you deliver the order?","ja":"いつ納品しますか？"},{"ar":"هَلْ وَصَلَ الدَّفْعُ؟","en":"Has the payment arrived?","ja":"入金はありましたか？"}]},{"goal":"Start a business meeting, discuss terms and close with follow-up.","jaGoal":"","missions":[{"en":"Open a meeting and introduce a new sample.","ja":"会議を始め新しいサンプルを紹介する。"},{"en":"Discuss price, quantity, payment and delivery.","ja":"価格・数量・決済・納品について話す。"},{"en":"Summarise the agreement and next actions.","ja":"合意内容と次の対応をまとめる。"}],"questions":[{"ar":"مَاذَا اتَّفَقْنَا عَلَيْهِ؟","en":"What have we agreed on?","ja":"何に合意しましたか？"},{"ar":"مَنْ سَيُرْسِلُ الْفَاتُورَةَ؟","en":"Who will send the invoice?","ja":"誰が請求書を送りますか？"},{"ar":"مَتَى الْمَوْعِدُ الْقَادِمُ؟","en":"When is the next meeting?","ja":"次の面談はいつですか？"}]}],"test":[{"en":"Ask: What are the payment terms?","ja":"支払い条件は何ですか？","answer":{"ar":"مَا شُرُوطُ الدَّفْعِ؟","roman":"mā shurūṭu ad-dafʿi","en":"Ask: What are the payment terms?","ja":"支払い条件は何ですか？"}},{"en":"Say: Payment is required before shipment.","ja":"出荷前に支払う必要があります。","answer":{"ar":"يَجِبُ الدَّفْعُ قَبْلَ الشَّحْنِ.","roman":"yajibu ad-dafʿu qabla ash-shaḥni","en":"Say: Payment is required before shipment.","ja":"出荷前に支払う必要があります。"}},{"en":"Ask: Is a discount possible?","ja":"値引きは可能ですか？","answer":{"ar":"هَلْ يُمْكِنُ تَقْدِيمُ خَصْمٍ؟","roman":"hal yumkinu taqdīmu khaṣmin","en":"Ask: Is a discount possible?","ja":"値引きは可能ですか？"}},{"en":"Ask: When is the delivery date?","ja":"納品はいつですか？","answer":{"ar":"مَتَى مَوْعِدُ التَّسْلِيمِ؟","roman":"matā mawʿidu at-taslīmi","en":"Ask: When is the delivery date?","ja":"納品はいつですか？"}},{"en":"Say: I agree to these conditions.","ja":"この条件に同意します。","answer":{"ar":"أُوَافِقُ عَلَى هَذِهِ الشُّرُوطِ.","roman":"uwāfiqu ʿalā hādhihi ash-shurūṭi","en":"Say: I agree to these conditions.","ja":"この条件に同意します。"}},{"en":"Say: I'll send the invoice today.","ja":"今日請求書を送ります。","answer":{"ar":"سَأُرْسِلُ الْفَاتُورَةَ الْيَوْمَ.","roman":"sa-ursilu al-fātūrata al-yawma","en":"Say: I'll send the invoice today.","ja":"今日請求書を送ります。"}},{"en":"Say: If payment arrives, we will ship.","ja":"入金後、出荷します。","answer":{"ar":"إِذَا وَصَلَ الدَّفْعُ، سَنُرْسِلُ الشُّحْنَةَ.","roman":"idhā waṣala ad-dafʿu sa-nursilu ash-shuḥnata","en":"Say: If payment arrives, we will ship.","ja":"入金後、出荷します。"}}],"checks":["I can clearly describe a problem / 問題を具体的に説明できる","I can ask at least four questions / 4つ以上質問できる","I can ask for a realistic next step / 次の対応を尋ねられる","I can confirm a time, quantity or date / 時間・数量・日付を確認できる","I can repeat the role-play after feedback / 修正後に言い直せる"]}</script><script src="../assets/lesson-v3.js"></script><script defer src="../assets/site-navigation.js"></script></body></html>
