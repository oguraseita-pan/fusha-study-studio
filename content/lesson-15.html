لَةً فِي الشُّحْنِ.","roman":"","en":"I have a shipping problem.","ja":"出荷に問題があります。"}},{"ar":"أُصْلِحُ","roman":"uṣliḥu","en":"I repair","ja":"私は修理する","type":"verb","past":"أَصْلَحَ","present":"يُصْلِحُ","me":"أُصْلِحُ","example":{"ar":"أُصْلِحُ الْبَابَ.","roman":"","en":"I repair the door.","ja":"ドアを修理します。"}},{"ar":"أَنْتَظِرُ","roman":"antaẓiru","en":"I wait","ja":"私は待つ","type":"verb","past":"اِنْتَظَرَ","present":"يَنْتَظِرُ","me":"أَنْتَظِرُ","example":{"ar":"أَنْتَظِرُ الْفَنِّيَّ.","roman":"","en":"I wait for the technician.","ja":"技術者を待っています。"}},{"ar":"أَتَأَخَّرُ","roman":"ataʾakhkharu","en":"I am late","ja":"私は遅れる","type":"verb","past":"تَأَخَّرَ","present":"يَتَأَخَّرُ","me":"أَتَأَخَّرُ","example":{"ar":"سَأَتَأَخَّرُ عَشْرَ دَقَائِقَ.","roman":"","en":"I'll be ten minutes late.","ja":"10分遅れます。"}},{"ar":"أَشْرَحُ","roman":"ashraḥu","en":"I explain","ja":"私は説明する","type":"verb","past":"شَرَحَ","present":"يَشْرَحُ","me":"أَشْرَحُ","example":{"ar":"أَشْرَحُ الْمُشْكِلَةَ.","roman":"","en":"I explain the problem.","ja":"問題を説明します。"}},{"ar":"أَتَحَقَّقُ","roman":"ataḥaqqaqu","en":"I check / verify","ja":"私は確認する","type":"verb","past":"تَحَقَّقَ","present":"يَتَحَقَّقُ","me":"أَتَحَقَّقُ","example":{"ar":"أَتَحَقَّقُ مِنَ الْمَوْعِدِ.","roman":"","en":"I check the appointment.","ja":"予約日時を確認します。"}},{"ar":"أُرْسِلُ","roman":"ursilu","en":"I send","ja":"私は送る","type":"verb","past":"أَرْسَلَ","present":"يُرْسِلُ","me":"أُرْسِلُ","example":{"ar":"أُرْسِلُ صُورَةً لِلْمُشْكِلَةِ.","roman":"","en":"I send a photo of the problem.","ja":"問題の写真を送ります。"}},{"ar":"أَحْتَاجُ","roman":"aḥtāju","en":"I need","ja":"私は必要とする","type":"verb","past":"اِحْتَاجَ","present":"يَحْتَاجُ","me":"أَحْتَاجُ","example":{"ar":"أَحْتَاجُ إِلَى مُسَاعَدَةٍ.","roman":"","en":"I need help.","ja":"手助けが必要です。"}},{"ar":"مُشْكِلَةٌ","roman":"mushkilatun","en":"problem","ja":"問題","type":"noun","gender":"feminine","plural":"مَشَاكِلُ","example":{"ar":"عِنْدِي مُشْكِلَةٌ.","roman":"","en":"I have a problem.","ja":"問題があります。"}},{"ar":"عُطْلٌ","roman":"ʿuṭlun","en":"malfunction","ja":"故障","type":"noun","gender":"masculine","plural":"أَعْطَالٌ","example":{"ar":"هُنَاكَ عُطْلٌ فِي الْمُكَيِّفِ.","roman":"","en":"There is a fault with the AC.","ja":"エアコンが故障しています。"}},{"ar":"إِصْلَاحٌ","roman":"iṣlāḥun","en":"repair","ja":"修理","type":"noun","gender":"masculine","plural":"إِصْلَاحَاتٌ","example":{"ar":"نَحْتَاجُ إِلَى إِصْلَاحٍ.","roman":"","en":"We need a repair.","ja":"修理が必要です。"}},{"ar":"صِيَانَةٌ","roman":"ṣiyānatun","en":"maintenance","ja":"保守・修理","type":"noun","gender":"feminine","plural":"—","example":{"ar":"نَحْتَاجُ إِلَى الصِّيَانَةِ.","roman":"","en":"We need maintenance.","ja":"メンテナンスが必要です。"}},{"ar":"فَنِّيٌّ","roman":"fanniyyun","en":"technician","ja":"技術者","type":"noun","gender":"masculine","plural":"فَنِّيُّونَ","example":{"ar":"مَتَى سَيَأْتِي الْفَنِّيُّ؟","roman":"","en":"When will the technician arrive?","ja":"技術者はいつ来ますか？"}},{"ar":"حَلٌّ","roman":"ḥallun","en":"solution","ja":"解決策","type":"noun","gender":"masculine","plural":"حُلُولٌ","example":{"ar":"هَلْ عِنْدَكَ حَلٌّ؟","roman":"","en":"Do you have a solution?","ja":"解決策はありますか？"}},{"ar":"تَأْخِيرٌ","roman":"taʾkhīrun","en":"delay","ja":"遅延","type":"noun","gender":"masculine","plural":"تَأْخِيرَاتٌ","example":{"ar":"هُنَاكَ تَأْخِيرٌ فِي التَّسْلِيمِ.","roman":"","en":"There is a delay in delivery.","ja":"納品が遅れています。"}},{"ar":"شُحْنَةٌ","roman":"shuḥnatun","en":"shipment","ja":"貨物・出荷","type":"noun","gender":"feminine","plural":"شُحْنَاتٌ","example":{"ar":"الشُّحْنَةُ لَمْ تَصِلْ بَعْدُ.","roman":"","en":"The shipment hasn't arrived yet.","ja":"荷物がまだ届いていません。"}},{"ar":"تَسْلِيمٌ","roman":"taslīmun","en":"delivery / handover","ja":"納品","type":"noun","gender":"masculine","plural":"—","example":{"ar":"مَوْعِدُ التَّسْلِيمِ غَدًا.","roman":"","en":"Delivery is scheduled for tomorrow.","ja":"納品予定は明日です。"}},{"ar":"مَوْعِدٌ","roman":"mawʿidun","en":"appointment / deadline","ja":"予定日時","type":"noun","gender":"masculine","plural":"مَوَاعِيدُ","example":{"ar":"مَا مَوْعِدُ الْإِصْلَاحِ؟","roman":"","en":"When is the repair scheduled?","ja":"修理はいつですか？"}},{"ar":"عُنْوَانٌ","roman":"ʿunwānun","en":"address","ja":"住所","type":"noun","gender":"masculine","plural":"عَنَاوِينُ","example":{"ar":"هَذَا عُنْوَانِي.","roman":"","en":"This is my address.","ja":"これが住所です。"}},{"ar":"مَسْؤُولٌ","roman":"masʾūlun","en":"responsible person","ja":"担当者","type":"noun","gender":"masculine","plural":"مَسْؤُولُونَ","example":{"ar":"مَنْ هُوَ الْمَسْؤُولُ؟","roman":"","en":"Who is responsible?","ja":"担当者は誰ですか？"}},{"ar":"مَكْسُورٌ","roman":"maksūrun","en":"broken (m.)","ja":"壊れた（男性形）","type":"adj","fem":"مَكْسُورَةٌ","example":{"ar":"الْبَابُ مَكْسُورٌ.","roman":"","en":"The door is broken.","ja":"ドアが壊れています。"}},{"ar":"مُتَأَخِّرٌ","roman":"mutaʾakhkhirun","en":"late (m.)","ja":"遅れた（男性形）","type":"adj","fem":"مُتَأَخِّرَةٌ","example":{"ar":"الشُّحْنَةُ مُتَأَخِّرَةٌ.","roman":"","en":"The shipment is delayed.","ja":"出荷が遅れています。"}},{"ar":"عَاجِلٌ","roman":"ʿājilun","en":"urgent (m.)","ja":"急ぎの（男性形）","type":"adj","fem":"عَاجِلَةٌ","example":{"ar":"هَذَا أَمْرٌ عَاجِلٌ.","roman":"","en":"This is urgent.","ja":"これは緊急です。"}},{"ar":"بَعْدُ","roman":"baʿdu","en":"yet (after negative)","ja":"まだ（否定文）","type":"adverb","example":{"ar":"لَمْ تَصِلِ الشُّحْنَةُ بَعْدُ.","roman":"","en":"The shipment hasn't arrived yet.","ja":"まだ荷物が届きません。"}}],"grammar":[{"title":"Describe a problem with عِنْدِي and لَا يَعْمَلُ","en":"Use عِنْدِي مُشْكِلَةٌ (I have a problem) or say what isn't working with لَا before the present verb.","ja":"「問題があります」は عِنْدِي مُشْكِلَةٌ。機器が動かないときは未完了形の前に لَا を置きます。","example":{"ar":"الْمُكَيِّفُ لَا يَعْمَلُ.","roman":"al-mukayyifu lā yaʿmalu","en":"The air conditioner isn't working.","ja":"エアコンが動いていません。"},"drill":"Teacher changes AC to door/elevator. Learner explains what is wrong."},{"title":"Not yet: لَمْ + jussive","en":"لَمْ + imperfect verb expresses 'did not / has not', followed by a jussive form. Example: لَمْ تَصِلْ = it has not arrived. Focus on the useful chunk first; the detailed jussive pattern can wait.","ja":"「まだ〜していない」は لَمْ＋未完了形のジャズム形。まず「まだ届いていない」の表現を覚え、活用全体は後の段階で整理します。","example":{"ar":"لَمْ تَصِلِ الشُّحْنَةُ بَعْدُ.","roman":"lam taṣili ash-shuḥnatu baʿdu","en":"The shipment hasn't arrived yet.","ja":"貨物はまだ到着していません。"},"drill":"Teacher changes shipment to the technician and asks whether the person arrived."},{"title":"Make a polite help request","en":"Ask هَلْ يُمْكِنُكَ أَنْ ...؟ (Can you...?) to a man. With a female listener, use يُمْكِنُكِ. After أَنْ, use the appropriate subjunctive verb form in formal Arabic.","ja":"丁寧な依頼は هَلْ يُمْكِنُكَ أَنْ ...؟（男性へ）。女性へは يُمْكِنُكِ になります。","example":{"ar":"هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ فَنِّيًّا الْيَوْمَ؟","roman":"hal yumkinuka an tursila fanniyyan al-yawma","en":"Can you send a technician today?","ja":"今日、技術者を派遣できますか？"},"drill":"First ask for a repair today; teacher says tomorrow and learner confirms the new date."},{"title":"Ask for the next step and confirm details","en":"After describing a problem, ask مَتَى؟ (when), مَنْ؟ (who), and هَلْ يُمْكِنُ...؟ (is it possible). Always repeat the key date or time to avoid misunderstandings.","ja":"問題を述べた後に「いつ」「誰が」「可能か」を確認しましょう。日時や担当者を復唱して認識違いを防ぎます。","example":{"ar":"مَتَى سَيَأْتِي الْفَنِّيُّ؟","roman":"matā sayaʾtī al-fanniyyu","en":"When will the technician come?","ja":"技術者はいつ来ますか？"},"drill":"Teacher offers a vague response; learner requests a specific time."}],"phrases":[{"ar":"عِنْدِي مُشْكِلَةٌ.","roman":"ʿindī mushkilatun","en":"I have a problem.","ja":"問題があります。"},{"ar":"الْمُكَيِّفُ لَا يَعْمَلُ.","roman":"al-mukayyifu lā yaʿmalu","en":"The AC doesn't work.","ja":"エアコンが動きません。"},{"ar":"هُنَاكَ عُطْلٌ فِي الْمُكَيِّفِ.","roman":"hunāka ʿuṭlun fī al-mukayyifi","en":"There is a fault in the AC.","ja":"エアコンに故障があります。"},{"ar":"أَحْتَاجُ إِلَى مُسَاعَدَةٍ.","roman":"aḥtāju ilā musāʿadatin","en":"I need help.","ja":"助けが必要です。"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ فَنِّيًّا؟","roman":"hal yumkinuka an tursila fanniyyan","en":"Can you send a technician?","ja":"技術者を派遣できますか？"},{"ar":"مَتَى سَيَأْتِي الْفَنِّيُّ؟","roman":"matā sayaʾtī al-fanniyyu","en":"When will the technician come?","ja":"技術者はいつ来ますか？"},{"ar":"الشُّحْنَةُ لَمْ تَصِلْ بَعْدُ.","roman":"ash-shuḥnatu lam taṣil baʿdu","en":"The shipment hasn't arrived yet.","ja":"貨物がまだ届きません。"},{"ar":"هُنَاكَ تَأْخِيرٌ فِي التَّسْلِيمِ.","roman":"hunāka taʾkhīrun fī at-taslīmi","en":"There is a delay in delivery.","ja":"納品に遅れがあります。"},{"ar":"هَلْ عِنْدَكُمْ حَلٌّ؟","roman":"hal ʿindakum ḥallun","en":"Do you have a solution?","ja":"解決策はありますか？"},{"ar":"مَنْ هُوَ الْمَسْؤُولُ؟","roman":"man huwa al-masʾūlu","en":"Who is responsible?","ja":"担当者は誰ですか？"},{"ar":"سَأُرْسِلُ صُورَةً لِلْمُشْكِلَةِ.","roman":"sa-ursilu ṣūratan lil-mushkilati","en":"I'll send a photo of the problem.","ja":"問題の写真を送ります。"},{"ar":"هَلْ يُمْكِنُكَ تَأْكِيدُ الْمَوْعِدِ؟","roman":"hal yumkinuka taʾkīdu al-mawʿidi","en":"Could you confirm the appointment?","ja":"予定日時を確認してもらえますか？"}],"dialogues":[{"title":"Request apartment maintenance","turns":[{"role":"A","ar":"مَرْحَبًا، عِنْدِي مُشْكِلَةٌ فِي الشَّقَّةِ.","en":"Hello, I have a problem in my apartment.","ja":"こんにちは。部屋に問題があります。"},{"role":"B","ar":"مَا الْمُشْكِلَةُ؟","en":"What is the problem?","ja":"どのような問題ですか？"},{"role":"A","ar":"الْمُكَيِّفُ لَا يَعْمَلُ.","en":"The AC isn't working.","ja":"エアコンが動きません。"},{"role":"B","ar":"هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ صُورَةً؟","en":"Can you send a photo?","ja":"写真を送れますか？"},{"role":"A","ar":"نَعَمْ، سَأُرْسِلُهَا الْآنَ.","en":"Yes, I'll send it now.","ja":"はい、今送ります。"},{"role":"B","ar":"حَسَنًا، سَنُرْسِلُ فَنِّيًّا غَدًا.","en":"Okay, we will send a technician tomorrow.","ja":"分かりました。明日技術者を派遣します。"},{"role":"A","ar":"شُكْرًا، مَتَى سَيَأْتِي؟","en":"Thank you. What time will he come?","ja":"ありがとうございます。何時に来ますか？"},{"role":"B","ar":"فِي السَّاعَةِ الْعَاشِرَةِ صَبَاحًا.","en":"At 10 in the morning.","ja":"午前10時です。"}],"twist":"Technician cannot come at ten. Learner must arrange a new time and confirm the address."},{"title":"Follow up on a delayed delivery","turns":[{"role":"A","ar":"مَرْحَبًا، أَتَّصِلُ بِشَأْنِ الشُّحْنَةِ.","en":"Hello, I'm calling about the shipment.","ja":"こんにちは。貨物について電話しています。"},{"role":"B","ar":"نَعَمْ، كَيْفَ أُسَاعِدُكَ؟","en":"Yes, how may I help?","ja":"はい、どうされましたか？"},{"role":"A","ar":"الشُّحْنَةُ لَمْ تَصِلْ بَعْدُ.","en":"The shipment hasn't arrived yet.","ja":"貨物がまだ届きません。"},{"role":"B","ar":"نَعْتَذِرُ عَنِ التَّأْخِيرِ.","en":"We apologize for the delay.","ja":"遅延をお詫びします。"},{"role":"A","ar":"مَا مَوْعِدُ التَّسْلِيمِ الْجَدِيدُ؟","en":"What is the new delivery date?","ja":"新しい納品予定日はいつですか？"},{"role":"B","ar":"سَنُسَلِّمُ الشُّحْنَةَ غَدًا.","en":"We will deliver the shipment tomorrow.","ja":"明日貨物を納品します。"},{"role":"A","ar":"هَلْ يُمْكِنُكَ تَأْكِيدُ ذَلِكَ بِرِسَالَةٍ؟","en":"Can you confirm that in a message?","ja":"メッセージで確認できますか？"},{"role":"B","ar":"نَعَمْ، سَأُرْسِلُ رِسَالَةً الْآنَ.","en":"Yes, I'll send a message now.","ja":"はい、すぐ送ります。"}],"twist":"Change delivery to two days later; student politely asks for an alternative and confirms it."},{"title":"Find a solution together","turns":[{"role":"A","ar":"عِنْدَنَا مُشْكِلَةٌ فِي الْمَوْعِدِ.","en":"We have a scheduling problem.","ja":"予定に問題があります。"},{"role":"B","ar":"مَا الَّذِي حَدَثَ؟","en":"What happened?","ja":"何が起きましたか？"},{"role":"A","ar":"الْفَنِّيُّ مُتَأَخِّرٌ.","en":"The technician is late.","ja":"技術者が遅れています。"},{"role":"B","ar":"هَلْ عِنْدَكَ حَلٌّ آخَرُ؟","en":"Do you have another solution?","ja":"他の解決策はありますか？"},{"role":"A","ar":"يُمْكِنُنَا أَنْ نُغَيِّرَ الْمَوْعِدَ.","en":"We can change the time.","ja":"時間を変更できます。"},{"role":"B","ar":"حَسَنًا، مَتَى نَلْتَقِي؟","en":"Okay, when shall we meet?","ja":"わかりました。いつ会いましょうか？"}],"twist":"Teacher rejects the first alternative. Learner offers a second option and checks agreement."}],"classes":[{"day":"Mon 8 Feb 2027","name":"BUILD · Explain a problem","goal":"Say what is broken and ask for repair help.","missions":[{"en":"Describe a broken AC and a door problem.","ja":"エアコンとドアの不具合を説明する。"},{"en":"Ask for a technician and confirm the time.","ja":"修理担当者の訪問時刻を確認する。"},{"en":"Switch roles; teacher reports a different fault.","ja":"役割を交代し、講師が別の故障を説明する。"}],"questions":[{"ar":"مَا الْمُشْكِلَةُ؟","en":"What is the problem?","ja":"問題は何ですか？"},{"ar":"مَتَى سَيَأْتِي الْفَنِّيُّ؟","en":"When will the technician come?","ja":"技術者はいつ来ますか？"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ صُورَةً؟","en":"Can you send a photo?","ja":"写真を送ってもらえますか？"}],"teacher":"Correct one negative-verb error, one pronunciation point and one request structure.","exit":"Make a complete 60-second maintenance call without notes."},{"day":"Wed 10 Feb 2027","name":"USE · Resolve a delay","goal":"Explain non-arrival and ask for a new delivery time.","missions":[{"en":"The shipment is late; request an update.","ja":"納品が遅れ、進捗確認する。"},{"en":"Teacher says tomorrow but cannot confirm the hour.","ja":"明日という回答に対し時間を確認する。"},{"en":"Ask for written confirmation of the new date.","ja":"新しい日時を書面で確認する。"}],"questions":[{"ar":"هَلْ وَصَلَتِ الشُّحْنَةُ؟","en":"Has the shipment arrived?","ja":"貨物は届きましたか？"},{"ar":"مَا مَوْعِدُ التَّسْلِيمِ؟","en":"What is the delivery time?","ja":"納品はいつですか？"},{"ar":"هَلْ هَذَا مُمْكِنٌ؟","en":"Is this possible?","ja":"これは可能ですか？"}],"teacher":"Change the date mid-call; learner repeats back the new commitment.","exit":"2-minute dialogue with a delay, solution and confirmed date."},{"day":"Fri 12 Feb 2027","name":"TRANSFER · Take action","goal":"Combine calls, dates, repairs and delivery in free speech.","missions":[{"en":"Explain an apartment fault with an unexpected change.","ja":"住まいの故障について予想外の展開に対応する。"},{"en":"Call a supplier about a delayed sample delivery.","ja":"サンプル納品遅延を仕入先に問い合わせる。"},{"en":"Summarize the agreed next step in two sentences.","ja":"合意した次の対応を2文にまとめる。"}],"questions":[{"ar":"مَا الَّذِي حَدَثَ؟","en":"What happened?","ja":"何が起きましたか？"},{"ar":"مَنْ هُوَ الْمَسْؤُولُ؟","en":"Who is in charge?","ja":"担当者は誰ですか？"},{"ar":"مَتَى سَتُرْسِلُ التَّأْكِيدَ؟","en":"When will you send confirmation?","ja":"いつ確認連絡を送りますか？"}],"teacher":"Do not supply the missing words immediately. Give a clue and encourage paraphrasing.","exit":"90 sec: describe a problem, request help and confirm a next step."}],"test":[{"en":"Say: I have a problem.","ja":"問題があります。","answer":{"ar":"عِنْدِي مُشْكِلَةٌ.","roman":"ʿindī mushkilatun","en":"Model answer","ja":"回答例"}},{"en":"Say: The AC isn't working.","ja":"エアコンが動きません。","answer":{"ar":"الْمُكَيِّفُ لَا يَعْمَلُ.","roman":"al-mukayyifu lā yaʿmalu","en":"Model answer","ja":"回答例"}},{"en":"Ask: When will the technician come?","ja":"修理の人はいつ来ますか？","answer":{"ar":"مَتَى سَيَأْتِي الْفَنِّيُّ؟","roman":"matā sayaʾtī al-fanniyyu","en":"Model answer","ja":"回答例"}},{"en":"Say: The shipment hasn't arrived yet.","ja":"貨物がまだ届いていません。","answer":{"ar":"لَمْ تَصِلِ الشُّحْنَةُ بَعْدُ.","roman":"lam taṣili ash-shuḥnatu baʿdu","en":"Model answer","ja":"回答例"}},{"en":"Ask: What is the new delivery date?","ja":"新しい納品予定日はいつですか？","answer":{"ar":"مَا مَوْعِدُ التَّسْلِيمِ الْجَدِيدُ؟","roman":"mā mawʿidu at-taslīmi al-jadīdu","en":"Model answer","ja":"回答例"}},{"en":"Ask a man to confirm the appointment.","ja":"日時を確認してもらえますか？","answer":{"ar":"هَلْ يُمْكِنُكَ تَأْكِيدُ الْمَوْعِدِ؟","roman":"hal yumkinuka taʾkīdu al-mawʿidi","en":"Model answer","ja":"回答例"}}],"checks":["I can clearly describe a problem / 問題を具体的に説明できる","I can ask at least four questions / 4つ以上質問できる","I can ask for a realistic next step / 次の対応を尋ねられる","I can confirm a time, quantity or date / 時間・数量・日付を確認できる","I can repeat the role-play after feedback / 修正後に言い直せる"],"speaking":{"fusha":"In careful Fuṣḥā, لَمْ makes the following imperfect jussive. In linked speech the final consonant may take a helping vowel before a following definite article; learners should recognise the written form and prioritise understandable speech.","real":"In Dubai maintenance and delivery calls, Arabic speakers may use Gulf or Levantine dialect words. Simple Fuṣḥā phrases for the fault, date and next action will often be understandable; always repeat the agreed time and details."}};</script><script src="../assets/lesson-engine.js"></script><script defer src="../assets/site-navigation.js"></script><script defer src="../assets/lesson-ui.js"></script></body></html>
