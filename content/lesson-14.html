<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fuṣḥā speaking Week 14: Invitations, Friends & Making Plans"><title>Lesson 14 — Invitations, Friends & Making Plans | Fuṣḥā Study Studio</title><link rel="stylesheet" href="../assets/lesson-engine.css"><link rel="stylesheet" href="../assets/site-navigation.css"><link rel="stylesheet" href="../assets/lesson-ui.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"></head><body><div class="top"><a href="../index.html">← Fuṣḥā Study Studio</a><div class="tools"><span class="voice-state" id="voice-state">Tap Arabic text for audio</span><button data-switch="ja" aria-pressed="true">日本語</button><button data-switch="en" aria-pressed="true">English</button><button data-switch="answers" aria-pressed="false">Answers</button><button onclick="window.print()">Print / PDF</button></div></div><main id="content" class="wrap"></main><script>window.LESSON_DATA={"week":14,"title":"Invitations, Friends & Making Plans","jaTitle":"友人との会話・誘い・予定調整","arTitle":"الدَّعَوَاتُ وَالْأَصْدِقَاءُ وَالْخُطَطُ","dates":"1 · 3 · 5 February 2027","outcome":"Invite a friend, accept or politely decline, change arrangements, and discuss a simple weekend activity.","goals":["Invite someone to a café or activity / 友人をカフェなどに誘う","Accept and decline politely with a reason / 理由を添えて承諾・辞退する","Propose and confirm a time and place / 時間・場所を提案して確認する","Keep a social conversation going with questions / 友人との会話を広げる"],"review":[{"en":"Week 13: Compare two cafés and explain why.","ja":"第13週：カフェ2つを比較し、理由を述べる。"},{"en":"Week 5: Propose a time and move an appointment.","ja":"第5週：時刻を提案して予定変更する。"},{"en":"Week 6: Say what you did last weekend.","ja":"第6週：先週末の行動を過去形で話す。"}],"vocab":[{"ar":"أَدْعُو","roman":"adʿū","en":"I invite","ja":"私は招待する","type":"verb","past":"دَعَا","present":"يَدْعُو","me":"أَدْعُو","example":{"ar":"أَدْعُو صَدِيقِي إِلَى الْعَشَاءِ.","roman":"","en":"I invite my friend to dinner.","ja":"友人を夕食に誘います。"}},{"ar":"أَلْتَقِي","roman":"altaqī","en":"I meet","ja":"私は会う","type":"verb","past":"اِلْتَقَى","present":"يَلْتَقِي","me":"أَلْتَقِي","example":{"ar":"أَلْتَقِي بِصَدِيقِي غَدًا.","roman":"","en":"I meet my friend tomorrow.","ja":"明日友人に会います。"}},{"ar":"أَزُورُ","roman":"azūru","en":"I visit","ja":"私は訪れる","type":"verb","past":"زَارَ","present":"يَزُورُ","me":"أَزُورُ","example":{"ar":"أَزُورُ صَدِيقِي.","roman":"","en":"I visit my friend.","ja":"友人を訪ねます。"}},{"ar":"أَذْهَبُ","roman":"adhhabu","en":"I go","ja":"私は行く","type":"verb","past":"ذَهَبَ","present":"يَذْهَبُ","me":"أَذْهَبُ","example":{"ar":"سَأَذْهَبُ إِلَى الْمَقْهَى.","roman":"","en":"I will go to the café.","ja":"カフェに行きます。"}},{"ar":"أُوَافِقُ","roman":"uwāfiqu","en":"I agree","ja":"私は同意する","type":"verb","past":"وَافَقَ","present":"يُوَافِقُ","me":"أُوَافِقُ","example":{"ar":"أُوَافِقُ عَلَى الْخُطَّةِ.","roman":"","en":"I agree to the plan.","ja":"予定に賛成です。"}},{"ar":"أَعْتَذِرُ","roman":"aʿtadhiru","en":"I apologize","ja":"私は謝る","type":"verb","past":"اِعْتَذَرَ","present":"يَعْتَذِرُ","me":"أَعْتَذِرُ","example":{"ar":"أَعْتَذِرُ، أَنَا مَشْغُولٌ.","roman":"","en":"Sorry, I'm busy.","ja":"ごめんなさい、忙しいです。"}},{"ar":"أَنْتَظِرُ","roman":"antaẓiru","en":"I wait","ja":"私は待つ","type":"verb","past":"اِنْتَظَرَ","present":"يَنْتَظِرُ","me":"أَنْتَظِرُ","example":{"ar":"أَنْتَظِرُكَ أَمَامَ الْمَقْهَى.","roman":"","en":"I'll wait for you in front of the café.","ja":"カフェの前で待ちます。"}},{"ar":"أَقْتَرِحُ","roman":"aqtariḥu","en":"I suggest","ja":"私は提案する","type":"verb","past":"اِقْتَرَحَ","present":"يَقْتَرِحُ","me":"أَقْتَرِحُ","example":{"ar":"أَقْتَرِحُ يَوْمَ الْجُمُعَةِ.","roman":"","en":"I suggest Friday.","ja":"金曜日を提案します。"}},{"ar":"صَدِيقٌ","roman":"ṣadīqun","en":"friend (male)","ja":"友人（男性）","type":"noun","gender":"masculine","plural":"أَصْدِقَاءُ","example":{"ar":"هَذَا صَدِيقِي.","roman":"","en":"This is my friend.","ja":"こちらは私の友人です。"}},{"ar":"صَدِيقَةٌ","roman":"ṣadīqatun","en":"friend (female)","ja":"友人（女性）","type":"noun","gender":"feminine","plural":"صَدِيقَاتٌ","example":{"ar":"هَذِهِ صَدِيقَتِي.","roman":"","en":"This is my female friend.","ja":"こちらは女性の友人です。"}},{"ar":"دَعْوَةٌ","roman":"daʿwatun","en":"invitation","ja":"招待","type":"noun","gender":"feminine","plural":"دَعَوَاتٌ","example":{"ar":"شُكْرًا عَلَى الدَّعْوَةِ.","roman":"","en":"Thank you for the invitation.","ja":"お誘いありがとうございます。"}},{"ar":"عَشَاءٌ","roman":"ʿashāʾun","en":"dinner","ja":"夕食","type":"noun","gender":"masculine","plural":"—","example":{"ar":"هَلْ نَذْهَبُ لِلْعَشَاءِ؟","roman":"","en":"Shall we go to dinner?","ja":"夕食に行きませんか？"}},{"ar":"غَدَاءٌ","roman":"ghadāʾun","en":"lunch","ja":"昼食","type":"noun","gender":"masculine","plural":"—","example":{"ar":"نَلْتَقِي بَعْدَ الْغَدَاءِ.","roman":"","en":"Let's meet after lunch.","ja":"昼食後に会いましょう。"}},{"ar":"مَقْهًى","roman":"maqhan","en":"café","ja":"カフェ","type":"noun","gender":"masculine","plural":"مَقَاهٍ","example":{"ar":"هُنَاكَ مَقْهًى جَيِّدٌ.","roman":"","en":"There is a good café.","ja":"良いカフェがあります。"}},{"ar":"خُطَّةٌ","roman":"khuṭṭatun","en":"plan","ja":"計画","type":"noun","gender":"feminine","plural":"خُطَطٌ","example":{"ar":"عِنْدِي خُطَّةٌ لِلْيَوْمِ.","roman":"","en":"I have a plan for today.","ja":"今日の予定があります。"}},{"ar":"نِهَايَةُ الْأُسْبُوعِ","roman":"nihāyatu al-usbūʿi","en":"weekend","ja":"週末","type":"expression","example":{"ar":"مَاذَا تَفْعَلُ فِي نِهَايَةِ الْأُسْبُوعِ؟","roman":"","en":"What do you do on weekends?","ja":"週末は何をしますか？"}},{"ar":"مَوْعِدٌ","roman":"mawʿidun","en":"appointment","ja":"約束","type":"noun","gender":"masculine","plural":"مَوَاعِيدُ","example":{"ar":"عِنْدِي مَوْعِدٌ مَسَاءً.","roman":"","en":"I have an appointment in the evening.","ja":"夕方に約束があります。"}},{"ar":"وَقْتٌ","roman":"waqtun","en":"time","ja":"時間","type":"noun","gender":"masculine","plural":"أَوْقَاتٌ","example":{"ar":"مَا الْوَقْتُ الْمُنَاسِبُ؟","roman":"","en":"What time is suitable?","ja":"都合の良い時間は？"}},{"ar":"الْجُمُعَةُ","roman":"al-jumuʿatu","en":"Friday","ja":"金曜日","type":"noun","gender":"feminine","plural":"—","example":{"ar":"نَلْتَقِي يَوْمَ الْجُمُعَةِ.","roman":"","en":"Let's meet on Friday.","ja":"金曜に会いましょう。"}},{"ar":"السَّبْتُ","roman":"as-sabtu","en":"Saturday","ja":"土曜日","type":"noun","gender":"masculine","plural":"—","example":{"ar":"أَنَا مُتَاحٌ يَوْمَ السَّبْتِ.","roman":"","en":"Saturday works for me.","ja":"土曜日は空いています。"}},{"ar":"مُتَاحٌ","roman":"mutāḥun","en":"available (male)","ja":"空いている（男性形）","type":"adj","fem":"مُتَاحَةٌ","example":{"ar":"أَنَا مُتَاحٌ غَدًا.","roman":"","en":"I am available tomorrow.","ja":"明日は空いています。"}},{"ar":"مَشْغُولٌ","roman":"mashghūlun","en":"busy (male)","ja":"忙しい（男性形）","type":"adj","fem":"مَشْغُولَةٌ","example":{"ar":"أَنَا مَشْغُولٌ الْيَوْمَ.","roman":"","en":"I'm busy today.","ja":"今日は忙しいです。"}},{"ar":"قَرِيبٌ","roman":"qarībun","en":"nearby (male)","ja":"近い（男性形）","type":"adj","fem":"قَرِيبَةٌ","example":{"ar":"الْمَقْهَى قَرِيبٌ مِنْ هُنَا.","roman":"","en":"The café is near here.","ja":"カフェはここから近いです。"}},{"ar":"بِكُلِّ سُرُورٍ","roman":"bikulli surūrin","en":"with pleasure","ja":"喜んで","type":"expression","example":{"ar":"نَعَمْ، بِكُلِّ سُرُورٍ.","roman":"","en":"Yes, with pleasure.","ja":"はい、喜んで。"}}],"grammar":[{"title":"Invite politely using هَلْ تُرِيدُ أَنْ","en":"Use هَلْ تُرِيدُ أَنْ ...؟ (Would you like to...?) to invite a man. After أَنْ, the following imperfect has a subjunctive form in careful Fuṣḥā.","ja":"男性に「〜しませんか？」と誘うなら هَلْ تُرِيدُ أَنْ ...؟。أَنْ の後は厳密なフスハーでは動詞の語尾が接続法になります。","example":{"ar":"هَلْ تُرِيدُ أَنْ تَذْهَبَ مَعِي؟","roman":"hal turīdu an tadhhaba maʿī","en":"Would you like to go with me?","ja":"私と一緒に行きませんか？"},"drill":"Teacher changes café to market, park and restaurant."},{"title":"Accept, decline and give a reason","en":"Accept with بِكُلِّ سُرُورٍ (with pleasure). Decline with أَعْتَذِرُ (sorry) and a short reason, then offer an alternative time.","ja":"承諾には بِكُلِّ سُرُورٍ（喜んで）。辞退するときは أَعْتَذِرُ（すみません）＋理由、さらに代わりの時間を提案します。","example":{"ar":"أَعْتَذِرُ، أَنَا مَشْغُولٌ الْيَوْمَ، وَلَكِنْ أَنَا مُتَاحٌ غَدًا.","roman":"aʿtadhiru · anā mashghūlun al-yawma · wa-lākin anā mutāḥun ghadan","en":"Sorry, I'm busy today, but free tomorrow.","ja":"今日は忙しいですが、明日は空いています。"},"drill":"Teacher invites the student twice; decline the first and accept the second."},{"title":"Agree on time and place","en":"Say نَلْتَقِي ... (We meet / Let's meet). Use أَمَامَ (in front of), فِي (at/in), and بَعْدَ (after) to specify where and when.","ja":"約束を具体的に決めるには نَلْتَقِي ... を使います。أَمَامَ（〜の前で）、فِي（〜で）、بَعْدَ（〜の後）を組み合わせます。","example":{"ar":"نَلْتَقِي أَمَامَ الْمَقْهَى فِي السَّاعَةِ السَّادِسَةِ.","roman":"naltaqī amāma al-maqhā fī as-sāʿati as-sādisati","en":"Let's meet in front of the café at six.","ja":"6時にカフェの前で会いましょう。"},"drill":"Change the time, then the meeting place; repeat both to confirm."},{"title":"A short invitation in the future","en":"You can use سَـ + imperfect for a future plan: سَأَذْهَبُ (I will go). For a simple social proposal, هَلْ نَذْهَبُ ...؟ means 'Shall we go ...?'","ja":"未来の予定は سَـ＋未完了形（سَأَذْهَبُ）。「一緒に行きませんか？」は هَلْ نَذْهَبُ ...؟ でも表現できます。","example":{"ar":"هَلْ نَذْهَبُ إِلَى الْمَقْهَى غَدًا؟","roman":"hal nadhhabu ilā al-maqhā ghadan","en":"Shall we go to the café tomorrow?","ja":"明日カフェに行きませんか？"},"drill":"Student suggests two alternative weekend plans using this question pattern."}],"phrases":[{"ar":"هَلْ نَذْهَبُ لِلْعَشَاءِ؟","roman":"hal nadhhabu lil-ʿashāʾi","en":"Shall we go for dinner?","ja":"夕食に行きませんか？"},{"ar":"هَلْ تُرِيدُ أَنْ تَأْتِيَ مَعَنَا؟","roman":"hal turīdu an taʾtiya maʿanā","en":"Would you like to come with us? (to a man)","ja":"私たちと一緒に来ませんか？"},{"ar":"نَعَمْ، بِكُلِّ سُرُورٍ.","roman":"naʿam · bikulli surūrin","en":"Yes, with pleasure.","ja":"はい、喜んで。"},{"ar":"شُكْرًا عَلَى الدَّعْوَةِ.","roman":"shukran ʿalā ad-daʿwati","en":"Thank you for inviting me.","ja":"お誘いありがとうございます。"},{"ar":"أَعْتَذِرُ، أَنَا مَشْغُولٌ.","roman":"aʿtadhiru · anā mashghūlun","en":"Sorry, I'm busy.","ja":"すみません、忙しいです。"},{"ar":"هَلْ أَنْتَ مُتَاحٌ يَوْمَ الْجُمُعَةِ؟","roman":"hal anta mutāḥun yawma al-jumuʿati","en":"Are you free on Friday?","ja":"金曜は空いていますか？"},{"ar":"مَتَى نَلْتَقِي؟","roman":"matā naltaqī","en":"When shall we meet?","ja":"いつ会いましょうか？"},{"ar":"أَيْنَ نَلْتَقِي؟","roman":"ayna naltaqī","en":"Where shall we meet?","ja":"どこで会いましょうか？"},{"ar":"نَلْتَقِي فِي السَّاعَةِ السَّادِسَةِ.","roman":"naltaqī fī as-sāʿati as-sādisati","en":"Let's meet at six.","ja":"6時に会いましょう。"},{"ar":"هَلْ يُنَاسِبُكَ هَذَا الْوَقْتُ؟","roman":"hal yunāsibuka hādhā al-waqtu","en":"Does this time suit you?","ja":"この時間で大丈夫ですか？"},{"ar":"أَقْتَرِحُ يَوْمَ السَّبْتِ.","roman":"aqtariḥu yawma as-sabti","en":"I suggest Saturday.","ja":"土曜日はどうですか？"},{"ar":"سَأَنْتَظِرُكَ أَمَامَ الْمَقْهَى.","roman":"sa-antaẓiruka amāma al-maqhā","en":"I'll wait for you in front of the café.","ja":"カフェの前で待ちます。"}],"dialogues":[{"title":"Invite a friend for dinner","turns":[{"role":"A","ar":"مَرْحَبًا، هَلْ نَذْهَبُ لِلْعَشَاءِ يَوْمَ الْجُمُعَةِ؟","en":"Hi, shall we go for dinner on Friday?","ja":"こんにちは。金曜に夕食へ行きませんか？"},{"role":"B","ar":"شُكْرًا عَلَى الدَّعْوَةِ، وَلَكِنْ أَنَا مَشْغُولٌ.","en":"Thanks for inviting me, but I'm busy.","ja":"誘ってくれてありがとう。でも忙しいです。"},{"role":"A","ar":"هَلْ أَنْتَ مُتَاحٌ يَوْمَ السَّبْتِ؟","en":"Are you free on Saturday?","ja":"土曜日は空いていますか？"},{"role":"B","ar":"نَعَمْ، بِكُلِّ سُرُورٍ.","en":"Yes, with pleasure.","ja":"はい、喜んで。"},{"role":"A","ar":"نَلْتَقِي فِي السَّاعَةِ السَّادِسَةِ؟","en":"Shall we meet at six?","ja":"6時に会いましょうか？"},{"role":"B","ar":"نَعَمْ، هَذَا يُنَاسِبُنِي.","en":"Yes, that works for me.","ja":"はい、大丈夫です。"}],"twist":"Student must offer an alternative plan when Saturday also becomes unavailable."},{"title":"Plan a weekend","turns":[{"role":"A","ar":"مَاذَا سَتَفْعَلُ فِي نِهَايَةِ الْأُسْبُوعِ؟","en":"What will you do this weekend?","ja":"週末は何をしますか？"},{"role":"B","ar":"سَأَزُورُ صَدِيقِي، ثُمَّ سَنَذْهَبُ إِلَى مَقْهًى.","en":"I'll visit a friend and then we'll go to a café.","ja":"友人を訪ねてからカフェに行きます。"},{"role":"A","ar":"هَلْ الْمَقْهَى قَرِيبٌ؟","en":"Is the café nearby?","ja":"カフェは近くですか？"},{"role":"B","ar":"نَعَمْ، قَرِيبٌ مِنْ هُنَا.","en":"Yes, near here.","ja":"はい、ここから近くです。"},{"role":"A","ar":"هَلْ يُمْكِنُنِي أَنْ أَذْهَبَ مَعَكُمْ؟","en":"May I go with you?","ja":"一緒に行ってもいいですか？"},{"role":"B","ar":"نَعَمْ، بِكُلِّ سُرُورٍ.","en":"Yes, of course.","ja":"はい、もちろんです。"}],"twist":"Change the location and time, then say the café is closed and choose another place."},{"title":"Change a plan politely","turns":[{"role":"A","ar":"أَيْنَ نَلْتَقِي غَدًا؟","en":"Where shall we meet tomorrow?","ja":"明日どこで会いますか？"},{"role":"B","ar":"نَلْتَقِي أَمَامَ الْمَقْهَى.","en":"Let's meet in front of the café.","ja":"カフェの前で会いましょう。"},{"role":"A","ar":"أَعْتَذِرُ، لَا أَسْتَطِيعُ أَنْ آتِيَ فِي السَّادِسَةِ.","en":"Sorry, I can't come at six.","ja":"ごめんなさい。6時には行けません。"},{"role":"B","ar":"هَلْ تُنَاسِبُكَ السَّابِعَةُ؟","en":"Would seven work?","ja":"7時ならどうですか？"},{"role":"A","ar":"نَعَمْ، هَذَا وَقْتٌ مُنَاسِبٌ.","en":"Yes, that's a good time.","ja":"はい、都合がいいです。"},{"role":"B","ar":"مُمْتَازٌ، إِلَى اللِّقَاءِ غَدًا.","en":"Excellent, see you tomorrow.","ja":"いいですね。では明日。"}],"twist":"The teacher says the meeting venue has moved; learner confirms both location and time."}],"classes":[{"day":"Mon 1 Feb 2027","name":"BUILD · Invite and accept","goal":"Invite someone, accept or decline with a short explanation.","missions":[{"en":"Invite your teacher to lunch using a full sentence.","ja":"講師をランチに誘う。"},{"en":"Decline politely and propose another date.","ja":"丁寧に辞退して別の日を提案する。"},{"en":"Swap roles and ask two follow-up questions.","ja":"役割交代して質問を2つする。"}],"questions":[{"ar":"هَلْ نَذْهَبُ لِلْغَدَاءِ؟","en":"Shall we go for lunch?","ja":"ランチへ行きませんか？"},{"ar":"هَلْ أَنْتَ مُتَاحٌ غَدًا؟","en":"Are you free tomorrow?","ja":"明日は空いていますか？"},{"ar":"لِمَاذَا لَا تَسْتَطِيعُ؟","en":"Why can't you?","ja":"なぜ難しいですか？"}],"teacher":"Avoid over-correcting; after the role-play choose three important errors for a new attempt.","exit":"Student makes three invitations with different replies."},{"day":"Wed 3 Feb 2027","name":"USE · Organize a weekend plan","goal":"Choose a location and time, change plans once.","missions":[{"en":"Plan dinner with two people who have different schedules.","ja":"都合の違う2人の夕食を調整する。"},{"en":"Offer two restaurants and explain which you prefer.","ja":"店を2つ提案し好みを説明する。"},{"en":"Teacher changes the location with no warning.","ja":"講師が急に場所を変更し対応する。"}],"questions":[{"ar":"مَتَى نَلْتَقِي؟","en":"When shall we meet?","ja":"いつ会いますか？"},{"ar":"أَيْنَ نَلْتَقِي؟","en":"Where shall we meet?","ja":"どこで会いますか？"},{"ar":"هَلْ هَذَا الْوَقْتُ مُنَاسِبٌ؟","en":"Is this a good time?","ja":"この時間でいいですか？"}],"teacher":"Teacher pretends the café closes early. Learner must choose a new time or venue.","exit":"2-minute spontaneous invitation and scheduling dialogue."},{"day":"Fri 5 Feb 2027","name":"TRANSFER · Social conversation","goal":"Keep talking, ask questions, offer an alternative.","missions":[{"en":"Call a friend you haven't seen recently and make a plan.","ja":"久しぶりの友人と予定を決める。"},{"en":"Discuss yesterday's activities and this weekend's plans.","ja":"昨日の行動と週末の予定を話す。"},{"en":"Recover from two unexpected changes to the plan.","ja":"2回の予定変更に対応する。"}],"questions":[{"ar":"مَاذَا فَعَلْتَ أَمْسِ؟","en":"What did you do yesterday?","ja":"昨日何をしましたか？"},{"ar":"مَاذَا سَتَفْعَلُ غَدًا؟","en":"What will you do tomorrow?","ja":"明日は何をしますか？"},{"ar":"هَلْ تُفَضِّلُ مَكَانًا آخَرَ؟","en":"Would you prefer another place?","ja":"別の場所がいいですか？"}],"teacher":"Run the last round with no script; rate whether the learner initiates questions.","exit":"90 sec: create and confirm a full plan and one change."}],"test":[{"en":"Invite someone to dinner.","ja":"夕食に行きませんか？","answer":{"ar":"هَلْ نَذْهَبُ لِلْعَشَاءِ؟","roman":"hal nadhhabu lil-ʿashāʾi","en":"Model answer","ja":"回答例"}},{"en":"Accept an invitation with pleasure.","ja":"喜んで承諾する。","answer":{"ar":"نَعَمْ، بِكُلِّ سُرُورٍ.","roman":"naʿam bikulli surūrin","en":"Model answer","ja":"回答例"}},{"en":"Decline politely: Sorry, I'm busy today.","ja":"ごめんなさい、今日は忙しいです。","answer":{"ar":"أَعْتَذِرُ، أَنَا مَشْغُولٌ الْيَوْمَ.","roman":"aʿtadhiru anā mashghūlun al-yawma","en":"Model answer","ja":"回答例"}},{"en":"Ask: When shall we meet?","ja":"いつ会いますか？","answer":{"ar":"مَتَى نَلْتَقِي؟","roman":"matā naltaqī","en":"Model answer","ja":"回答例"}},{"en":"Say: Let's meet at six.","ja":"6時に会いましょう。","answer":{"ar":"نَلْتَقِي فِي السَّاعَةِ السَّادِسَةِ.","roman":"naltaqī fī as-sāʿati as-sādisati","en":"Model answer","ja":"回答例"}},{"en":"Say: I'll wait in front of the café.","ja":"カフェの前で待ちます。","answer":{"ar":"سَأَنْتَظِرُ أَمَامَ الْمَقْهَى.","roman":"sa-antaẓiru amāma al-maqhā","en":"Model answer","ja":"回答例"}}],"checks":["I can explain my choice in two sentences / 理由を2文で説明できる","I can ask at least four questions / 4つ以上質問できる","I can answer without reading / 台本なしで答えられる","I can change details or roles / 役割や条件を変更できる","I can repeat after feedback / 修正後に言い直せる"],"speaking":{"fusha":"These invitations are in simple Modern Standard Arabic. For clear classroom speech, focus on the question pattern, politeness and confirming a time and place.","real":"In UAE daily life, social invitations are often phrased in local or Levantine dialects. Fuṣḥā is understood but may sound formal. Ask the Syrian teacher to demonstrate a natural Syrian alternative and explicitly label it as dialect; continue to practise Fuṣḥā as the target."}};</script><script src="../assets/lesson-engine.js"></script><script defer src="../assets/site-navigation.js"></script><script defer src="../assets/lesson-ui.js"></script></body></html>
