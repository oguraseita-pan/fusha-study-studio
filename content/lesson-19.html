<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fuṣḥā speaking Week 19: Real-Life Conversation Challenge"><title>Lesson 19 — Real-Life Conversation Challenge | Fuṣḥā Study Studio</title><link rel="stylesheet" href="../assets/lesson-engine.css"><link rel="stylesheet" href="../assets/site-navigation.css"><link rel="stylesheet" href="../assets/lesson-ui.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"></head><body><div class="top"><a href="../index.html">← Fuṣḥā Study Studio</a><div class="tools"><span class="voice-state" id="voice-state">Tap Arabic text for audio</span><button data-switch="ja" aria-pressed="true">日本語</button><button data-switch="en" aria-pressed="true">English</button><button data-switch="answers" aria-pressed="false">Answers</button><button onclick="window.print()">Print / PDF</button></div></div><main id="content" class="wrap"></main><script>window.LESSON_DATA={"week":19,"title":"Real-Life Conversation Challenge","jaTitle":"日常の複合場面・聞き返し・臨機応変な会話","arTitle":"مَحَادَثَاتٌ حَقِيقِيَّةٌ فِي الْحَيَاةِ الْيَوْمِيَّةِ","dates":"8 · 10 · 12 March 2027","outcome":"Handle three connected real-life situations without a script: ask questions, solve an unexpected problem, confirm information and keep the conversation going.","goals":["Handle a multi-step restaurant or shopping exchange / 注文・買い物の複数のやり取りを続ける","Recover from unexpected answers by asking for clarification / 聞き返して会話を立て直す","Combine past, present and future in one exchange / 過去・現在・未来を会話で組み合わせる","Confirm an address, amount, time or next step / 数量・場所・日時・次の行動を確認する"],"review":[{"en":"Weeks 3 and 13: Compare a price and explain your choice.","ja":"第3・13週：価格を比較し、選ぶ理由を述べる。"},{"en":"Weeks 5 and 14: Invite someone and change the plan.","ja":"第5・14週：相手を誘い、予定を変更する。"},{"en":"Weeks 10 and 15: Ask for repetition and solve a problem.","ja":"第10・15週：聞き返し、問題を解決する。"}],"vocab":[{"ar":"أَسْأَلُ","roman":"asʾalu","en":"I ask","ja":"私は質問する","type":"verb","past":"سَأَلَ","present":"يَسْأَلُ","me":"أَسْأَلُ","example":{"ar":"أَسْأَلُ عَنِ السِّعْرِ.","roman":"","en":"I ask about the price.","ja":"価格について質問します。"}},{"ar":"أُوَضِّحُ","roman":"uwaḍḍiḥu","en":"I clarify / explain","ja":"私は説明する","type":"verb","past":"وَضَّحَ","present":"يُوَضِّحُ","me":"أُوَضِّحُ","example":{"ar":"أُوَضِّحُ الْمُشْكِلَةَ.","roman":"","en":"I clarify the problem.","ja":"問題を説明します。"}},{"ar":"أُكَرِّرُ","roman":"ukarriru","en":"I repeat","ja":"私は繰り返す","type":"verb","past":"كَرَّرَ","present":"يُكَرِّرُ","me":"أُكَرِّرُ","example":{"ar":"أُكَرِّرُ الرَّقْمَ.","roman":"","en":"I repeat the number.","ja":"数字を繰り返します。"}},{"ar":"أَنْتَظِرُ","roman":"antaẓiru","en":"I wait","ja":"私は待つ","type":"verb","past":"اِنْتَظَرَ","present":"يَنْتَظِرُ","me":"أَنْتَظِرُ","example":{"ar":"أَنْتَظِرُ أَمَامَ الْمَطْعَمِ.","roman":"","en":"I wait in front of the restaurant.","ja":"レストランの前で待ちます。"}},{"ar":"أَبْحَثُ","roman":"abḥathu","en":"I look for","ja":"私は探す","type":"verb","past":"بَحَثَ","present":"يَبْحَثُ","me":"أَبْحَثُ","example":{"ar":"أَبْحَثُ عَنْ مَكَانٍ قَرِيبٍ.","roman":"","en":"I am looking for somewhere nearby.","ja":"近くの場所を探しています。"}},{"ar":"أُرْسِلُ","roman":"ursilu","en":"I send","ja":"私は送る","type":"verb","past":"أَرْسَلَ","present":"يُرْسِلُ","me":"أُرْسِلُ","example":{"ar":"أُرْسِلُ عُنْوَانِي بِرِسَالَةٍ.","roman":"","en":"I send my address in a message.","ja":"住所をメッセージで送ります。"}},{"ar":"أَتَّصِلُ","roman":"attaṣilu","en":"I call","ja":"私は電話する","type":"verb","past":"اِتَّصَلَ","present":"يَتَّصِلُ","me":"أَتَّصِلُ","example":{"ar":"سَأَتَّصِلُ بِكَ غَدًا.","roman":"","en":"I'll call you tomorrow.","ja":"明日電話します。"}},{"ar":"أُغَيِّرُ","roman":"ughayyiru","en":"I change","ja":"私は変更する","type":"verb","past":"غَيَّرَ","present":"يُغَيِّرُ","me":"أُغَيِّرُ","example":{"ar":"أُغَيِّرُ الْمَوْعِدَ.","roman":"","en":"I change the appointment.","ja":"予約を変更します。"}},{"ar":"أُؤَكِّدُ","roman":"uʾakkidu","en":"I confirm","ja":"私は確認する","type":"verb","past":"أَكَّدَ","present":"يُؤَكِّدُ","me":"أُؤَكِّدُ","example":{"ar":"أُؤَكِّدُ الطَّلَبَ.","roman":"","en":"I confirm the order.","ja":"注文を確認します。"}},{"ar":"أَعْرِفُ","roman":"aʿrifu","en":"I know","ja":"私は知っている","type":"verb","past":"عَرَفَ","present":"يَعْرِفُ","me":"أَعْرِفُ","example":{"ar":"لَا أَعْرِفُ الْعُنْوَانَ.","roman":"","en":"I don't know the address.","ja":"住所を知りません。"}},{"ar":"عُنْوَانٌ","roman":"ʿunwānun","en":"address","ja":"住所","type":"noun","gender":"masculine","plural":"عَنَاوِينُ","example":{"ar":"مَا الْعُنْوَانُ الصَّحِيحُ؟","roman":"","en":"What's the correct address?","ja":"正しい住所は？"}},{"ar":"رَقْمٌ","roman":"raqmun","en":"number","ja":"番号","type":"noun","gender":"masculine","plural":"أَرْقَامٌ","example":{"ar":"هَذَا رَقْمُ هَاتِفِي.","roman":"","en":"This is my phone number.","ja":"これが私の電話番号です。"}},{"ar":"مَوْعِدٌ","roman":"mawʿidun","en":"appointment / time","ja":"約束・予約","type":"noun","gender":"masculine","plural":"مَوَاعِيدُ","example":{"ar":"مَوْعِدِي فِي السَّادِسَةِ.","roman":"","en":"My appointment is at six.","ja":"予約は6時です。"}},{"ar":"طَلَبٌ","roman":"ṭalabun","en":"order / request","ja":"注文","type":"noun","gender":"masculine","plural":"طَلَبَاتٌ","example":{"ar":"عِنْدِي طَلَبٌ جَدِيدٌ.","roman":"","en":"I have a new order.","ja":"新しい注文があります。"}},{"ar":"حَجْزٌ","roman":"ḥajzun","en":"booking","ja":"予約","type":"noun","gender":"masculine","plural":"حُجُوزَاتٌ","example":{"ar":"عِنْدِي حَجْزٌ لِشَخْصَيْنِ.","roman":"","en":"I have a booking for two.","ja":"2名で予約しています。"}},{"ar":"مَكَانٌ","roman":"makānun","en":"place","ja":"場所","type":"noun","gender":"masculine","plural":"أَمَاكِنُ","example":{"ar":"هَذَا الْمَكَانُ قَرِيبٌ.","roman":"","en":"This place is nearby.","ja":"この場所は近いです。"}},{"ar":"بَوَّابَةٌ","roman":"bawwābatun","en":"gate","ja":"ゲート","type":"noun","gender":"feminine","plural":"بَوَّابَاتٌ","example":{"ar":"أَيْنَ الْبَوَّابَةُ الثَّانِيَةُ؟","roman":"","en":"Where is gate two?","ja":"2番ゲートはどこですか？"}},{"ar":"فَاتُورَةٌ","roman":"fātūratun","en":"invoice / bill","ja":"請求書・勘定書","type":"noun","gender":"feminine","plural":"فَوَاتِيرُ","example":{"ar":"أُرِيدُ الْفَاتُورَةَ، مِنْ فَضْلِكَ.","roman":"","en":"I'd like the bill, please.","ja":"お会計をお願いします。"}},{"ar":"سِعْرٌ","roman":"siʿrun","en":"price","ja":"価格","type":"noun","gender":"masculine","plural":"أَسْعَارٌ","example":{"ar":"هَلْ هَذَا السِّعْرُ نِهَائِيٌّ؟","roman":"","en":"Is this the final price?","ja":"これは最終価格ですか？"}},{"ar":"رِسَالَةٌ","roman":"risālatun","en":"message","ja":"メッセージ","type":"noun","gender":"feminine","plural":"رَسَائِلُ","example":{"ar":"سَأُرْسِلُ رِسَالَةً.","roman":"","en":"I will send a message.","ja":"メッセージを送ります。"}},{"ar":"مِنْ فَضْلِكَ","roman":"min faḍlika","en":"please (to a man)","ja":"お願いします","type":"expression","example":{"ar":"تَكَلَّمْ بِبُطْءٍ، مِنْ فَضْلِكَ.","roman":"","en":"Speak slowly, please.","ja":"ゆっくり話してください。"}},{"ar":"مَرَّةً أُخْرَى","roman":"marratan ukhrā","en":"one more time","ja":"もう一度","type":"expression","example":{"ar":"كَرِّرْ ذَلِكَ مَرَّةً أُخْرَى.","roman":"","en":"Repeat that one more time.","ja":"もう一度繰り返してください。"}},{"ar":"بِبُطْءٍ","roman":"bibuṭʾin","en":"slowly","ja":"ゆっくり","type":"expression","example":{"ar":"هَلْ يُمْكِنُكَ أَنْ تَتَكَلَّمَ بِبُطْءٍ؟","roman":"","en":"Could you speak slowly?","ja":"ゆっくり話してもらえますか？"}},{"ar":"لَا مُشْكِلَةَ","roman":"lā mushkilata","en":"no problem","ja":"問題ありません","type":"expression","example":{"ar":"لَا مُشْكِلَةَ، نَلْتَقِي غَدًا.","roman":"","en":"No problem. We'll meet tomorrow.","ja":"大丈夫です。明日会いましょう。"}}],"grammar":[{"title":"Recover with three steps: say, ask, confirm","en":"If you don't understand, say لَا أَفْهَمُ, ask a repeat or slow speech, then confirm with هَلْ هَذَا صَحِيحٌ؟ . This is a conversation skill, not a new grammatical form.","ja":"聞こえない・分からない時は「分からない」→「聞き返す」→「復唱・確認」の3段階。新しい難しい文法よりも会話継続力を優先します。","example":{"ar":"لَا أَفْهَمُ. هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"lā afhamu · hal yumkinuka an tukarrira","en":"I don't understand. Could you repeat?","ja":"分かりません。繰り返してもらえますか？"},"drill":"Teacher supplies a new number once; learner must request a repeat, then confirm it."},{"title":"Switch from a question to a useful request","en":"Use هَلْ for yes/no, أَيْنَ for a place, مَتَى for time, كَمْ for amount and مَا for 'what'. Follow the question with an action you need.","ja":"疑問詞を状況に応じて使い分けます：هَلْ、أَيْنَ、مَتَى、كَمْ、مَا。質問だけで終えず、次の行動を言いましょう。","example":{"ar":"أَيْنَ الْمَطْعَمُ؟ هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ الْعُنْوَانَ؟","roman":"ayna al-maṭʿamu · hal yumkinuka an tursila al-ʿunwāna","en":"Where is the restaurant? Can you send the address?","ja":"お店はどこですか？住所を送ってもらえますか？"},"drill":"Change place to hotel, shop and meeting room; learner adds a suitable request."},{"title":"Use past, present and future together","en":"Use a completed verb for what happened, imperfect for the situation now, and سَـ + imperfect for your next step. This lets you explain a practical problem in three short sentences.","ja":"過去は完了形、現在は未完了形、未来は سَـ＋未完了形。「何が起きたか→今どうか→これから何をするか」を3文で説明します。","example":{"ar":"تَأَخَّرَتِ السَّيَّارَةُ. أَنَا أَنْتَظِرُ الْآنَ. سَأَتَّصِلُ بِكَ.","roman":"taʾakhkharati as-sayyāratu · anā antaẓiru al-āna · sa-attaṣilu bika","en":"The car was delayed. I am waiting now. I will call you.","ja":"車が遅れました。今待っています。電話します。"},"drill":"Teacher asks what happened, what is happening and what you will do next."},{"title":"Confirm exact details: numbers, dates and locations","en":"Repeat the important detail aloud and ask هَلْ هَذَا صَحِيحٌ؟. In real life, asking a second time is better than guessing. You can use نَعَمْ and لَا, then state the corrected information.","ja":"数字・時間・住所は必ず復唱して「合っていますか？」と確認。実際の会話では推測で進めるより、聞き直すほうが安全です。","example":{"ar":"الْمَوْعِدُ فِي السَّادِسَةِ، هَلْ هَذَا صَحِيحٌ؟","roman":"al-mawʿidu fī as-sādisati · hal hādhā ṣaḥīḥun","en":"The appointment is at six, is that right?","ja":"約束は6時ですね。合っていますか？"},"drill":"Teacher changes the appointment from six to seven, then the meeting place."}],"phrases":[{"ar":"عُذْرًا، لَا أَفْهَمُ.","roman":"ʿudhran lā afhamu","en":"Excuse me, I don't understand.","ja":"すみません、分かりません。"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"hal yumkinuka an tukarrira","en":"Could you repeat? (to a man)","ja":"繰り返してもらえますか？"},{"ar":"تَكَلَّمْ بِبُطْءٍ، مِنْ فَضْلِكَ.","roman":"takallam bibuṭʾin min faḍlika","en":"Please speak slowly (to a man).","ja":"ゆっくり話してください。"},{"ar":"مَاذَا تَقْصِدُ؟","roman":"mādhā taqṣidu","en":"What do you mean? (to a man)","ja":"どういう意味ですか？"},{"ar":"هَلْ هَذَا الرَّقْمُ صَحِيحٌ؟","roman":"hal hādhā ar-raqmu ṣaḥīḥun","en":"Is this number correct?","ja":"この番号で合っていますか？"},{"ar":"مَا الْعُنْوَانُ الصَّحِيحُ؟","roman":"mā al-ʿunwānu aṣ-ṣaḥīḥu","en":"What's the correct address?","ja":"正しい住所は何ですか？"},{"ar":"مَتَى الْمَوْعِدُ الْجَدِيدُ؟","roman":"matā al-mawʿidu al-jadīdu","en":"When is the new appointment?","ja":"新しい予定はいつですか？"},{"ar":"أُرِيدُ أَنْ أُغَيِّرَ الْحَجْزَ.","roman":"urīdu an ughayyira al-ḥajza","en":"I'd like to change the reservation.","ja":"予約を変更したいです。"},{"ar":"سَأُرْسِلُ الْعُنْوَانَ فِي رِسَالَةٍ.","roman":"sa-ursilu al-ʿunwāna fī risālatin","en":"I'll send the address in a message.","ja":"住所をメッセージで送ります。"},{"ar":"تَأَخَّرْتُ، وَسَأَصِلُ بَعْدَ عَشْرِ دَقَائِقَ.","roman":"taʾakhkhartu wa-sa-aṣilu baʿda ʿashri daqāʾiqa","en":"I'm late and will arrive in ten minutes.","ja":"遅れています。10分後に着きます。"},{"ar":"لَا مُشْكِلَةَ، شُكْرًا.","roman":"lā mushkilata · shukran","en":"No problem, thank you.","ja":"問題ありません。ありがとうございます。"},{"ar":"مَا الَّذِي سَنَفْعَلُهُ بَعْدَ ذَلِكَ؟","roman":"mā alladhī sanafʿaluhu baʿda dhālika","en":"What shall we do next?","ja":"次に何をしますか？"}],"dialogues":[{"title":"Restaurant booking + changed plans","turns":[{"role":"A","ar":"مَرْحَبًا، عِنْدِي حَجْزٌ لِشَخْصَيْنِ فِي السَّادِسَةِ.","en":"Hello, I have a reservation for two at six.","ja":"こんにちは。6時に2人で予約しています。"},{"role":"B","ar":"نَعَمْ، وَلَكِنْ لَا تُوجَدُ طَاوِلَةٌ فِي السَّادِسَةِ.","en":"Yes, but there's no table available at six.","ja":"はい、ですが6時の席がありません。"},{"role":"A","ar":"عُذْرًا، هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","en":"Sorry, could you repeat that?","ja":"すみません、繰り返してもらえますか？"},{"role":"B","ar":"هُنَاكَ طَاوِلَةٌ فِي السَّابِعَةِ.","en":"There is a table at seven.","ja":"7時の席ならあります。"},{"role":"A","ar":"حَسَنًا، أُرِيدُ أَنْ أُغَيِّرَ الْحَجْزَ إِلَى السَّابِعَةِ.","en":"Okay, I'd like to change the booking to seven.","ja":"では7時に変更したいです。"},{"role":"B","ar":"حَسَنًا، الْحَجْزُ فِي السَّابِعَةِ.","en":"Okay, the reservation is at seven.","ja":"承知しました。7時のご予約です。"},{"role":"A","ar":"شُكْرًا، هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ الْعُنْوَانَ؟","en":"Thanks, can you send the address?","ja":"ありがとうございます。住所を送ってもらえますか？"},{"role":"B","ar":"نَعَمْ، سَأُرْسِلُهُ فِي رِسَالَةٍ.","en":"Yes, I'll send it in a message.","ja":"はい、メッセージで送ります。"}],"twist":"The table is only available for three people or the price is higher; learner must choose and confirm."},{"title":"Taxi, a late arrival and a call","turns":[{"role":"A","ar":"مِنْ فَضْلِكَ، أُرِيدُ الذَّهَابَ إِلَى هَذَا الْعُنْوَانِ.","en":"Please, I want to go to this address.","ja":"この住所へお願いします。"},{"role":"B","ar":"هَلْ هَذَا قَرِيبٌ مِنَ الْمَطَارِ؟","en":"Is it near the airport?","ja":"空港の近くですか？"},{"role":"A","ar":"نَعَمْ، وَلَكِنْ أَنَا مُتَأَخِّرٌ.","en":"Yes, but I'm running late.","ja":"はい、ただ遅れています。"},{"role":"B","ar":"سَنَصِلُ بَعْدَ عِشْرِينَ دَقِيقَةً.","en":"We'll arrive in twenty minutes.","ja":"20分後に着きます。"},{"role":"A","ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ الْوَقْتَ؟","en":"Could you repeat the time?","ja":"時間をもう一度言ってもらえますか？"},{"role":"B","ar":"عِشْرُونَ دَقِيقَةً.","en":"Twenty minutes.","ja":"20分です。"},{"role":"A","ar":"شُكْرًا. سَأَتَّصِلُ بِصَدِيقِي.","en":"Thanks. I'll call my friend.","ja":"ありがとうございます。友人に電話します。"},{"role":"B","ar":"حَسَنًا، لَا مُشْكِلَةَ.","en":"Okay, no problem.","ja":"わかりました。問題ありません。"}],"twist":"The driver takes a wrong turn; learner must correct the destination politely."},{"title":"Work request, delay and follow-up","turns":[{"role":"A","ar":"هَلْ وَصَلَتِ الْعَيِّنَةُ؟","en":"Has the sample arrived?","ja":"サンプルは届きましたか？"},{"role":"B","ar":"لَا، لَمْ تَصِلْ بَعْدُ.","en":"No, it hasn't arrived yet.","ja":"いいえ、まだ届いていません。"},{"role":"A","ar":"مَتَى سَتَصِلُ؟","en":"When will it arrive?","ja":"いつ届きますか？"},{"role":"B","ar":"أَعْتَقِدُ أَنَّهَا سَتَصِلُ غَدًا.","en":"I think it will arrive tomorrow.","ja":"明日届くと思います。"},{"role":"A","ar":"هَلْ يُمْكِنُكَ أَنْ تُؤَكِّدَ الْمَوْعِدَ؟","en":"Can you confirm the date?","ja":"日程を確認できますか？"},{"role":"B","ar":"نَعَمْ، سَأَتَحَقَّقُ وَأُرْسِلُ رِسَالَةً.","en":"Yes, I'll check and send a message.","ja":"はい、確認して連絡します。"},{"role":"A","ar":"شُكْرًا. سَأَنْتَظِرُ رِسَالَتَكَ.","en":"Thanks. I'll wait for your message.","ja":"ありがとうございます。ご連絡を待ちます。"},{"role":"B","ar":"حَسَنًا، إِلَى اللِّقَاءِ.","en":"Okay, goodbye.","ja":"ではまた。"}],"twist":"The delivery date changes twice and the customer's schedule is tight; confirm a practical next step."}],"classes":[{"day":"Mon 8 Mar 2027","name":"STATION A · Restaurant + shopping","goal":"Integrate ordering, price, booking, preferences and clarification.","missions":[{"en":"Book a table, then learn the time is unavailable.","ja":"予約した時間が空いていない状況に対応する。"},{"en":"Order two items, ask for a price, change one item.","ja":"2品を注文し価格を尋ね、1品変更する。"},{"en":"Confirm time, party size, amount and address.","ja":"時刻・人数・金額・住所を確認する。"}],"questions":[{"ar":"هَلْ عِنْدَكُمْ طَاوِلَةٌ لِشَخْصَيْنِ؟","en":"Do you have a table for two?","ja":"2名の席はありますか？"},{"ar":"مَا سِعْرُ هَذَا؟","en":"How much is this?","ja":"これはいくらですか？"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ الْوَقْتَ؟","en":"Could you repeat the time?","ja":"時間を繰り返してもらえますか？"}],"teacher":"Do not show the answer during free dialogue. Change two details and ask the learner to confirm.","exit":"3-minute conversation covering reservation, change and confirmation."},{"day":"Wed 10 Mar 2027","name":"STATION B · Transport + social plans","goal":"Make a travel plan, solve a delay and notify another person.","missions":[{"en":"Take a taxi to an unfamiliar location.","ja":"初めての場所へタクシーで行く。"},{"en":"You are late; call your friend and adjust the meeting.","ja":"遅れるので友人に電話して時刻変更する。"},{"en":"Ask directions when you cannot find the place.","ja":"場所が見つからず道を尋ねる。"}],"questions":[{"ar":"أَيْنَ هَذَا الْمَكَانُ؟","en":"Where is this place?","ja":"ここはどこですか？"},{"ar":"مَتَى سَتَصِلُ؟","en":"When will you arrive?","ja":"いつ到着しますか？"},{"ar":"هَلْ يُنَاسِبُكَ مَوْعِدٌ آخَرُ؟","en":"Would another time work for you?","ja":"別の時間は大丈夫ですか？"}],"teacher":"Use two surprise changes. The student must ask follow-up questions instead of guessing.","exit":"3-minute conversation involving driver and friend."},{"day":"Fri 12 Mar 2027","name":"STATION C · Work + problem resolution","goal":"Explain a problem, propose next steps and make a short summary.","missions":[{"en":"Call about a missing sample and request an update.","ja":"未着のサンプルについて電話する。"},{"en":"Discuss price and quantity after a change in delivery.","ja":"納期変更後に価格・数量を話す。"},{"en":"Summarise who will send what and by when.","ja":"誰がいつ何を送るか確認する。"}],"questions":[{"ar":"مَتَى سَتَصِلُ الْعَيِّنَةُ؟","en":"When will the sample arrive?","ja":"サンプルはいつ届きますか？"},{"ar":"مَا الشُّرُوطُ الْجَدِيدَةُ؟","en":"What are the new conditions?","ja":"新しい条件は何ですか？"},{"ar":"مَنْ سَيُرْسِلُ التَّأْكِيدَ؟","en":"Who will send confirmation?","ja":"誰が確認連絡しますか？"}],"teacher":"Keep the situation realistic. Score meaning, questions, recovery and confirmed action, not word count.","exit":"3-minute work call with problem, solution, and confirmed follow-up."}],"test":[{"en":"Say: Please speak slowly.","ja":"ゆっくり話してください。","answer":{"ar":"تَكَلَّمْ بِبُطْءٍ، مِنْ فَضْلِكَ.","roman":"takallam bibuṭʾin min faḍlika","en":"Model answer","ja":"回答例"}},{"en":"Ask: What's the correct address?","ja":"正しい住所は何ですか？","answer":{"ar":"مَا الْعُنْوَانُ الصَّحِيحُ؟","roman":"mā al-ʿunwānu aṣ-ṣaḥīḥu","en":"Model answer","ja":"回答例"}},{"en":"Say: I'd like to change the reservation.","ja":"予約を変更したいです。","answer":{"ar":"أُرِيدُ أَنْ أُغَيِّرَ الْحَجْزَ.","roman":"urīdu an ughayyira al-ḥajza","en":"Model answer","ja":"回答例"}},{"en":"Say: I will send the address in a message.","ja":"住所をメッセージで送ります。","answer":{"ar":"سَأُرْسِلُ الْعُنْوَانَ فِي رِسَالَةٍ.","roman":"sa-ursilu al-ʿunwāna fī risālatin","en":"Model answer","ja":"回答例"}},{"en":"Ask: Is this number correct?","ja":"この番号で合っていますか？","answer":{"ar":"هَلْ هَذَا الرَّقْمُ صَحِيحٌ؟","roman":"hal hādhā ar-raqmu ṣaḥīḥun","en":"Model answer","ja":"回答例"}},{"en":"Say: I'm late and will arrive in ten minutes.","ja":"遅れています、10分後に着きます。","answer":{"ar":"تَأَخَّرْتُ، وَسَأَصِلُ بَعْدَ عَشْرِ دَقَائِقَ.","roman":"taʾakhkhartu wa-sa-aṣilu baʿda ʿashri daqāʾiqa","en":"Model answer","ja":"回答例"}},{"en":"Ask: What shall we do next?","ja":"次に何をしますか？","answer":{"ar":"مَا الَّذِي سَنَفْعَلُهُ بَعْدَ ذَلِكَ؟","roman":"mā alladhī sanafʿaluhu baʿda dhālika","en":"Model answer","ja":"回答例"}},{"en":"Say: No problem, thank you.","ja":"大丈夫です、ありがとうございます。","answer":{"ar":"لَا مُشْكِلَةَ، شُكْرًا.","roman":"lā mushkilata · shukran","en":"Model answer","ja":"回答例"}}],"checks":["I ask for repetition without switching to English / 英語に逃げずに聞き返す","I confirm numbers and dates accurately / 数字と日時を正確に確認する","I complete three different situations / 3つの異なる状況に対応する","I can move from a problem to the next action / 問題から次の行動につなげる","I speak without reading during the last round / 最終練習で台本を見ない"],"speaking":{"fusha":"Practical Fuṣḥā gives you clear and understandable wording for requests, problems and confirmations. This lesson emphasises communication repair rather than adding new grammatical exceptions.","real":"In Dubai, a conversation may switch between dialects and English. Be ready to ask for simpler Fuṣḥā, slower speech or repetition. Confirm numbers, places and appointments explicitly."}};</script><script src="../assets/lesson-engine.js"></script><script defer src="../assets/site-navigation.js"></script><script defer src="../assets/lesson-ui.js"></script></body></html>
