<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fuṣḥā Grammar · A0–B2 | Fuṣḥā Study Studio</title>
<meta name="description" content="Unified Modern Standard Arabic grammar reference with English, Japanese and Arabic practice modes."/>
<style>
:root{--ink:#213943;--muted:#69818b;--nav:#11333e;--teal:#147f70;--line:#dce8e8;--pale:#f3f8f7;--paper:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eff5f3;color:var(--ink);font:15px/1.75 system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;background:var(--nav);color:white;box-shadow:0 4px 16px #071a2420}
.nav{max-width:1240px;margin:auto;padding:10px 20px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.nav a{color:#e3f6f2;text-decoration:none;font-weight:700;font-size:14px}.nav .controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nav button,.nav select{color:#d7ede8;background:transparent;border:1px solid #60847f;border-radius:9px;padding:7px 11px;font-size:13px}
.nav button.active{color:#104638;background:#e0f3eb;border-color:#e0f3eb}
.nav button[lang=ar]{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:20px;padding:2px 12px}
.container{max-width:1240px;margin:auto;padding:28px 20px 72px}
.hero{border-radius:22px;background:linear-gradient(112deg,#11323f,#1b655f);color:white;padding:32px 36px}
.kicker{font-size:11px;letter-spacing:1.7px;font-weight:800;color:#b0dcd3}
.hero h1{font-size:clamp(28px,4vw,39px);margin:8px 0;line-height:1.2}
.hero p{max-width:780px;font-size:14px;color:#d8ebe8;margin:6px 0}.hero .arhead{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:38px;line-height:1.8}
.booknav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.booknav a{border-radius:11px;padding:10px 19px;background:#fff;border:1px solid #d9e5e2;text-decoration:none;color:#254c52;font-weight:800}
.booknav a.active{background:#146e64;color:white;border-color:#146e64}
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:18px;align-items:start}
.sidebar{position:sticky;top:82px;border:1px solid var(--line);background:white;border-radius:17px;padding:16px;max-height:calc(100vh - 100px);overflow-y:auto}
.sidebar label{display:block;color:#607c7b;font-size:12px;font-weight:700;margin-bottom:7px}
.sidebar input{width:100%;border:1px solid #d9e7e5;border-radius:10px;padding:10px 12px}
.chapters{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.chapters button{font-size:13px;text-align:left;border:1px solid transparent;border-radius:10px;color:#476368;background:transparent;padding:9px 10px;line-height:1.55}
.chapters button:hover{background:#e9f5f1}.chapters button.active{background:#e1f2eb;border-color:#b9ddcf;color:#115a4f;font-weight:750}
.chapters .num{display:inline-block;width:32px;font-weight:800;color:#0c8373}
.paper{background:white;border:1px solid var(--line);border-radius:18px;padding:32px 37px;min-height:450px;box-shadow:0 8px 26px #14363d0a}
.overline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#698388;font-weight:750;font-size:12px;letter-spacing:.08em}
.article-title{font-size:clamp(24px,3vw,33px);line-height:1.3;color:#153d49;margin:17px 0 10px}
.article-title.ar{font-size:clamp(34px,4vw,49px);line-height:1.8}
.note{font-size:13px;color:#627c7c;background:#eef8f4;border-left:3px solid #3caa92;padding:12px 15px;border-radius:8px;margin:16px 0}
.small{font-size:12px;color:#839197}
.chapter .chapter-head{margin-bottom:19px}.chapter .chapter-head h2{font-size:25px;margin:0 0 12px;color:#164450;line-height:1.3}
.chapter h3{font-size:17px;color:#13796e;margin:26px 0 12px}
.chapter .lead{font-size:15px;line-height:1.8;margin:10px 0}
.chapter .rules{display:grid;gap:9px;margin-bottom:16px}
.chapter .rule{display:flex;gap:10px;align-items:flex-start;background:#f3f8f7;padding:13px 15px;border:1px solid #e3eded;border-radius:11px}
.chapter .rule-num{color:#148777;font-weight:800;min-width:24px}
.chapter .example-grid,.chapter .examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chapter .example{border:1px solid #e0eaea;background:#fff;border-radius:13px;padding:15px 16px;min-width:0}
.chapter .arline,.arword{direction:rtl;text-align:right;font:normal clamp(34px,3.5vw,45px)/1.8 "Noto Naskh Arabic","Amiri",serif;color:#115c55;cursor:pointer}
.chapter .roman{font-size:13px;color:#8b8484}
.chapter .translation{font-size:14px;margin:7px 0;color:#47616c}
.chapter .example-note{font-size:12px;color:#748388;line-height:1.6}
.chapter .audio-btn,.listen{font-size:12px;background:#e5f5ee;border:1px solid #c6e7da;border-radius:9px;color:#116d5c;padding:6px 12px;margin-top:8px;cursor:pointer}
.chapter .arin,.chapter .arabic,.chapter [lang=ar]:not(.arline){font-family:"Noto Naskh Arabic","Amiri",serif;font-size:1.6em;line-height:1.3;direction:rtl;unicode-bidi:isolate}
.chapter .practice,.chapter details{background:#f5f8f8;padding:15px 18px;border:1px solid #e2ebea;border-radius:11px;margin:14px 0}
.chapter li{margin:9px 0}.chapter summary{font-weight:700;cursor:pointer;color:#12695c}
.chapter .done-label,.chapter .chapter-index{display:none}
.chapter .teacher-note,.chapter .pronunciation,.chapter .review{margin-top:16px}
.jp-explain{font-size:16px;line-height:1.95;color:#304c53}
.jp-explain strong{color:#147c6f}.jp-source{margin:16px 0;border-top:1px solid #e5efed;padding-top:15px}
.jp-source .chapter-head h2{font-size:23px}
.jp-source .example{padding:13px}
.jp-source .chapter-index,.jp-source .done-label,.jp-source .cover{display:none}
.practice-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.practice-item{border:1px solid #dfebe8;border-radius:13px;padding:14px;display:flex;gap:12px;align-items:center}
.practice-item .arword{flex:1;min-width:0}
.practice-intro{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:30px;text-align:right;direction:rtl}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:25px;padding-top:18px;border-top:1px solid #e7eeed}
.actions button{border:1px solid #d6e4e2;background:white;padding:10px 17px;color:#225c58;font-weight:700;border-radius:10px}
.actions button:disabled{opacity:.4;cursor:default}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:#687b81}.check input{accent-color:#0a8c77;width:18px;height:18px}
.loading{padding:60px;text-align:center}
@media(max-width:840px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:230px}.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.paper{padding:21px}.hero{padding:25px}.practice-list,.chapter .example-grid,.chapter .examples{grid-template-columns:1fr}}
@media(max-width:480px){.nav{padding:9px 12px}.nav a{font-size:12px}.chapters{grid-template-columns:1fr}.container{padding:12px 9px 35px}.paper{padding:17px}.hero{border-radius:16px}.booknav a{padding:8px 12px}}
@media print{.topbar,.sidebar,.actions,.booknav,.listen{display:none!important}.container{padding:0}.layout{display:block}.paper{border:0;box-shadow:none}.hero{display:none}.chapter .example-grid{grid-template-columns:repeat(2,1fr)}}
</style><link rel="stylesheet" href="../assets/site-navigation.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"></head>
<body><header class="topbar"><div class="nav"><a href="../index.html">⌂ Fuṣḥā Study Studio</a><div class="controls"><button id="l-en" data-lang="en">English</button><button id="l-ja" data-lang="ja">日本語</button><button id="l-ar" data-lang="ar" lang="ar">العَرَبِيَّةُ</button></div></div></header>
<main class="container"><section class="hero"><div class="kicker">PRACTICAL ARABIC GRAMMAR · TWO VOLUMES</div><h1 id="bookTitle">Grammar</h1><p id="bookIntro"></p><div class="arhead" lang="ar" dir="rtl" id="bookAr"></div></section>
<div class="booknav"><a href="grammar.html?level=basic" id="basicLink">A0–A2 · Foundations</a><a href="grammar.html?level=advanced" id="advancedLink">B1–B2 · Development</a></div>
<div class="layout"><aside class="sidebar"><label for="search" id="searchLabel">Search chapters</label><input id="search" type="search" placeholder="Search / 検索 / بحث"/><div class="chapters" id="chapters"></div></aside>
<article class="paper"><div class="overline"><span id="chapterIndex"></span><span id="level"></span></div><div id="article" class="loading">Loading chapters…</div><div class="actions"><button id="prev" type="button">← Previous</button><button id="next" type="button">Next →</button></div></article></div></main>
<script src="../assets/grammar-topics.js"></script>
<script>
(function(){
 const data=window.FSS_GRAMMAR_TOPICS||[];
 const K="fss-preferred-language-v2";
 const p=new URLSearchParams(location.search);
 const requested=parseInt(p.get("chapter"),10)||parseInt((location.hash.match(/chapter-(\d+)/)||[])[1],10)||0;
 let level=p.get("level")==="advanced"?"advanced":p.get("level")==="basic"?"basic":requested>=36?"advanced":"basic";
 let lang=localStorage.getItem(K)||"en";if(!["en","ja","ar"].includes(lang))lang="en";
 const range=level==="basic"?[1,35]:[36,51];
 let active=requested>=range[0]&&requested<=range[1]?requested:range[0];
 let enSections=[],jaSections=[],jaById=new Map();
 const $=id=>document.getElementById(id);
 function labels(){
  const ar=lang==="ar",ja=lang==="ja";
  $("bookTitle").textContent=ar?(level==="basic"?"الْقَوَاعِدُ الْأَسَاسِيَّةُ":"الْقَوَاعِدُ الْمُتَقَدِّمَةُ"):level==="basic"?(ja?"文法書 A0–A2｜基礎":"Grammar A0–A2 · Foundations"):(ja?"文法書 B1–B2｜発展":"Grammar B1–B2 · Development");
  $("bookIntro").textContent=ar?"اِخْتَرْ دَرْسًا وَاسْتَمِعْ وَتَدَرَّبْ.":ja?"英語・日本語の原書51項目を主題ごとに対応させています。日本語原書の補講15A・15B・16Aは、サイトでは第16・17・19章として表示します。":"English and Japanese source chapters are aligned topic by topic across all 51 entries. The Japanese book labels three supplementary lessons 15A, 15B and 16A.";
  $("bookAr").textContent=level==="basic"?"مِنَ الْمُبْتَدِئِ إِلَى الْمُتَوَسِّطِ":"مَوَاضِيعُ الْمُسْتَوَى الْمُتَقَدِّمِ";
  $("searchLabel").textContent=ar?"ابْحَثْ عَنِ الدَّرْسِ":ja?"章を探す":"Search chapters";

  $("prev").textContent=ar?"→ السَّابِقُ":ja?"← 前の章":"← Previous";
  $("next").textContent=ar?"التَّالِي ←":ja?"次の章 →":"Next →";
  $("basicLink").textContent=ar?"A0–A2 · الْأَسَاسِيَّاتُ":ja?"A0–A2 · 基礎":"A0–A2 · Foundations";
  $("advancedLink").textContent=ar?"B1–B2 · التَّوَسُّعُ":ja?"B1–B2 · 発展":"B1–B2 · Development";
  $("basicLink").classList.toggle("active",level==="basic");$("advancedLink").classList.toggle("active",level==="advanced");
  document.querySelectorAll(".controls button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  document.documentElement.lang=lang;
 }
 function getTitle(n){
  const d=data[n-1];
  if(lang==="ar")return d.ar;
  if(lang==="ja")return jaById.get(d.jaSourceId)?.querySelector(".chapter-head h2")?.textContent.trim()||d.ja;
  return enSections[n-1]?.querySelector(".chapter-head h2")?.textContent.trim()||d.enShort;
 }
 function renderNav(){
  const q=$("search").value.trim().normalize("NFD").replace(/[\u064b-\u065f\u0670\u06d6-\u06ed]/g,"").toLowerCase();
  $("chapters").replaceChildren();
  for(let n=range[0];n<=range[1];n++){
   const d=data[n-1];if(q&&![d.ja,d.ar,d.enShort,String(n)].join(" ").normalize("NFD").replace(/[\u064b-\u065f\u0670\u06d6-\u06ed]/g,"").toLowerCase().includes(q))continue;
   const b=document.createElement("button");b.type="button";b.className=n===active?"active":"";
   const num=document.createElement("span");num.className="num";num.textContent=String(n).padStart(2,"0");
   b.append(num,document.createTextNode(getTitle(n)));b.onclick=()=>change(n);
   $("chapters").append(b);
  }
 }
 function sound(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  u.lang="ar-SA";u.rate=.79;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith("ar"));if(v)u.voice=v;
  speechSynthesis.speak(u);
 }
 function arabicExamples(n){
  const src=enSections[n-1];const nodes=src?[...src.querySelectorAll(".example .arline")]:[];
  const unique=new Set();const found=[];
  for(const node of nodes){const t=node.textContent.trim();if(t&&!unique.has(t)){unique.add(t);found.push(t)}}
  if(!found.length&&src){src.querySelectorAll(".arin[lang=ar]").forEach(node=>{const t=node.textContent.trim();if(t&&!unique.has(t)&&t.length<150){unique.add(t);found.push(t)}})}
  return found;
 }
 function addPlayHandlers(root){
  root.querySelectorAll(".audio-btn").forEach(b=>{
   b.textContent="▶ "+(lang==="ja"?"音声":"Listen");
   b.onclick=()=>sound(b.getAttribute("data-ar")||b.closest(".example")?.querySelector(".arline")?.textContent||"");
  });
  root.querySelectorAll(".arline").forEach(el=>{el.title="Tap to listen";el.addEventListener("click",()=>sound(el.textContent.trim()))});
 }
 function render(){
  labels();renderNav();
  const d=data[active-1],src=enSections[active-1],host=$("article");
  $("chapterIndex").textContent=lang==="ar"?"الدَّرْسُ "+active:lang==="ja"?"第"+active+"章":"CHAPTER "+String(active).padStart(2,"0");
  $("level").textContent=src?.dataset?.level|| (active<36?"A2":"B2");
  host.replaceChildren();host.className="";
  if(!src){host.textContent="Could not load this chapter. Check your network connection.";return}
  const h=document.createElement("h2");h.className="article-title"+(lang==="ar"?" ar":"");h.textContent=getTitle(active);host.append(h);
  if(lang==="en"){
    const clone=src.cloneNode(true);clone.querySelector(".chapter-head")?.remove();clone.querySelector(".done-label")?.remove();host.append(clone);
    addPlayHandlers(clone);
  }else if(lang==="ja"){
    const original=jaById.get(d.jaSourceId);
    if(!original){host.textContent="日本語版の対応する章が見つかりません。";return}
    const originalNo=d.jaSourceId.replace("lesson-","");
    const intro=document.createElement("div");intro.className="small";
    intro.textContent=originalNo===String(active)?"日本語版の詳細解説":"日本語原書では「"+originalNo+"」に該当する補講・章です。";
    host.append(intro);
    const chapter=original.cloneNode(true);chapter.classList.add("jp-source");
    chapter.querySelector(".chapter-head")?.remove();chapter.querySelector(".done-label")?.remove();
    host.append(chapter);addPlayHandlers(chapter);
  }else{
   const instruction=document.createElement("div");instruction.className="practice-intro";instruction.textContent="اِقْرَأْ، وَاسْتَمِعْ، ثُمَّ قُلْهَا بِنَفْسِكَ.";host.append(instruction);
   const grid=document.createElement("div");grid.className="practice-list";
   for(const ar of arabicExamples(active)){
    const block=document.createElement("div");block.className="practice-item";
    const word=document.createElement("span");word.className="arword";word.lang="ar";word.dir="rtl";word.textContent=ar;word.onclick=()=>sound(ar);
    const btn=document.createElement("button");btn.className="listen";btn.textContent="▶";btn.onclick=()=>sound(ar);
    block.append(btn,word);grid.append(block);
   }
   host.append(grid);
  }

  $("prev").disabled=active===range[0];$("next").disabled=active===range[1];
  if(location.hash!=="#chapter-"+active)history.replaceState(null,"","#chapter-"+active);
 }
 function change(n){if(n<range[0]||n>range[1])return;active=n;render();window.scrollTo({top:0,behavior:"smooth"})}
 $("prev").onclick=()=>change(active-1);$("next").onclick=()=>change(active+1);

 $("search").oninput=renderNav;
 document.querySelectorAll(".controls button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem(K,lang);render()});
 function handleHash(){const m=location.hash.match(/chapter-(\d+)/);if(m){let n=Number(m[1]);if(n>=range[0]&&n<=range[1]&&n!==active){active=n;render()}}}
 addEventListener("hashchange",handleHash);
 Promise.all([fetch("./grammar-en.html").then(r=>{if(!r.ok)throw Error("English grammar unavailable");return r.text()}),fetch("./grammar-ja.html").then(r=>{if(!r.ok)throw Error("Japanese grammar unavailable");return r.text()})])
 .then(([a,b])=>{const parser=new DOMParser();enSections=[...parser.parseFromString(a,"text/html").querySelectorAll(".chapter")];jaSections=[...parser.parseFromString(b,"text/html").querySelectorAll(".chapter")];jaById=new Map(jaSections.map(x=>[x.id,x]));if(enSections.length!==51||jaSections.length!==51||data.length!==51)throw Error("Expected 51 chapters in both books");const missing=data.filter(d=>!jaById.has(d.jaSourceId));if(missing.length)throw Error("Japanese chapter mapping missing: "+missing.map(d=>d.jaSourceId).join(", "));render();})
 .catch(e=>{$("article").textContent="Could not load grammar content: "+e.message});
 labels();
})();
</script><script defer src="../assets/site-navigation.js"></script></body></html>
