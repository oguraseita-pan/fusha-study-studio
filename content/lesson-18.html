<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fuṣḥā speaking week 18: Opinions, Reasons & Future Choices"><title>Lesson 18 — Opinions, Reasons & Future Choices | Fuṣḥā Study Studio</title><link rel="stylesheet" href="../assets/lesson-engine.css"></head><body><div class="top"><a href="../index.html">← Fuṣḥā Study Studio</a><div class="tools"><span class="voice-state" id="voice-state">Tap Arabic text for audio</span><button data-switch="ja" aria-pressed="true">日本語</button><button data-switch="en" aria-pressed="true">English</button><button data-switch="answers" aria-pressed="false">Answers</button><button onclick="window.print()">Print / PDF</button></div></div><main id="content" class="wrap"></main><script>window.LESSON_DATA={"week":18,"title":"Opinions, Reasons & Future Choices","jaTitle":"意見・理由・将来の予定を説明する","arTitle":"الْآرَاءُ وَالْأَسْبَابُ وَالْخُطَطُ","dates":"1 · 3 · 5 March 2027","outcome":"Explain an opinion with a reason, compare alternatives, talk about a plan and respond politely to disagreement.","goals":["Say 'I think...' and support your view / 「私は〜と思う」と理由を述べる","Explain a preference with a comparison / 比較して好みを説明する","Talk about simple future plans and conditions / 今後の予定と条件を説明する","Disagree politely and ask another person's opinion / 丁寧に反論し意見を尋ねる"],"review":[{"en":"Week 13: Compare two options and say why.","ja":"第13週：2つを比較し理由を話す。"},{"en":"Week 14: Invite someone and explain your availability.","ja":"第14週：誰かを誘い、都合を説明する。"},{"en":"Week 17: Talk about a past experience and what you learned.","ja":"第17週：過去の経験と学んだことを説明する。"}],"vocab":[{"ar":"أَعْتَقِدُ","roman":"aʿtaqidu","en":"I believe / think","ja":"私は〜と思う","type":"verb","past":"اِعْتَقَدَ","present":"يَعْتَقِدُ","me":"أَعْتَقِدُ","example":{"ar":"أَعْتَقِدُ أَنَّ الْخُطَّةَ جَيِّدَةٌ.","roman":"","en":"I think the plan is good.","ja":"この計画は良いと思います。"}},{"ar":"أَرَى","roman":"arā","en":"I see / think","ja":"私は見る・考える","type":"verb","past":"رَأَى","present":"يَرَى","me":"أَرَى","example":{"ar":"أَرَى أَنَّ هَذَا خِيَارٌ جَيِّدٌ.","roman":"","en":"I think this is a good choice.","ja":"これは良い選択だと思います。"}},{"ar":"أُفَضِّلُ","roman":"ufaḍḍilu","en":"I prefer","ja":"私は好む","type":"verb","past":"فَضَّلَ","present":"يُفَضِّلُ","me":"أُفَضِّلُ","example":{"ar":"أُفَضِّلُ هَذَا الْخِيَارَ.","roman":"","en":"I prefer this option.","ja":"こちらの選択肢を好みます。"}},{"ar":"أُوَافِقُ","roman":"uwāfiqu","en":"I agree","ja":"私は同意する","type":"verb","past":"وَافَقَ","present":"يُوَافِقُ","me":"أُوَافِقُ","example":{"ar":"أُوَافِقُ عَلَى هَذِهِ الْفِكْرَةِ.","roman":"","en":"I agree with this idea.","ja":"このアイデアに賛成です。"}},{"ar":"أَخْتَارُ","roman":"akhtāru","en":"I choose","ja":"私は選ぶ","type":"verb","past":"اِخْتَارَ","present":"يَخْتَارُ","me":"أَخْتَارُ","example":{"ar":"أَخْتَارُ الْخِطَّةَ الْأُولَى.","roman":"","en":"I choose the first plan.","ja":"最初の計画を選びます。"}},{"ar":"أُحَاوِلُ","roman":"uḥāwilu","en":"I try","ja":"私は試みる","type":"verb","past":"حَاوَلَ","present":"يُحَاوِلُ","me":"أُحَاوِلُ","example":{"ar":"أُحَاوِلُ أَنْ أَتَكَلَّمَ كُلَّ يَوْمٍ.","roman":"","en":"I try to speak every day.","ja":"毎日話すようにしています。"}},{"ar":"أَسْتَطِيعُ","roman":"astaṭīʿu","en":"I can","ja":"私はできる","type":"verb","past":"اِسْتَطَاعَ","present":"يَسْتَطِيعُ","me":"أَسْتَطِيعُ","example":{"ar":"أَسْتَطِيعُ أَنْ أَذْهَبَ غَدًا.","roman":"","en":"I can go tomorrow.","ja":"明日行けます。"}},{"ar":"أُخَطِّطُ","roman":"ukhaṭṭiṭu","en":"I plan","ja":"私は計画する","type":"verb","past":"خَطَّطَ","present":"يُخَطِّطُ","me":"أُخَطِّطُ","example":{"ar":"أُخَطِّطُ لِرِحْلَةٍ جَدِيدَةٍ.","roman":"","en":"I am planning a new trip.","ja":"新しい旅行を計画しています。"}},{"ar":"أَتَوَقَّعُ","roman":"atawaqqaʿu","en":"I expect","ja":"私は予想する","type":"verb","past":"تَوَقَّعَ","present":"يَتَوَقَّعُ","me":"أَتَوَقَّعُ","example":{"ar":"أَتَوَقَّعُ أَنْ أَكُونَ مَشْغُولًا.","roman":"","en":"I expect to be busy.","ja":"忙しくなりそうです。"}},{"ar":"فِكْرَةٌ","roman":"fikratun","en":"idea","ja":"アイデア","type":"noun","gender":"feminine","plural":"أَفْكَارٌ","example":{"ar":"هَذِهِ فِكْرَةٌ مُهِمَّةٌ.","roman":"","en":"This is an important idea.","ja":"重要なアイデアです。"}},{"ar":"رَأْيٌ","roman":"raʾyun","en":"opinion","ja":"意見","type":"noun","gender":"masculine","plural":"آرَاءٌ","example":{"ar":"مَا رَأْيُكَ؟","roman":"","en":"What is your opinion?","ja":"どう思いますか？"}},{"ar":"سَبَبٌ","roman":"sababun","en":"reason","ja":"理由","type":"noun","gender":"masculine","plural":"أَسْبَابٌ","example":{"ar":"مَا السَّبَبُ؟","roman":"","en":"What's the reason?","ja":"理由は何ですか？"}},{"ar":"مُسْتَقْبَلٌ","roman":"mustaqbalun","en":"future","ja":"将来","type":"noun","gender":"masculine","plural":"—","example":{"ar":"أُفَكِّرُ فِي الْمُسْتَقْبَلِ.","roman":"","en":"I'm thinking about the future.","ja":"将来について考えています。"}},{"ar":"خُطَّةٌ","roman":"khuṭṭatun","en":"plan","ja":"計画","type":"noun","gender":"feminine","plural":"خُطَطٌ","example":{"ar":"عِنْدِي خُطَّةٌ جَدِيدَةٌ.","roman":"","en":"I have a new plan.","ja":"新しい計画があります。"}},{"ar":"وَقْتٌ","roman":"waqtun","en":"time","ja":"時間","type":"noun","gender":"masculine","plural":"أَوْقَاتٌ","example":{"ar":"أَحْتَاجُ إِلَى وَقْتٍ أَكْثَرَ.","roman":"","en":"I need more time.","ja":"もっと時間が必要です。"}},{"ar":"فُرْصَةٌ","roman":"furṣatun","en":"opportunity","ja":"機会","type":"noun","gender":"feminine","plural":"فُرَصٌ","example":{"ar":"هَذِهِ فُرْصَةٌ جَيِّدَةٌ.","roman":"","en":"This is a good opportunity.","ja":"良い機会です。"}},{"ar":"خِيَارٌ","roman":"khiyārun","en":"option","ja":"選択肢","type":"noun","gender":"masculine","plural":"خِيَارَاتٌ","example":{"ar":"هُنَاكَ خِيَارَانِ.","roman":"","en":"There are two options.","ja":"選択肢が2つあります。"}},{"ar":"مَشْرُوعٌ","roman":"mashrūʿun","en":"project","ja":"プロジェクト","type":"noun","gender":"masculine","plural":"مَشَارِيعُ","example":{"ar":"هَذَا مَشْرُوعٌ جَدِيدٌ.","roman":"","en":"This is a new project.","ja":"これは新しい事業です。"}},{"ar":"مُهِمٌّ","roman":"muhimmun","en":"important (m.)","ja":"重要な","type":"adj","fem":"مُهِمَّةٌ","example":{"ar":"الْوَقْتُ مُهِمٌّ.","roman":"","en":"Time is important.","ja":"時間は重要です。"}},{"ar":"صَعْبٌ","roman":"ṣaʿbun","en":"difficult (m.)","ja":"難しい","type":"adj","fem":"صَعْبَةٌ","example":{"ar":"هَذَا الْعَمَلُ صَعْبٌ.","roman":"","en":"This work is difficult.","ja":"この仕事は難しいです。"}},{"ar":"سَهْلٌ","roman":"sahlun","en":"easy (m.)","ja":"簡単な","type":"adj","fem":"سَهْلَةٌ","example":{"ar":"هَذَا السُّؤَالُ سَهْلٌ.","roman":"","en":"This question is easy.","ja":"この質問は簡単です。"}},{"ar":"لِأَنَّ","roman":"liʾanna","en":"because","ja":"なぜなら","type":"expression","example":{"ar":"أَتَعَلَّمُ لِأَنَّ اللُّغَةَ مُهِمَّةٌ.","roman":"","en":"I learn because the language is important.","ja":"言語が重要なので勉強します。"}},{"ar":"لَكِنْ","roman":"lākin","en":"but","ja":"しかし","type":"expression","example":{"ar":"أُرِيدُ الذَّهَابَ، لَكِنْ أَنَا مَشْغُولٌ.","roman":"","en":"I want to go, but I'm busy.","ja":"行きたいですが忙しいです。"}},{"ar":"إِذَا","roman":"idhā","en":"if / when","ja":"もし・〜したら","type":"expression","example":{"ar":"إِذَا كَانَ عِنْدِي وَقْتٌ، سَأَذْهَبُ.","roman":"","en":"If I have time, I'll go.","ja":"時間があれば行きます。"}}],"grammar":[{"title":"Express an opinion with أَعْتَقِدُ أَنَّ","en":"أَعْتَقِدُ أَنَّ means 'I think that'. In careful Fuṣḥā the noun following أَنَّ is accusative. Start by learning simple whole sentences.","ja":"「私は〜と思います」は أَعْتَقِدُ أَنَّ。後ろの名詞は文法上対格になるので、短い例文ごと覚えましょう。","example":{"ar":"أَعْتَقِدُ أَنَّ هَذِهِ الْخُطَّةَ جَيِّدَةٌ.","roman":"aʿtaqidu anna hādhihi al-khuṭṭata jayyidatun","en":"I think this plan is good.","ja":"この計画は良いと思います。"},"drill":"Teacher offers a weekend plan; learner gives an opinion plus one reason."},{"title":"Give reasons and contrast","en":"Use لِأَنَّ because and لَكِنْ but. With لِأَنَّ attached pronouns are common: لِأَنَّهُ because it/he...; لِأَنَّهَا because it/she... .","ja":"理由は لِأَنَّ、対比は لَكِنْ。物の性に合わせて لِأَنَّهُ（男性名詞）と لِأَنَّهَا（女性名詞）も使います。","example":{"ar":"أُفَضِّلُ هَذَا لِأَنَّهُ أَسْهَلُ، وَلَكِنَّهُ أَغْلَى.","roman":"ufaḍḍilu hādhā liʾannahu ashalu wa-lākinnahu aghlā","en":"I prefer this because it's easier, but more expensive.","ja":"簡単なのでこちらが好きですが、高価です。"},"drill":"Ask learner to choose between two options and give two contrasting features."},{"title":"Future planning with سَـ and أَنْ","en":"For a future intention, use سَـ + imperfect (سَأَذْهَبُ). After أَنْ, a following imperfect normally changes ending in fully inflected Fuṣḥā: أُرِيدُ أَنْ أَذْهَبَ.","ja":"「〜する予定」は سَـ＋未完了形。「〜したい」は أُرِيدُ أَنْ＋未完了形（接続法の語尾）です。","example":{"ar":"أُرِيدُ أَنْ أَتَعَلَّمَ، وَسَأَدْرُسُ غَدًا.","roman":"urīdu an ataʿallama wa-sa-adrusu ghadan","en":"I want to learn, and I will study tomorrow.","ja":"学びたいので明日勉強します。"},"drill":"Teacher asks what learner wants to do and what they will actually do tomorrow."},{"title":"Simple conditional with إِذَا","en":"Use إِذَا + a completed-form verb or common phrase for a condition, followed by a future main clause. A practical starter: إِذَا كَانَ عِنْدِي وَقْتٌ، سَأَذْهَبُ.","ja":"「時間があれば行く」のような条件を إِذَا で表せます。細かい条件文の活用より、まず定型構造で会話練習をします。","example":{"ar":"إِذَا كَانَ عِنْدِي وَقْتٌ، سَأَزُورُ صَدِيقِي.","roman":"idhā kāna ʿindī waqtun sa-azūru ṣadīqī","en":"If I have time, I'll visit my friend.","ja":"時間があれば友人を訪ねます。"},"drill":"Teacher changes condition to price, weather or work; learner supplies a suitable action."}],"phrases":[{"ar":"مَا رَأْيُكَ فِي هَذَا؟","roman":"mā raʾyuka fī hādhā?","en":"What do you think about this?","ja":"これについてどう思いますか？"},{"ar":"أَعْتَقِدُ أَنَّ هَذِهِ فِكْرَةٌ جَيِّدَةٌ.","roman":"aʿtaqidu anna hādhihi fikratun jayyidatun","en":"I think this is a good idea.","ja":"良いアイデアだと思います。"},{"ar":"أُوَافِقُكَ عَلَى هَذَا.","roman":"uwāfiquka ʿalā hādhā","en":"I agree with you on this (to a man).","ja":"これには賛成です。"},{"ar":"لَا أُوَافِقُ، لِأَنَّ ...","roman":"lā uwāfiqu liʾanna ...","en":"I disagree, because...","ja":"反対です。なぜなら……"},{"ar":"لِمَاذَا تَعْتَقِدُ ذَلِكَ؟","roman":"limādhā taʿtaqidu dhālika?","en":"Why do you think that?","ja":"なぜそう思いますか？"},{"ar":"أُفَضِّلُ هَذَا الْخِيَارَ.","roman":"ufaḍḍilu hādhā al-khiyāra","en":"I prefer this option.","ja":"こちらの選択肢が好きです。"},{"ar":"هَذَا أَسْهَلُ، وَلَكِنَّهُ أَغْلَى.","roman":"hādhā ashalu wa-lākinnahu aghlā","en":"This is easier, but more expensive.","ja":"こちらは簡単ですが高いです。"},{"ar":"أَحْتَاجُ إِلَى وَقْتٍ أَكْثَرَ.","roman":"aḥtāju ilā waqtin akthara","en":"I need more time.","ja":"もっと時間が必要です。"},{"ar":"مَا خُطَّتُكَ لِلْأُسْبُوعِ الْقَادِمِ؟","roman":"mā khuṭṭatuka lil-usbūʿi al-qādimi","en":"What's your plan for next week?","ja":"来週の予定は何ですか？"},{"ar":"أُخَطِّطُ لِرِحْلَةٍ جَدِيدَةٍ.","roman":"ukhaṭṭiṭu li-riḥlatin jadīdatin","en":"I'm planning a new trip.","ja":"新しい旅行を計画しています。"},{"ar":"إِذَا كَانَ عِنْدِي وَقْتٌ، سَأَذْهَبُ.","roman":"idhā kāna ʿindī waqtun sa-adhhabu","en":"If I have time, I'll go.","ja":"時間があれば行きます。"},{"ar":"هَلْ عِنْدَكَ خِيَارٌ آخَرُ؟","roman":"hal ʿindaka khiyārun ākharu","en":"Do you have another option?","ja":"他の選択肢はありますか？"}],"dialogues":[{"title":"Plan the weekend","turns":[{"role":"A","ar":"مَا خُطَّتُكَ لِلْأُسْبُوعِ الْقَادِمِ؟","en":"What are your plans for next week?","ja":"来週の予定は何ですか？"},{"role":"B","ar":"أُخَطِّطُ لِرِحْلَةٍ قَصِيرَةٍ.","en":"I'm planning a short trip.","ja":"短い旅行を計画しています。"},{"role":"A","ar":"مَا رَأْيُكَ فِي الذَّهَابِ إِلَى مَسْقَطَ؟","en":"What about going to Muscat?","ja":"マスカットへ行くのはどうですか？"},{"role":"B","ar":"فِكْرَةٌ جَيِّدَةٌ، وَلَكِنَّ الْوَقْتَ قَصِيرٌ.","en":"Good idea, but time is short.","ja":"良いですが、時間が短いです。"},{"role":"A","ar":"هَلْ تُفَضِّلُ الْبَقَاءَ فِي دُبَيّ؟","en":"Do you prefer to stay in Dubai?","ja":"ドバイにいる方がいいですか？"},{"role":"B","ar":"نَعَمْ، إِذَا كَانَ عِنْدِي وَقْتٌ، سَأَزُورُ صَدِيقِي.","en":"Yes, if I have time, I'll visit my friend.","ja":"はい、時間があれば友人に会います。"}],"twist":"Teacher proposes a cheaper destination; student compares cost and travel time."},{"title":"Discuss learning Arabic","turns":[{"role":"A","ar":"لِمَاذَا تَتَعَلَّمُ الْعَرَبِيَّةَ؟","en":"Why are you learning Arabic?","ja":"なぜアラビア語を勉強していますか？"},{"role":"B","ar":"لِأَنَّنِي أَعْمَلُ فِي الشَّرْقِ الْأَوْسَطِ.","en":"Because I work in the Middle East.","ja":"中東で働いているからです。"},{"role":"A","ar":"هَلْ هِيَ لُغَةٌ صَعْبَةٌ؟","en":"Is it a difficult language?","ja":"難しい言語ですか？"},{"role":"B","ar":"نَعَمْ، وَلَكِنَّنِي أُحَاوِلُ أَنْ أَتَكَلَّمَ كُلَّ يَوْمٍ.","en":"Yes, but I try to speak every day.","ja":"はい。でも毎日話すようにしています。"},{"role":"A","ar":"مَا أَهَمُّ شَيْءٍ لَدَيْكَ؟","en":"What's the most important thing for you?","ja":"一番大事なことは何ですか？"},{"role":"B","ar":"أَعْتَقِدُ أَنَّ الْمُمَارَسَةَ مُهِمَّةٌ.","en":"I think practice is important.","ja":"練習が大切だと思います。"}],"twist":"Teacher disagrees that speaking is most important; learner defends the opinion politely."},{"title":"Choose a business idea","turns":[{"role":"A","ar":"عِنْدَنَا فِكْرَتَانِ لِمَشْرُوعٍ جَدِيدٍ.","en":"We have two ideas for a new project.","ja":"新規事業のアイデアが2つあります。"},{"role":"B","ar":"أَيُّهُمَا أَفْضَلُ؟","en":"Which is better?","ja":"どちらが良いですか？"},{"role":"A","ar":"أَعْتَقِدُ أَنَّ الْفِكْرَةَ الْأُولَى أَسْهَلُ.","en":"I think the first idea is easier.","ja":"最初の案の方が簡単だと思います。"},{"role":"B","ar":"لَكِنَّ الْفِكْرَةَ الثَّانِيَةَ لَهَا فُرْصَةٌ أَكْبَرُ.","en":"But the second has a bigger opportunity.","ja":"でも、2つ目の方が可能性は大きいです。"},{"role":"A","ar":"صَحِيحٌ. نَحْتَاجُ إِلَى وَقْتٍ لِلدِّرَاسَةِ.","en":"True. We need time to study it.","ja":"そうですね。調査する時間が必要です。"},{"role":"B","ar":"إِذَا حَصَلْنَا عَلَى مَعْلُومَاتٍ أَكْثَرَ، سَنَقْرِّرُ.","en":"If we get more information, we'll decide.","ja":"情報が増えたら決めましょう。"}],"twist":"Teacher adds a cost constraint; student recommends the next research step."}],"classes":[{"day":"Mon 1 Mar 2027","name":"BUILD · Give a simple opinion","goal":"State a position, a reason and a question.","missions":[{"en":"Say what you think about learning Arabic and why.","ja":"アラビア語学習について意見と理由を話す。"},{"en":"Ask the teacher's opinion and respond politely.","ja":"講師の意見を聞き、丁寧に返答する。"},{"en":"Make three opinions using أَعْتَقِدُ أَنَّ.","ja":"私は〜と思うを3つ使う。"}],"questions":[{"ar":"مَا رَأْيُكَ فِي هَذَا؟","en":"What do you think?","ja":"どう思いますか？"},{"ar":"لِمَاذَا تَعْتَقِدُ ذَلِكَ؟","en":"Why do you think that?","ja":"なぜそう思いますか？"},{"ar":"هَلْ تُوَافِقُ؟","en":"Do you agree?","ja":"賛成ですか？"}],"teacher":"Do not turn the task into a debate about facts; focus on reasons and clear structure.","exit":"60 sec: one opinion, two reasons and one follow-up question."},{"day":"Wed 3 Mar 2027","name":"USE · Compare plans","goal":"Discuss two weekend or learning plans with constraints.","missions":[{"en":"Compare two plans: cheap but far, expensive but near.","ja":"安いが遠い案と高いが近い案を比較する。"},{"en":"Teacher disagrees; give a second reason.","ja":"講師に反対されたら別の理由を示す。"},{"en":"Make a decision conditional on time or price.","ja":"時間や価格を条件に決定する。"}],"questions":[{"ar":"أَيُّهُمَا أَفْضَلُ؟","en":"Which is better?","ja":"どちらが良いですか？"},{"ar":"هَلْ عِنْدَكَ وَقْتٌ؟","en":"Do you have time?","ja":"時間はありますか？"},{"ar":"مَاذَا سَتَفْعَلُ إِذَا كَانَ عِنْدَكَ وَقْتٌ؟","en":"What will you do if you have time?","ja":"時間があれば何をしますか？"}],"teacher":"Offer a third option late in the task; learner must compare rather than start over.","exit":"2 min: compare options, ask one question, agree on a plan."},{"day":"Fri 5 Mar 2027","name":"TRANSFER · Explain a future decision","goal":"Connect opinion, prior experience and a future plan.","missions":[{"en":"Explain a previous experience that changed your opinion.","ja":"意見が変わった過去の経験を話す。"},{"en":"Discuss a business idea and an alternative.","ja":"新規事業のアイデアと代替案を比較する。"},{"en":"Explain what you will do next if a condition is met.","ja":"条件が満たされた場合の次の行動を言う。"}],"questions":[{"ar":"مَا الَّذِي تَعَلَّمْتَهُ؟","en":"What did you learn?","ja":"何を学びましたか？"},{"ar":"مَاذَا تَتَوَقَّعُ؟","en":"What do you expect?","ja":"どう予想しますか？"},{"ar":"مَاذَا سَتَفْعَلُ بَعْدَ ذَلِكَ؟","en":"What will you do next?","ja":"その後どうしますか？"}],"teacher":"Ask unexpected questions in simple Fuṣḥā; allow paraphrase when vocabulary is missing.","exit":"2 min: opinion, supporting reason, comparison and future step."}],"test":[{"en":"Say: I think this plan is good.","ja":"この計画は良いと思います。","answer":{"ar":"أَعْتَقِدُ أَنَّ هَذِهِ الْخُطَّةَ جَيِّدَةٌ.","roman":"aʿtaqidu anna hādhihi al-khuṭṭata jayyidatun","en":"Model answer","ja":"回答例"}},{"en":"Ask: What do you think about this?","ja":"これについてどう思いますか？","answer":{"ar":"مَا رَأْيُكَ فِي هَذَا؟","roman":"mā raʾyuka fī hādhā","en":"Model answer","ja":"回答例"}},{"en":"Say: I prefer this option.","ja":"こちらの選択肢が好きです。","answer":{"ar":"أُفَضِّلُ هَذَا الْخِيَارَ.","roman":"ufaḍḍilu hādhā al-khiyāra","en":"Model answer","ja":"回答例"}},{"en":"Say: I need more time.","ja":"もっと時間が必要です。","answer":{"ar":"أَحْتَاجُ إِلَى وَقْتٍ أَكْثَرَ.","roman":"aḥtāju ilā waqtin akthara","en":"Model answer","ja":"回答例"}},{"en":"Say: If I have time, I'll go.","ja":"時間があれば行きます。","answer":{"ar":"إِذَا كَانَ عِنْدِي وَقْتٌ، سَأَذْهَبُ.","roman":"idhā kāna ʿindī waqtun sa-adhhabu","en":"Model answer","ja":"回答例"}},{"en":"Say: I try to speak every day.","ja":"毎日話すようにしています。","answer":{"ar":"أُحَاوِلُ أَنْ أَتَكَلَّمَ كُلَّ يَوْمٍ.","roman":"uḥāwilu an atakallama kulla yawmin","en":"Model answer","ja":"回答例"}},{"en":"Ask: Why do you think that?","ja":"なぜそう思いますか？","answer":{"ar":"لِمَاذَا تَعْتَقِدُ ذَلِكَ؟","roman":"limādhā taʿtaqidu dhālika","en":"Model answer","ja":"回答例"}}],"checks":["I give an opinion and at least two reasons / 意見と理由2つを述べる","I compare two alternatives / 2案を比較できる","I use a simple if-clause / 簡単な条件文を使える","I ask for the teacher's opinion / 相手の意見を尋ねる","I speak without translating every word / 一語ずつ訳さず話せる"],"speaking":{"fusha":"For clear Fuṣḥā, أَعْتَقِدُ أَنَّ and لِأَنَّ trigger specific grammatical forms. Learn a few reliable chunks rather than stopping mid-speech to compute endings. You can refine the full case rules in later study.","real":"In spontaneous Syrian or Gulf conversation, speakers may phrase opinions and conditions differently. Ask your teacher for a dialect example, but maintain the Fuṣḥā model and prioritise understandable reasons and questions."}};</script><script src="../assets/lesson-engine.js"></script></body></html>
