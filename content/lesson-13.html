<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103741"><meta name="description" content="Modern Standard Arabic speaking lesson 13 with Japanese and English explanations."><title>Lesson 13 | Fuṣḥā Study Studio</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"><link rel="stylesheet" href="../assets/lesson-v3.css"><link rel="stylesheet" href="../assets/site-navigation.css"></head><body><main id="content" aria-label="Arabic learning lesson"></main><script>window.LESSON_DATA={"week":13,"title":"Preferences, Comparisons & Reasons","jaTitle":"好み・比較・理由を伝える","arTitle":"التَّفْضِيلُ وَالْمُقَارَنَةُ وَالْأَسْبَابُ","outcome":"State what you like and prefer; compare prices, places and products; give simple reasons and ask follow-up questions.","goals":["Explain preferences about food and daily life / 食べ物や日常の好みを説明する","Compare two products or choices / 2つの商品を比較する","Give a short reason with because / 理由を述べる","Ask another person which option they prefer / 相手の好みを尋ねる"],"review":[{"en":"Lesson 3: Ask for a product's price and select a colour.","ja":"第3課：商品の価格を尋ね、色を選ぶ。"},{"en":"Lesson 9: Describe a product to a customer.","ja":"第9課：顧客に製品を説明する。"},{"en":"Lesson 12: Use one present-tense verb and one question without notes.","ja":"第12課：現在形と疑問文を資料なしで話す。"}],"vocab":[{"ar":"أُحِبُّ","roman":"uḥibbu","en":"I like / love","ja":"私は好き","type":"verb","past":"أَحَبَّ","present":"يُحِبُّ","me":"أُحِبُّ","example":{"ar":"أُحِبُّ الْقَهْوَةَ.","roman":"","en":"I like coffee.","ja":"コーヒーが好きです。"}},{"ar":"أُفَضِّلُ","roman":"ufaḍḍilu","en":"I prefer","ja":"私は〜を好む","type":"verb","past":"فَضَّلَ","present":"يُفَضِّلُ","me":"أُفَضِّلُ","example":{"ar":"أُفَضِّلُ الشَّايَ.","roman":"","en":"I prefer tea.","ja":"紅茶のほうが好きです。"}},{"ar":"أَخْتَارُ","roman":"akhtāru","en":"I choose","ja":"私は選ぶ","type":"verb","past":"اِخْتَارَ","present":"يَخْتَارُ","me":"أَخْتَارُ","example":{"ar":"أَخْتَارُ هَذَا اللَّوْنَ.","roman":"","en":"I choose this colour.","ja":"この色を選びます。"}},{"ar":"أُقَارِنُ","roman":"uqārinu","en":"I compare","ja":"私は比較する","type":"verb","past":"قَارَنَ","present":"يُقَارِنُ","me":"أُقَارِنُ","example":{"ar":"أُقَارِنُ بَيْنَ السِّعْرَيْنِ.","roman":"","en":"I compare the two prices.","ja":"2つの価格を比較します。"}},{"ar":"أُرِيدُ","roman":"urīdu","en":"I want","ja":"私は欲しい","type":"verb","past":"أَرَادَ","present":"يُرِيدُ","me":"أُرِيدُ","example":{"ar":"أُرِيدُ خِيَارًا آخَرَ.","roman":"","en":"I want another option.","ja":"別の選択肢が欲しいです。"}},{"ar":"أَشْتَرِي","roman":"ashtarī","en":"I buy","ja":"私は買う","type":"verb","past":"اِشْتَرَى","present":"يَشْتَرِي","me":"أَشْتَرِي","example":{"ar":"أَشْتَرِي هَذَا الْمُنْتَجَ.","roman":"","en":"I buy this product.","ja":"この製品を買います。"}},{"ar":"أَسْتَخْدِمُ","roman":"astakhdimu","en":"I use","ja":"私は使う","type":"verb","past":"اِسْتَخْدَمَ","present":"يَسْتَخْدِمُ","me":"أَسْتَخْدِمُ","example":{"ar":"أَسْتَخْدِمُ هَذَا الْقَلَمَ.","roman":"","en":"I use this pen.","ja":"このペンを使います。"}},{"ar":"أَجِدُ","roman":"ajidu","en":"I find","ja":"私は見つける","type":"verb","past":"وَجَدَ","present":"يَجِدُ","me":"أَجِدُ","example":{"ar":"أَجِدُ هَذَا الْمَكَانَ هَادِئًا.","roman":"","en":"I find this place quiet.","ja":"この場所は静かだと思います。"}},{"ar":"خِيَارٌ","roman":"khiyārun","en":"option / choice","ja":"選択肢","type":"noun","gender":"masculine","plural":"خِيَارَاتٌ","example":{"ar":"هَذَا خِيَارٌ جَيِّدٌ.","roman":"","en":"This is a good option.","ja":"これは良い選択肢です。"}},{"ar":"سَبَبٌ","roman":"sababun","en":"reason","ja":"理由","type":"noun","gender":"masculine","plural":"أَسْبَابٌ","example":{"ar":"مَا السَّبَبُ؟","roman":"","en":"What is the reason?","ja":"理由は何ですか？"}},{"ar":"سِعْرٌ","roman":"siʿrun","en":"price","ja":"価格","type":"noun","gender":"masculine","plural":"أَسْعَارٌ","example":{"ar":"السِّعْرُ مُنَاسِبٌ.","roman":"","en":"The price is reasonable.","ja":"値段は手ごろです。"}},{"ar":"جَوْدَةٌ","roman":"jawdatun","en":"quality","ja":"品質","type":"noun","gender":"feminine","plural":"—","example":{"ar":"جَوْدَةُ هَذَا الْمُنْتَجِ جَيِّدَةٌ.","roman":"","en":"This product's quality is good.","ja":"この製品の品質は良いです。"}},{"ar":"لَوْنٌ","roman":"lawnun","en":"colour","ja":"色","type":"noun","gender":"masculine","plural":"أَلْوَانٌ","example":{"ar":"أُحِبُّ هَذَا اللَّوْنَ.","roman":"","en":"I like this colour.","ja":"この色が好きです。"}},{"ar":"حَجْمٌ","roman":"ḥajmun","en":"size / volume","ja":"大きさ","type":"noun","gender":"masculine","plural":"أَحْجَامٌ","example":{"ar":"هَذَا الْحَجْمُ مُنَاسِبٌ.","roman":"","en":"This size is suitable.","ja":"このサイズがちょうどよいです。"}},{"ar":"وَقْتٌ","roman":"waqtun","en":"time","ja":"時間","type":"noun","gender":"masculine","plural":"أَوْقَاتٌ","example":{"ar":"لَيْسَ عِنْدِي وَقْتٌ كَافٍ.","roman":"","en":"I don't have enough time.","ja":"時間が十分にありません。"}},{"ar":"مَكَانٌ","roman":"makānun","en":"place","ja":"場所","type":"noun","gender":"masculine","plural":"أَمَاكِنُ","example":{"ar":"هَذَا مَكَانٌ هَادِئٌ.","roman":"","en":"This is a quiet place.","ja":"静かな場所です。"}},{"ar":"مَطْعَمٌ","roman":"maṭʿamun","en":"restaurant","ja":"レストラン","type":"noun","gender":"masculine","plural":"مَطَاعِمُ","example":{"ar":"أُفَضِّلُ هَذَا الْمَطْعَمَ.","roman":"","en":"I prefer this restaurant.","ja":"こちらのレストランの方が好きです。"}},{"ar":"قَهْوَةٌ","roman":"qahwatun","en":"coffee","ja":"コーヒー","type":"noun","gender":"feminine","plural":"—","example":{"ar":"الْقَهْوَةُ لَذِيذَةٌ.","roman":"","en":"The coffee is tasty.","ja":"コーヒーはおいしいです。"}},{"ar":"شَايٌ","roman":"shāyun","en":"tea","ja":"紅茶・お茶","type":"noun","gender":"masculine","plural":"—","example":{"ar":"أُفَضِّلُ الشَّايَ صَبَاحًا.","roman":"","en":"I prefer tea in the morning.","ja":"朝はお茶が好きです。"}},{"ar":"أَفْضَلُ","roman":"afḍalu","en":"better / best","ja":"より良い","type":"expression","example":{"ar":"هَذَا أَفْضَلُ مِنْ ذَلِكَ.","roman":"","en":"This is better than that.","ja":"これはあれより良いです。"}},{"ar":"أَرْخَصُ","roman":"arkhaṣu","en":"cheaper","ja":"より安い","type":"expression","example":{"ar":"هَذَا أَرْخَصُ مِنْ ذَلِكَ.","roman":"","en":"This is cheaper than that.","ja":"これはあれより安いです。"}},{"ar":"أَكْبَرُ","roman":"akbaru","en":"bigger","ja":"より大きい","type":"expression","example":{"ar":"هَذَا أَكْبَرُ مِنْ ذَلِكَ.","roman":"","en":"This is bigger than that.","ja":"こちらの方が大きいです。"}},{"ar":"لَذِيذٌ","roman":"ladhīdhun","en":"delicious (m.)","ja":"おいしい（男性形）","type":"adj","fem":"لَذِيذَةٌ","example":{"ar":"هَذَا الطَّعَامُ لَذِيذٌ.","roman":"","en":"This food is tasty.","ja":"この食べ物はおいしいです。"}},{"ar":"هَادِئٌ","roman":"hādiʾun","en":"quiet (m.)","ja":"静かな（男性形）","type":"adj","fem":"هَادِئَةٌ","example":{"ar":"هَذَا الْمَكَانُ هَادِئٌ.","roman":"","en":"This place is quiet.","ja":"この場所は静かです。"}}],"grammar":[{"title":"How to say 'prefer'","en":"أُفَضِّلُ means I prefer. Use it directly before what you prefer. To compare two choices, use أُفَضِّلُ ... عَلَى ... .","ja":"好みは أُفَضِّلُ＋名詞で表せます。比較するときは「AをBより好む」に عَلَى を使います。","example":{"ar":"أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.","roman":"ufaḍḍilu ash-shāya ʿalā al-qahwati","en":"I prefer tea to coffee.","ja":"コーヒーよりお茶が好きです。"},"drill":"Swap tea and coffee; then compare two cities."},{"title":"Comparatives with مِنْ","en":"Use أَفْضَلُ مِنْ (better than), أَرْخَصُ مِنْ (cheaper than), and أَكْبَرُ مِنْ (bigger than). These comparison forms do not take the ordinary feminine adjective ending.","ja":"「より良い」「より安い」「より大きい」は أَفْضَلُ / أَرْخَصُ / أَكْبَرُ＋مِنْ で表します。通常の形容詞の女性形とは違う点に注意。","example":{"ar":"هَذَا أَرْخَصُ مِنْ ذَلِكَ.","roman":"hādhā arkhaṣu min dhālika","en":"This is cheaper than that.","ja":"これはあれより安いです。"},"drill":"Use two product cards; student compares price and size."},{"title":"Give a reason with لِأَنَّ","en":"لِأَنَّ means 'because'. After it, a noun or attached pronoun follows. Keep the reason short and connected to an opinion.","ja":"理由を表す لِأَنَّ（なぜなら）を使います。文法上は後続の名詞が対格になるため、まず定型文で身につけましょう。","example":{"ar":"أُفَضِّلُ هَذَا لِأَنَّهُ أَرْخَصُ.","roman":"ufaḍḍilu hādhā liʾannahu arkhaṣu","en":"I prefer this because it is cheaper.","ja":"こちらの方が安いので好きです。"},"drill":"Ask 'Why?' after every preference. Student gives one reason."},{"title":"Agree and disagree politely","en":"Use أُوَافِقُكَ (I agree with you, to a man), but if you prefer a different option, start with لَكِنْ (but).","ja":"同意するときは أُوَافِقُكَ、別の意見を伝えるときは لَكِنْ（しかし）でつなげます。","example":{"ar":"أُوَافِقُكَ، وَلَكِنْ أُفَضِّلُ هَذَا.","roman":"uwāfiquka wa-lākin ufaḍḍilu hādhā","en":"I agree, but I prefer this one.","ja":"賛成ですが、こちらを選びます。"},"drill":"Teacher likes one option; learner politely disagrees and explains why."}],"phrases":[{"ar":"مَاذَا تُفَضِّلُ؟","roman":"mādhā tufaḍḍilu?","en":"What do you prefer? (to a man)","ja":"何が好きですか？"},{"ar":"أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.","roman":"ufaḍḍilu ash-shāya ʿalā al-qahwati","en":"I prefer tea to coffee.","ja":"コーヒーよりお茶が好きです。"},{"ar":"أَيُّهُمَا أَفْضَلُ؟","roman":"ayyuhumā afḍalu?","en":"Which of the two is better?","ja":"どちらが良いですか？"},{"ar":"هَذَا أَرْخَصُ مِنْ ذَلِكَ.","roman":"hādhā arkhaṣu min dhālika","en":"This is cheaper than that.","ja":"こちらはあちらより安いです。"},{"ar":"هَذَا أَكْبَرُ مِنْ ذَلِكَ.","roman":"hādhā akbaru min dhālika","en":"This is bigger than that.","ja":"こちらの方が大きいです。"},{"ar":"أُفَضِّلُ هَذَا لِأَنَّهُ أَفْضَلُ.","roman":"ufaḍḍilu hādhā liʾannahu afḍalu","en":"I prefer this because it is better.","ja":"こちらの方が良いので好きです。"},{"ar":"هَذَا السِّعْرُ مُنَاسِبٌ.","roman":"hādhā as-siʿru munāsibun","en":"This price is reasonable.","ja":"この価格は妥当です。"},{"ar":"مَا السَّبَبُ؟","roman":"mā as-sababu?","en":"What is the reason?","ja":"理由は何ですか？"},{"ar":"أُحِبُّ هَذَا اللَّوْنَ.","roman":"uḥibbu hādhā al-lawna","en":"I like this colour.","ja":"この色が好きです。"},{"ar":"أُرِيدُ خِيَارًا آخَرَ.","roman":"urīdu khiyāran ākhara","en":"I want another option.","ja":"別の選択肢が欲しいです。"},{"ar":"أُوَافِقُكَ، وَلَكِنْ ...","roman":"uwāfiquka wa-lākin ...","en":"I agree with you, but... (to a man)","ja":"賛成ですが……"},{"ar":"مَا رَأْيُكَ فِي هَذَا؟","roman":"mā raʾyuka fī hādhā?","en":"What do you think of this? (to a man)","ja":"これについてどう思いますか？"}],"dialogues":[{"title":"Choose a café","turns":[{"role":"A","ar":"أَيُّ مَطْعَمٍ تُفَضِّلُ؟","en":"Which restaurant do you prefer?","ja":"どちらのレストランが好きですか？"},{"role":"B","ar":"أُفَضِّلُ هَذَا الْمَطْعَمَ.","en":"I prefer this restaurant.","ja":"こちらのお店が好きです。"},{"role":"A","ar":"لِمَاذَا؟","en":"Why?","ja":"なぜですか？"},{"role":"B","ar":"لِأَنَّهُ هَادِئٌ وَالطَّعَامُ فِيهِ لَذِيذٌ.","en":"Because it's quiet and the food there is good.","ja":"静かで料理がおいしいからです。"},{"role":"A","ar":"وَلَكِنَّ الْمَطْعَمَ الْآخَرَ أَرْخَصُ.","en":"But the other restaurant is cheaper.","ja":"でも、もう一方の店は安いですよ。"},{"role":"B","ar":"صَحِيحٌ، وَلَكِنْ أُفَضِّلُ هَذَا.","en":"True, but I prefer this one.","ja":"そうですね。でもこちらを選びます。"}],"twist":"Teacher changes the restaurant to a café or shop and introduces a second reason."},{"title":"Compare two products","turns":[{"role":"A","ar":"مَا رَأْيُكَ فِي هَذَا الْمُنْتَجِ؟","en":"What do you think of this product?","ja":"この製品をどう思いますか？"},{"role":"B","ar":"جَوْدَتُهُ جَيِّدَةٌ، وَلَكِنْ سِعْرُهُ مُرْتَفِعٌ.","en":"Its quality is good, but its price is high.","ja":"品質は良いですが価格が高いです。"},{"role":"A","ar":"وَهَذَا؟","en":"And this one?","ja":"こちらは？"},{"role":"B","ar":"هَذَا أَرْخَصُ، وَلَكِنَّهُ أَصْغَرُ.","en":"This is cheaper, but smaller.","ja":"こちらは安いですが小さいです。"},{"role":"A","ar":"أَيُّهُمَا تُفَضِّلُ؟","en":"Which do you prefer?","ja":"どちらを選びますか？"},{"role":"B","ar":"أُفَضِّلُ الْأَوَّلَ لِأَنَّ جَوْدَتَهُ أَفْضَلُ.","en":"I prefer the first because its quality is better.","ja":"品質が良いので最初の方を選びます。"}],"twist":"One product is cheaper but delivery takes longer. Student asks about delivery and gives a reason."},{"title":"Daily-life choices","turns":[{"role":"A","ar":"هَلْ تُفَضِّلُ الْقَهْوَةَ أَمِ الشَّايَ؟","en":"Do you prefer coffee or tea?","ja":"コーヒーとお茶、どちらが好きですか？"},{"role":"B","ar":"أُفَضِّلُ الْقَهْوَةَ فِي الصَّبَاحِ.","en":"I prefer coffee in the morning.","ja":"朝はコーヒーが好きです。"},{"role":"A","ar":"وَمَاذَا تُفَضِّلُ فِي الْمَسَاءِ؟","en":"What do you prefer in the evening?","ja":"夕方は何が好きですか？"},{"role":"B","ar":"أُفَضِّلُ الشَّايَ.","en":"I prefer tea.","ja":"お茶を選びます。"},{"role":"A","ar":"هَلْ تُحِبُّ الْأَمَاكِنَ الْهَادِئَةَ؟","en":"Do you like quiet places?","ja":"静かな場所は好きですか？"},{"role":"B","ar":"نَعَمْ، لِأَنَّنِي أَسْتَطِيعُ أَنْ أَقْرَأَ هُنَاكَ.","en":"Yes, because I can read there.","ja":"はい、そこで読書できるからです。"}],"twist":"Ask follow-up questions about weekend plans and favourite places, then swap roles."}],"classes":[{"goal":"Express likes and preferences and give one short reason.","jaGoal":"","missions":[{"en":"Compare two drinks, then ask the other person which they prefer.","ja":"飲み物2つを比較し、相手の好みを尋ねる。"},{"en":"Choose a café; give one reason in a complete sentence.","ja":"カフェを選んで理由を1文で話す。"},{"en":"Change all preferences to past experiences or a future plan.","ja":"過去の経験や今後の予定につなげる。"}],"questions":[{"ar":"هَلْ تُحِبُّ الْقَهْوَةَ؟","en":"Do you like coffee?","ja":"コーヒーは好きですか？"},{"ar":"لِمَاذَا تُفَضِّلُ هَذَا؟","en":"Why do you prefer this?","ja":"なぜこれを選びますか？"},{"ar":"أَيُّ مَكَانٍ تُفَضِّلُ؟","en":"Which place do you prefer?","ja":"どの場所が好きですか？"}]},{"goal":"Discuss price, size, quality and suitable choices.","jaGoal":"","missions":[{"en":"Compare two sample fabrics, one cheap and one good quality.","ja":"安い生地と品質の良い生地を比較する。"},{"en":"speaking partner offers a third alternative; ask about its price.","ja":"3つ目の選択肢について価格を尋ねる。"},{"en":"Explain to a customer why you choose one of the products.","ja":"選んだ理由を客に説明する。"}],"questions":[{"ar":"أَيُّهُمَا أَرْخَصُ؟","en":"Which of the two is cheaper?","ja":"どちらが安いですか？"},{"ar":"مَا رَأْيُكَ فِي الْجَوْدَةِ؟","en":"What do you think of the quality?","ja":"品質をどう思いますか？"},{"ar":"مَا سَبَبُ اخْتِيَارِكَ؟","en":"Why did you choose it?","ja":"選んだ理由は？"}]},{"goal":"Handle disagreements and unexpected questions.","jaGoal":"","missions":[{"en":"Plan a weekend restaurant with a friend who disagrees.","ja":"意見が違う友人と週末の店を決める。"},{"en":"Offer a cheaper alternative to a customer.","ja":"顧客に低価格の代替品を提案する。"},{"en":"Answer an unexpected question, ask for repetition if needed.","ja":"予想外の質問に答え、必要なら聞き返す。"}],"questions":[{"ar":"هَلْ تُوَافِقُنِي؟","en":"Do you agree with me?","ja":"賛成ですか？"},{"ar":"لِمَاذَا هَذَا أَفْضَلُ؟","en":"Why is this better?","ja":"なぜこちらが良いですか？"},{"ar":"هَلْ عِنْدَكَ خِيَارٌ آخَرُ؟","en":"Do you have another option?","ja":"他の選択肢はありますか？"}]}],"test":[{"en":"Say: I prefer tea to coffee.","ja":"コーヒーよりお茶が好きです。","answer":{"ar":"أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.","roman":"ufaḍḍilu ash-shāya ʿalā al-qahwati","en":"Say: I prefer tea to coffee.","ja":"コーヒーよりお茶が好きです。"}},{"en":"Ask: Which of the two is better?","ja":"どちらが良いですか？","answer":{"ar":"أَيُّهُمَا أَفْضَلُ؟","roman":"ayyuhumā afḍalu","en":"Ask: Which of the two is better?","ja":"どちらが良いですか？"}},{"en":"Say: This one is cheaper than that one.","ja":"こちらの方が安いです。","answer":{"ar":"هَذَا أَرْخَصُ مِنْ ذَلِكَ.","roman":"hādhā arkhaṣu min dhālika","en":"Say: This one is cheaper than that one.","ja":"こちらの方が安いです。"}},{"en":"Explain: I prefer this because it's better.","ja":"こちらの方が良いので好きです。","answer":{"ar":"أُفَضِّلُ هَذَا لِأَنَّهُ أَفْضَلُ.","roman":"ufaḍḍilu hādhā liʾannahu afḍalu","en":"Explain: I prefer this because it's better.","ja":"こちらの方が良いので好きです。"}},{"en":"Ask: Why?","ja":"なぜですか？","answer":{"ar":"لِمَاذَا؟","roman":"limādhā","en":"Ask: Why?","ja":"なぜですか？"}},{"en":"Say: I like this colour.","ja":"この色が好きです。","answer":{"ar":"أُحِبُّ هَذَا اللَّوْنَ.","roman":"uḥibbu hādhā al-lawna","en":"Say: I like this colour.","ja":"この色が好きです。"}}],"checks":["I can explain my choice in two sentences / 理由を2文で説明できる","I can ask at least four questions / 4つ以上質問できる","I can answer without reading / 台本なしで答えられる","I can change details or roles / 役割や条件を変更できる","I can repeat after feedback / 修正後に言い直せる"]}</script><script src="../assets/lesson-v3.js"></script><script defer src="../assets/site-navigation.js"></script></body></html>
