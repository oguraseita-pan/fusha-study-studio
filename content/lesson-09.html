<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fuṣḥā speaking lesson 9: At Work: Products, Samples & Customers"><title>Week 9 — At Work: Products, Samples & Customers | Fuṣḥā Study Studio</title><link rel="stylesheet" href="../assets/lesson-engine.css"><link rel="stylesheet" href="../assets/site-navigation.css"><link rel="stylesheet" href="../assets/lesson-ui.css"></head><body><div class="top"><a href="../index.html">← Fuṣḥā Study Studio</a><div class="tools"><span class="voice-state" id="voice-state">Tap Arabic text for audio</span><button data-switch="ja" aria-pressed="true">日本語</button><button data-switch="en" aria-pressed="true">English</button><button data-switch="answers" aria-pressed="false">Answers</button><button onclick="window.print()">Print / PDF</button></div></div><main id="content" class="wrap"></main><script>window.LESSON_DATA={"week":9,"title":"At Work: Products, Samples & Customers","jaTitle":"仕事・商品説明・サンプル・顧客対応","arTitle":"فِي الْعَمَلِ وَمَعَ الْعُمَلَاءِ","dates":"28 & 30 Dec 2026 · 1 Jan 2027","outcome":"Introduce your work, explain a simple product, ask about samples, prices and quantities, and arrange the next step with a customer.","goals":["Give a 45-second introduction to your company and work / 会社と仕事を45秒で紹介する","Ask at least four questions about a product and order / 商品と注文について4つ質問する","Explain when samples will be sent / サンプル発送予定を伝える","Handle one unexpected question without translating every word / 予想外の質問に対応する"],"review":[{"en":"From Week 5: Arrange a meeting tomorrow.","ja":"第5週：明日の約束を取る。"},{"en":"From Week 6: Tell the teacher what you did at work yesterday.","ja":"第6週：昨日の仕事を過去形で話す。"},{"en":"From Week 3: Ask the price and quantity of a product.","ja":"第3週：商品の価格と数量を尋ねる。"}],"vocab":[{"ar":"أَعْمَلُ","roman":"aʿmalu","en":"I work","ja":"私は働く","type":"verb","past":"عَمِلَ","present":"يَعْمَلُ","me":"أَعْمَلُ","example":{"ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","en":"I work at a Japanese company.","ja":"日本の会社で働いています。"}},{"ar":"أَبِيعُ","roman":"abīʿu","en":"I sell","ja":"私は販売する","type":"verb","past":"بَاعَ","present":"يَبِيعُ","me":"أَبِيعُ","example":{"ar":"أَبِيعُ أَقْمِشَةً.","en":"I sell fabrics.","ja":"生地を販売しています。"}},{"ar":"أَشْتَرِي","roman":"ashtarī","en":"I buy","ja":"私は買う","type":"verb","past":"اِشْتَرَى","present":"يَشْتَرِي","me":"أَشْتَرِي","example":{"ar":"أَشْتَرِي عَيِّنَةً.","en":"I buy a sample.","ja":"サンプルを買います。"}},{"ar":"أُرْسِلُ","roman":"ursilu","en":"I send","ja":"私は送る","type":"verb","past":"أَرْسَلَ","present":"يُرْسِلُ","me":"أُرْسِلُ","example":{"ar":"أُرْسِلُ عَيِّنَةً غَدًا.","en":"I send a sample tomorrow.","ja":"明日サンプルを送ります。"}},{"ar":"أَحْتَاجُ","roman":"aḥtāju","en":"I need","ja":"私は必要とする","type":"verb","past":"اِحْتَاجَ","present":"يَحْتَاجُ","me":"أَحْتَاجُ","example":{"ar":"أَحْتَاجُ إِلَى السِّعْرِ.","en":"I need the price.","ja":"価格を知る必要があります。"}},{"ar":"أَطْلُبُ","roman":"aṭlubu","en":"I order/request","ja":"私は注文・依頼する","type":"verb","past":"طَلَبَ","present":"يَطْلُبُ","me":"أَطْلُبُ","example":{"ar":"أَطْلُبُ خَمْسَ عَيِّنَاتٍ.","en":"I order five samples.","ja":"サンプルを5点注文します。"}},{"ar":"أُرِيدُ","roman":"urīdu","en":"I want","ja":"私は欲しい","type":"verb","past":"أَرَادَ","present":"يُرِيدُ","me":"أُرِيدُ","example":{"ar":"أُرِيدُ عَيِّنَةً جَدِيدَةً.","en":"I want a new sample.","ja":"新しいサンプルが欲しいです。"}},{"ar":"شَرِكَةٌ","roman":"sharikatun","en":"company","ja":"会社","type":"noun","gender":"feminine","plural":"شَرِكَاتٌ","example":{"ar":"هَذِهِ شَرِكَةٌ يَابَانِيَّةٌ.","en":"This is a Japanese company.","ja":"これは日本の会社です。"}},{"ar":"مَكْتَبٌ","roman":"maktabun","en":"office","ja":"オフィス","type":"noun","gender":"masculine","plural":"مَكَاتِبُ","example":{"ar":"مَكْتَبِي فِي دُبَيّ.","en":"My office is in Dubai.","ja":"私のオフィスはドバイです。"}},{"ar":"عَمِيلٌ","roman":"ʿamīlun","en":"customer","ja":"顧客","type":"noun","gender":"masculine","plural":"عُمَلَاءُ","example":{"ar":"هَذَا عَمِيلٌ جَدِيدٌ.","en":"This is a new customer.","ja":"これは新規のお客様です。"}},{"ar":"مُنْتَجٌ","roman":"muntajun","en":"product","ja":"製品","type":"noun","gender":"masculine","plural":"مُنْتَجَاتٌ","example":{"ar":"هَذَا مُنْتَجٌ جَدِيدٌ.","en":"This is a new product.","ja":"これは新製品です。"}},{"ar":"قُمَاشٌ","roman":"qumāshun","en":"fabric","ja":"生地","type":"noun","gender":"masculine","plural":"أَقْمِشَةٌ","example":{"ar":"هَذَا الْقُمَاشُ جَيِّدٌ.","en":"This fabric is good.","ja":"この生地は良いです。"}},{"ar":"عَيِّنَةٌ","roman":"ʿayyinatun","en":"sample","ja":"サンプル","type":"noun","gender":"feminine","plural":"عَيِّنَاتٌ","example":{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","en":"The sample is ready.","ja":"サンプルは準備できています。"}},{"ar":"طَلَبٌ","roman":"ṭalabun","en":"order/request","ja":"注文","type":"noun","gender":"masculine","plural":"طَلَبَاتٌ","example":{"ar":"عِنْدَنَا طَلَبٌ جَدِيدٌ.","en":"We have a new order.","ja":"新規注文があります。"}},{"ar":"سِعْرٌ","roman":"siʿrun","en":"price","ja":"価格","type":"noun","gender":"masculine","plural":"أَسْعَارٌ","example":{"ar":"مَا سِعْرُ هَذَا الْقُمَاشِ؟","en":"What is the price of this fabric?","ja":"この生地の価格はいくらですか？"}},{"ar":"كَمِّيَّةٌ","roman":"kammiyyatun","en":"quantity","ja":"数量","type":"noun","gender":"feminine","plural":"كَمِّيَّاتٌ","example":{"ar":"مَا الْكَمِّيَّةُ الْمَطْلُوبَةُ؟","en":"What quantity is required?","ja":"必要数量はいくつですか？"}},{"ar":"اِجْتِمَاعٌ","roman":"ijtimāʿun","en":"meeting","ja":"会議","type":"noun","gender":"masculine","plural":"اِجْتِمَاعَاتٌ","example":{"ar":"عِنْدِي اِجْتِمَاعٌ غَدًا.","en":"I have a meeting tomorrow.","ja":"明日会議があります。"}},{"ar":"فَاتُورَةٌ","roman":"fātūratun","en":"invoice","ja":"請求書","type":"noun","gender":"feminine","plural":"فَوَاتِيرُ","example":{"ar":"أُرْسِلُ الْفَاتُورَةَ الْيَوْمَ.","en":"I send the invoice today.","ja":"今日請求書を送ります。"}},{"ar":"جَدِيدٌ","roman":"jadīdun","en":"new (masculine)","ja":"新しい（男性形）","type":"adj","fem":"جَدِيدَةٌ","example":{"ar":"هَذَا الْمُنْتَجُ جَدِيدٌ.","en":"This product is new.","ja":"この製品は新しいです。"}},{"ar":"جَاهِزٌ","roman":"jāhizun","en":"ready (masculine)","ja":"準備できた（男性形）","type":"adj","fem":"جَاهِزَةٌ","example":{"ar":"الطَّلَبُ جَاهِزٌ.","en":"The order is ready.","ja":"注文の準備ができています。"}},{"ar":"كَبِيرٌ","roman":"kabīrun","en":"large (masculine)","ja":"大きい（男性形）","type":"adj","fem":"كَبِيرَةٌ","example":{"ar":"هَذَا طَلَبٌ كَبِيرٌ.","en":"This is a large order.","ja":"これは大口注文です。"}},{"ar":"مُنَاسِبٌ","roman":"munāsibun","en":"suitable (masculine)","ja":"適切な（男性形）","type":"adj","fem":"مُنَاسِبَةٌ","example":{"ar":"هَذَا السِّعْرُ مُنَاسِبٌ.","en":"This price is reasonable.","ja":"この価格は適切です。"}},{"ar":"الْيَوْمَ","roman":"al-yawma","en":"today","ja":"今日","type":"adverb","example":{"ar":"أَعْمَلُ الْيَوْمَ.","en":"I work today.","ja":"今日は仕事です。"}},{"ar":"غَدًا","roman":"ghadan","en":"tomorrow","ja":"明日","type":"adverb","example":{"ar":"سَأُرْسِلُ الطَّلَبَ غَدًا.","en":"I will send the order tomorrow.","ja":"明日注文書を送ります。"}}],"grammar":[{"title":"Perfect / imperfect / I-form","en":"To say what you do, use the imperfect and its person prefix: يَـ for 'he' and أَـ for 'I' in these examples. The perfect (past) is a separate form.","ja":"動詞は完了形（過去）と未完了形（現在）をセットで覚えます。例では「彼」は يَـ、「私」は أَـ で始まります（語幹の母音にも注意）。","example":{"ar":"بَاعَ ← يَبِيعُ ← أَبِيعُ","roman":"bāʿa · yabīʿu · abīʿu","en":"He sold → he sells → I sell","ja":"彼は売った→売る→私は売る"},"drill":"Change I sell to he sells; then I send to he sends. Ask one yes/no question."},{"title":"Gender agreement with a sample","en":"عَيِّنَةٌ is feminine. Therefore 'ready' is جَاهِزَةٌ, not جَاهِزٌ. Masculine قُمَاشٌ takes جَاهِزٌ.","ja":"名詞が女性形なら形容詞も女性形にします。サンプル（女性名詞）には جَاهِزَةٌ、男性名詞には جَاهِزٌ。","example":{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","roman":"al-ʿayyinatu jāhizatun","en":"The sample is ready.","ja":"サンプルは準備できています。"},"drill":"Say product is ready, sample is ready, invoice is ready. Ask the learner to explain the ending."},{"title":"Ask prices and quantities","en":"Use مَا سِعْرُ ...؟ to ask the price and مَا الْكَمِّيَّةُ ...؟ to ask a required quantity. Keep the question short and direct.","ja":"「価格はいくら？」は مَا سِعْرُ …؟、「必要数量は？」は مَا الْكَمِّيَّةُ ...؟ と聞けます。","example":{"ar":"مَا سِعْرُ هَذَا الْقُمَاشِ؟","roman":"mā siʿru hādhā al-qumāshi?","en":"What is the price of this fabric?","ja":"この生地はいくらですか？"},"drill":"Replace fabric with product. Student answers then asks the teacher the same question."},{"title":"Polite request with هَلْ يُمْكِنُكَ","en":"هَلْ يُمْكِنُكَ أَنْ ...؟ is 'Can you ...?' to a man. With a woman, change to هَلْ يُمْكِنُكِ. The imperfect after أَنْ changes its final vowel in full grammar.","ja":"丁寧な依頼には هَلْ يُمْكِنُكَ أَنْ ...؟（男性へ）を使えます。女性へは يُمْكِنُكِ。詳しい接続法の語尾は後の学習で扱います。","example":{"ar":"هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ الْعَيِّنَةَ؟","roman":"hal yumkinuka an tursila al-ʿayyinata?","en":"Can you send the sample? (to a man)","ja":"サンプルを送ってもらえますか？"},"drill":"Student requests a sample, a price and an invoice. Teacher declines one request."}],"phrases":[{"ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","roman":"aʿmalu fī sharikatin yābāniyyatin","en":"I work for a Japanese company.","ja":"日本企業で働いています。"},{"ar":"أَبِيعُ أَقْمِشَةً لِلْمَلَابِسِ.","roman":"abīʿu aqmishatan lil-malābisi","en":"I sell fabrics for clothing.","ja":"衣料用の生地を販売しています。"},{"ar":"هَذَا مُنْتَجٌ جَدِيدٌ.","roman":"hādhā muntajun jadīdun","en":"This is a new product.","ja":"これは新製品です。"},{"ar":"هَلْ عِنْدَكُمْ عَيِّنَاتٌ؟","roman":"hal ʿindakum ʿayyinātun","en":"Do you have samples?","ja":"サンプルはありますか？"},{"ar":"مَا سِعْرُ هَذَا الْقُمَاشِ؟","roman":"mā siʿru hādhā al-qumāshi","en":"What is the price of this fabric?","ja":"この生地はいくらですか？"},{"ar":"مَا الْكَمِّيَّةُ الْمَطْلُوبَةُ؟","roman":"mā al-kammiyyatu al-maṭlūbatu","en":"What quantity do you need?","ja":"必要数量はいくつですか？"},{"ar":"هَذَا السِّعْرُ مُنَاسِبٌ.","roman":"hādhā as-siʿru munāsibun","en":"This price is reasonable.","ja":"この価格は適切です。"},{"ar":"أَحْتَاجُ إِلَى خَمْسِ عَيِّنَاتٍ.","roman":"aḥtāju ilā khamsi ʿayyinātin","en":"I need five samples.","ja":"サンプルが5点必要です。"},{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","roman":"al-ʿayyinatu jāhizatun","en":"The sample is ready.","ja":"サンプルは準備できています。"},{"ar":"سَأُرْسِلُهَا غَدًا.","roman":"sa-ursiluhā ghadan","en":"I will send it tomorrow.","ja":"明日それを送ります。"},{"ar":"عِنْدَنَا طَلَبٌ جَدِيدٌ.","roman":"ʿindanā ṭalabun jadīdun","en":"We have a new order.","ja":"新規注文があります。"},{"ar":"هَلْ يُمْكِنُنَا أَنْ نَلْتَقِيَ غَدًا؟","roman":"hal yumkinunā an naltaqiya ghadan","en":"Can we meet tomorrow?","ja":"明日お会いできますか？"}],"dialogues":[{"title":"Meet a new customer","turns":[{"role":"A","ar":"مَرْحَبًا، أَنَا أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","en":"Hello, I work for a Japanese company.","ja":"こんにちは。日本企業で働いています。"},{"role":"B","ar":"أَهْلًا وَسَهْلًا. مَاذَا تَبِيعُونَ؟","en":"Welcome. What do you sell?","ja":"ようこそ。何を販売していますか？"},{"role":"A","ar":"نَبِيعُ أَقْمِشَةً لِلْمَلَابِسِ.","en":"We sell fabrics for clothing.","ja":"衣料用生地を販売しています。"},{"role":"B","ar":"هَلْ عِنْدَكُمْ عَيِّنَاتٌ؟","en":"Do you have samples?","ja":"サンプルはありますか？"},{"role":"A","ar":"نَعَمْ، عِنْدَنَا عَيِّنَاتٌ جَدِيدَةٌ.","en":"Yes, we have new samples.","ja":"はい、新しいサンプルがあります。"},{"role":"B","ar":"مُمْتَازٌ، أُرِيدُ أَنْ أَرَاهَا.","en":"Excellent. I want to see them.","ja":"いいですね。見たいです。"}],"twist":"Change the customer to a clothing retailer. They want a different type of fabric."},{"title":"Discuss price and quantity","turns":[{"role":"A","ar":"مَا سِعْرُ هَذَا الْقُمَاشِ؟","en":"What is the price of this fabric?","ja":"この生地の価格はいくらですか？"},{"role":"B","ar":"سِعْرُهُ عِشْرُونَ دِرْهَمًا.","en":"It costs twenty dirhams.","ja":"20ディルハムです。"},{"role":"A","ar":"هَلْ هَذَا السِّعْرُ نِهَائِيٌّ؟","en":"Is this the final price?","ja":"これが最終価格ですか？"},{"role":"B","ar":"نَعَمْ، لِهَذِهِ الْكَمِّيَّةِ.","en":"Yes, for this quantity.","ja":"はい、この数量については。"},{"role":"A","ar":"أَحْتَاجُ إِلَى كَمِّيَّةٍ أَكْبَرَ.","en":"I need a larger quantity.","ja":"もっと多い数量が必要です。"},{"role":"B","ar":"حَسَنًا، سَأَتَحَقَّقُ مِنَ السِّعْرِ.","en":"Okay, I will check the price.","ja":"承知しました。価格を確認します。"}],"twist":"Set a new quantity of 50. The buyer asks for a second price quote."},{"title":"Samples and next action","turns":[{"role":"A","ar":"هَلِ الْعَيِّنَةُ جَاهِزَةٌ؟","en":"Is the sample ready?","ja":"サンプルは準備できていますか？"},{"role":"B","ar":"نَعَمْ، هِيَ جَاهِزَةٌ.","en":"Yes, it is ready.","ja":"はい、準備できています。"},{"role":"A","ar":"مَتَى يُمْكِنُكَ إِرْسَالُهَا؟","en":"When can you send it?","ja":"いつ送れますか？"},{"role":"B","ar":"سَأُرْسِلُهَا غَدًا.","en":"I will send it tomorrow.","ja":"明日送ります。"},{"role":"A","ar":"وَهَلْ يُمْكِنُكَ أَنْ تُرْسِلَ الْفَاتُورَةَ؟","en":"Can you send the invoice too?","ja":"請求書も送れますか？"},{"role":"B","ar":"نَعَمْ، سَأُرْسِلُهَا الْيَوْمَ.","en":"Yes, I will send it today.","ja":"はい、今日送ります。"}],"twist":"The shipment is delayed. Student politely offers a new date and confirms it."}],"classes":[{"day":"Mon 28 Dec 2026","name":"BUILD · Introduce a product","goal":"Give company information and describe a fabric.","missions":[{"en":"Introduce the company in three sentences.","ja":"会社を3文で紹介する。"},{"en":"Show a sample and explain two features.","ja":"サンプルの特徴を2つ説明する。"},{"en":"Switch roles; ask what the partner sells.","ja":"役割を交代して商品を質問する。"}],"questions":[{"ar":"أَيْنَ تَعْمَلُ؟","en":"Where do you work?","ja":"どこで働いていますか？"},{"ar":"مَاذَا تَبِيعُونَ؟","en":"What do you sell?","ja":"何を売っていますか？"},{"ar":"هَلْ هَذَا مُنْتَجٌ جَدِيدٌ؟","en":"Is this a new product?","ja":"これは新製品ですか？"}],"teacher":"Use the questions in a different order and change one product name.","exit":"45 sec: introduce work and show one product without notes."},{"day":"Wed 30 Dec 2026","name":"USE · Price and quantity","goal":"Ask about prices, quantities and samples.","missions":[{"en":"Buyer asks the price and quantity, seller answers.","ja":"価格と数量を質問し答える。"},{"en":"Customer requests five samples; seller has only two.","ja":"顧客が5点を希望するが2点しかない。"},{"en":"Negotiate a suitable meeting time for next week.","ja":"来週の面談時間を調整する。"}],"questions":[{"ar":"مَا سِعْرُ هَذَا الْقُمَاشِ؟","en":"What is the price?","ja":"価格はいくらですか？"},{"ar":"كَمْ عَيِّنَةً تُرِيدُ؟","en":"How many samples do you want?","ja":"何点欲しいですか？"},{"ar":"مَتَى نَلْتَقِي؟","en":"When shall we meet?","ja":"いつ会いますか？"}],"teacher":"Decline one quantity request, then offer a realistic alternative.","exit":"Without notes, complete a 2-minute buyer/seller exchange."},{"day":"Fri 1 Jan 2027","name":"TRANSFER · Follow-up a customer","goal":"Connect new business language with Weeks 5–8.","missions":[{"en":"Phone a customer about sample delivery.","ja":"顧客にサンプルの納期を確認する。"},{"en":"Explain a price and arrange another meeting.","ja":"価格を説明して次の面談を設定する。"},{"en":"Take an unexpected question; ask for clarification.","ja":"予想外の質問に聞き返して対応する。"}],"questions":[{"ar":"هَلِ الْعَيِّنَةُ جَاهِزَةٌ؟","en":"Is the sample ready?","ja":"サンプルは準備できていますか？"},{"ar":"مَتَى تُرْسِلُهَا؟","en":"When will you send it?","ja":"いつ送りますか？"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ السُّؤَالَ؟","en":"Can you repeat the question?","ja":"質問を繰り返してもらえますか？"}],"teacher":"Speak slightly faster for the final round, but stay understandable.","exit":"90 sec: answer 5 customer questions, then ask two new ones."}],"test":[{"en":"Introduce your work: I work for a Japanese company.","ja":"日本企業で働いています。","answer":{"ar":"أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ.","roman":"aʿmalu fī sharikatin yābāniyyatin","en":"Model answer","ja":"回答例"}},{"en":"Ask: What is the price of this fabric?","ja":"この生地はいくらですか？","answer":{"ar":"مَا سِعْرُ هَذَا الْقُمَاشِ؟","roman":"mā siʿru hādhā al-qumāshi","en":"Model answer","ja":"回答例"}},{"en":"Ask: Do you have samples?","ja":"サンプルはありますか？","answer":{"ar":"هَلْ عِنْدَكُمْ عَيِّنَاتٌ؟","roman":"hal ʿindakum ʿayyinātun","en":"Model answer","ja":"回答例"}},{"en":"Say: The sample is ready.","ja":"サンプルは準備できています。","answer":{"ar":"الْعَيِّنَةُ جَاهِزَةٌ.","roman":"al-ʿayyinatu jāhizatun","en":"Model answer","ja":"回答例"}},{"en":"Ask a man: Can you send the invoice?","ja":"請求書を送れますか？","answer":{"ar":"هَلْ يُمْكِنُكَ أَنْ تُرْسِلَ الْفَاتُورَةَ؟","roman":"hal yumkinuka an tursila al-fātūrata","en":"Model answer","ja":"回答例"}},{"en":"Say: I will send it tomorrow.","ja":"明日それを送ります。","answer":{"ar":"سَأُرْسِلُهَا غَدًا.","roman":"sa-ursiluhā ghadan","en":"Model answer","ja":"回答例"}}],"checks":["I can ask at least four relevant questions / 4つ以上の質問ができる","I can answer without a script / 台本なしで答えられる","I can clarify when misunderstood / 聞き返しや説明ができる","I can reuse phrases from previous weeks / 以前の表現を使える","I can retell the conversation after feedback / 修正後に言い直せる"],"speaking":{"fusha":"Use short complete sentences such as أَعْمَلُ فِي شَرِكَةٍ يَابَانِيَّةٍ. In formal Fuṣḥā, pronounce grammatical endings when carefully reading.","real":"For a real UAE business contact, English may still be the working language. Short Fuṣḥā greetings and product phrases are understandable, but local colleagues may answer in dialect. It is fine to request slow Fuṣḥā."}};</script><script src="../assets/lesson-engine.js"></script><script defer src="../assets/site-navigation.js"></script><script defer src="../assets/lesson-ui.js"></script></body></html>
