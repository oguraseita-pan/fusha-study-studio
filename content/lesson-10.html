<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103741"><meta name="description" content="Modern Standard Arabic speaking lesson 10 with Japanese and English explanations."><title>Lesson 10 | Fuṣḥā Study Studio</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fuṣḥā"><link rel="stylesheet" href="../assets/lesson-v3.css"><link rel="stylesheet" href="../assets/site-navigation.css"></head><body><main id="content" aria-label="Arabic learning lesson"></main><script>window.LESSON_DATA={"week":10,"title":"Phone Calls, Messages & Clarification","jaTitle":"電話・メッセージ・聞き返し","arTitle":"الْمُكَالَمَاتُ وَالرَّسَائِلُ","outcome":"Start a short call, ask to speak to someone, clarify what you heard, and agree on an action.","goals":["Start and close a simple business call / 電話の開始と終了ができる","Ask the other person to slow down or repeat / ゆっくり話す・繰り返すよう頼める","Take and confirm simple contact details / 名前・番号・予定を確認できる","Send a short follow-up message / 短いフォローメッセージができる"],"review":[{"en":"Lesson 9: Explain what your company sells.","ja":"第9課：会社で扱う商品を説明する。"},{"en":"Lesson 5: Move tomorrow's appointment.","ja":"第5課：明日の約束を変更する。"},{"en":"Lesson 8: Ask where the nearest pharmacy is.","ja":"第8課：最寄りの薬局を尋ねる。"}],"vocab":[{"ar":"أَتَّصِلُ","roman":"attaṣilu","en":"I call / contact","ja":"私は電話する","type":"verb","past":"اِتَّصَلَ","present":"يَتَّصِلُ","me":"أَتَّصِلُ","example":{"ar":"سَأَتَّصِلُ بِكَ غَدًا.","en":"I will call you tomorrow.","ja":"明日電話します。"}},{"ar":"أَتَكَلَّمُ","roman":"atakallamu","en":"I speak","ja":"私は話す","type":"verb","past":"تَكَلَّمَ","present":"يَتَكَلَّمُ","me":"أَتَكَلَّمُ","example":{"ar":"أَتَكَلَّمُ الْعَرَبِيَّةَ قَلِيلًا.","en":"I speak a little Arabic.","ja":"アラビア語を少し話します。"}},{"ar":"أَسْمَعُ","roman":"asmaʿu","en":"I hear","ja":"私は聞こえる","type":"verb","past":"سَمِعَ","present":"يَسْمَعُ","me":"أَسْمَعُ","example":{"ar":"لَا أَسْمَعُكَ جَيِّدًا.","en":"I cannot hear you well.","ja":"よく聞こえません。"}},{"ar":"أَفْهَمُ","roman":"afhamu","en":"I understand","ja":"私は理解する","type":"verb","past":"فَهِمَ","present":"يَفْهَمُ","me":"أَفْهَمُ","example":{"ar":"لَا أَفْهَمُ هَذِهِ الْكَلِمَةَ.","en":"I don't understand this word.","ja":"この単語が分かりません。"}},{"ar":"أُكَرِّرُ","roman":"ukarriru","en":"I repeat","ja":"私は繰り返す","type":"verb","past":"كَرَّرَ","present":"يُكَرِّرُ","me":"أُكَرِّرُ","example":{"ar":"أُكَرِّرُ الرَّقْمَ.","en":"I repeat the number.","ja":"番号を繰り返します。"}},{"ar":"أَنْتَظِرُ","roman":"antaẓiru","en":"I wait","ja":"私は待つ","type":"verb","past":"اِنْتَظَرَ","present":"يَنْتَظِرُ","me":"أَنْتَظِرُ","example":{"ar":"أَنْتَظِرُ دَقِيقَةً.","en":"I wait one minute.","ja":"1分待ちます。"}},{"ar":"أُرْسِلُ","roman":"ursilu","en":"I send","ja":"私は送る","type":"verb","past":"أَرْسَلَ","present":"يُرْسِلُ","me":"أُرْسِلُ","example":{"ar":"أُرْسِلُ رِسَالَةً.","en":"I send a message.","ja":"メッセージを送ります。"}},{"ar":"أُجِيبُ","roman":"ujību","en":"I answer","ja":"私は答える","type":"verb","past":"أَجَابَ","present":"يُجِيبُ","me":"أُجِيبُ","example":{"ar":"أُجِيبُ عَنِ السُّؤَالِ.","en":"I answer the question.","ja":"質問に答えます。"}},{"ar":"هَاتِفٌ","roman":"hātifun","en":"telephone","ja":"電話","type":"noun","gender":"masculine","plural":"هَوَاتِفُ","example":{"ar":"هَذَا رَقْمُ هَاتِفِي.","en":"This is my phone number.","ja":"これが私の電話番号です。"}},{"ar":"رَقْمٌ","roman":"raqmun","en":"number","ja":"番号","type":"noun","gender":"masculine","plural":"أَرْقَامٌ","example":{"ar":"مَا رَقْمُ هَاتِفِكَ؟","en":"What is your phone number?","ja":"電話番号は何ですか？"}},{"ar":"مُكَالَمَةٌ","roman":"mukālamatun","en":"phone call","ja":"通話","type":"noun","gender":"feminine","plural":"مُكَالَمَاتٌ","example":{"ar":"عِنْدِي مُكَالَمَةٌ الْآنَ.","en":"I have a call now.","ja":"今電話があります。"}},{"ar":"رِسَالَةٌ","roman":"risālatun","en":"message","ja":"メッセージ","type":"noun","gender":"feminine","plural":"رَسَائِلُ","example":{"ar":"أَرْسَلْتُ رِسَالَةً.","en":"I sent a message.","ja":"メッセージを送りました。"}},{"ar":"اِسْمٌ","roman":"ismun","en":"name","ja":"名前","type":"noun","gender":"masculine","plural":"أَسْمَاءٌ","example":{"ar":"مَا اسْمُكَ؟","en":"What is your name?","ja":"お名前は？"}},{"ar":"مُدِيرٌ","roman":"mudīrun","en":"manager","ja":"マネージャー","type":"noun","gender":"masculine","plural":"مُدَرَاءُ","example":{"ar":"الْمُدِيرُ مَشْغُولٌ.","en":"The manager is busy.","ja":"マネージャーは忙しいです。"}},{"ar":"بَرِيدٌ إِلِكْتُرُونِيٌّ","roman":"barīdun iliktrūniyyun","en":"email","ja":"Eメール","type":"noun","gender":"masculine","plural":"—","example":{"ar":"أُرْسِلُ رِسَالَةً بِالْبَرِيدِ الْإِلِكْتُرُونِيِّ.","en":"I send a message by email.","ja":"メールで連絡します。"}},{"ar":"صَوْتٌ","roman":"ṣawtun","en":"voice / sound","ja":"声・音","type":"noun","gender":"masculine","plural":"أَصْوَاتٌ","example":{"ar":"الصَّوْتُ غَيْرُ وَاضِحٍ.","en":"The sound is not clear.","ja":"音声が明瞭ではありません。"}},{"ar":"سُؤَالٌ","roman":"suʾālun","en":"question","ja":"質問","type":"noun","gender":"masculine","plural":"أَسْئِلَةٌ","example":{"ar":"عِنْدِي سُؤَالٌ.","en":"I have a question.","ja":"質問があります。"}},{"ar":"مَعْلُومَةٌ","roman":"maʿlūmatun","en":"piece of information","ja":"情報","type":"noun","gender":"feminine","plural":"مَعْلُومَاتٌ","example":{"ar":"أَحْتَاجُ إِلَى مَعْلُومَاتٍ.","en":"I need information.","ja":"情報が必要です。"}},{"ar":"وَاضِحٌ","roman":"wāḍiḥun","en":"clear (m.)","ja":"明瞭な（男性形）","type":"adj","fem":"وَاضِحَةٌ","example":{"ar":"الْكَلَامُ وَاضِحٌ.","en":"The speech is clear.","ja":"話は明瞭です。"}},{"ar":"مَشْغُولٌ","roman":"mashghūlun","en":"busy (m.)","ja":"忙しい（男性形）","type":"adj","fem":"مَشْغُولَةٌ","example":{"ar":"الْمُدِيرُ مَشْغُولٌ.","en":"The manager is busy.","ja":"マネージャーは忙しいです。"}},{"ar":"مُمْكِنٌ","roman":"mumkinun","en":"possible (m.)","ja":"可能な（男性形）","type":"adj","fem":"مُمْكِنَةٌ","example":{"ar":"هَلْ هَذَا مُمْكِنٌ؟","en":"Is this possible?","ja":"これは可能ですか？"}},{"ar":"بِبُطْءٍ","roman":"bibuṭʾin","en":"slowly","ja":"ゆっくり","type":"adverb","example":{"ar":"تَكَلَّمْ بِبُطْءٍ.","en":"Speak slowly.","ja":"ゆっくり話してください。"}},{"ar":"مَرَّةً أُخْرَى","roman":"marratan ukhrā","en":"once again","ja":"もう一度","type":"adverb","example":{"ar":"كَرِّرْهُ مَرَّةً أُخْرَى.","en":"Repeat it one more time.","ja":"もう一度繰り返してください。"}},{"ar":"الآنَ","roman":"al-āna","en":"now","ja":"今","type":"adverb","example":{"ar":"هَلْ يُمْكِنُنَا التَّكَلُّمُ الْآنَ؟","en":"Can we talk now?","ja":"今お話しできますか？"}}],"grammar":[{"title":"The verb 'call' and the preposition بِـ","en":"اتصل needs بِـ for the person you call: أَتَّصِلُ بِكَ (I call you, to a man). Use بِكِ for a woman.","ja":"「〜に電話する」は اِتَّصَلَ بِـ の形です。男性に「あなたへ」は بِكَ、女性に「あなたへ」は بِكِ。","example":{"ar":"سَأَتَّصِلُ بِكَ غَدًا.","roman":"sa-attaṣilu bika ghadan","en":"I will call you tomorrow.","ja":"明日電話します。"},"drill":"Replace you with the manager. Then ask when the student will call."},{"title":"Polite requests with an imperfect verb","en":"Use هَلْ يُمْكِنُكَ أَنْ ...؟ to ask someone to repeat or speak slowly. After أَنْ, a verb typically takes a different final ending in careful standard grammar.","ja":"「〜してもらえますか？」は هَلْ يُمْكِنُكَ أَنْ ...؟。詳しい動詞語尾変化は次の段階で扱います。","example":{"ar":"هَلْ يُمْكِنُكَ أَنْ تَتَكَلَّمَ بِبُطْءٍ؟","roman":"hal yumkinuka an tatakallama bibuṭʾin","en":"Can you speak slowly? (to a man)","ja":"ゆっくり話してもらえますか？"},"drill":"Make requests to repeat, say a number and speak more slowly."},{"title":"Negative understanding and hearing","en":"Use لَا before an imperfect verb: لَا أَفْهَمُ (I don't understand), لَا أَسْمَعُكَ (I can't hear you).","ja":"未完了形の否定は、基本的に動詞の前に لَا を置きます。「分かりません」「聞こえません」は最重要の会話表現です。","example":{"ar":"لَا أَفْهَمُ. هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"lā afhamu · hal yumkinuka an tukarrira?","en":"I don't understand. Can you repeat?","ja":"分かりません。繰り返してもらえますか？"},"drill":"Teacher speaks a long number once; student requests repetition instead of guessing."},{"title":"Confirming contact information","en":"Ask مَا رَقْمُ هَاتِفِكَ؟ for a phone number (to a man). Say the number back and ask: هَلْ هَذَا صَحِيحٌ؟ (Is this correct?).","ja":"電話番号は聞いて終わりではなく、数字を復唱し「これで正しいですか？」と確認します。","example":{"ar":"هَلْ هَذَا الرَّقْمُ صَحِيحٌ؟","roman":"hal hādhā ar-raqmu ṣaḥīḥun?","en":"Is this number correct?","ja":"この番号で正しいですか？"},"drill":"Read a 5-digit practice number slowly, have the student repeat it, and change one digit."}],"phrases":[{"ar":"مَرْحَبًا، مَنْ يَتَكَلَّمُ؟","roman":"marḥaban · man yatakallamu?","en":"Hello, who's speaking?","ja":"こんにちは。どちら様ですか？"},{"ar":"أَنَا مِنْ شَرِكَةٍ يَابَانِيَّةٍ.","roman":"anā min sharikatin yābāniyyatin","en":"I'm from a Japanese company.","ja":"日本の会社の者です。"},{"ar":"هَلْ يُمْكِنُنِي التَّحَدُّثُ إِلَى الْمُدِيرِ؟","roman":"hal yumkinunī at-taḥadduthu ilā al-mudīri?","en":"May I speak to the manager?","ja":"マネージャーとお話しできますか？"},{"ar":"هُوَ مَشْغُولٌ الْآنَ.","roman":"huwa mashghūlun al-āna","en":"He is busy now.","ja":"彼は今忙しいです。"},{"ar":"سَأَتَّصِلُ مَرَّةً أُخْرَى.","roman":"sa-attaṣilu marratan ukhrā","en":"I'll call again.","ja":"また電話します。"},{"ar":"لَا أَسْمَعُكَ جَيِّدًا.","roman":"lā asmaʿuka jayyidan","en":"I can't hear you well.","ja":"よく聞こえません。"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"hal yumkinuka an tukarrira?","en":"Could you repeat that?","ja":"繰り返してもらえますか？"},{"ar":"تَكَلَّمْ بِبُطْءٍ، مِنْ فَضْلِكَ.","roman":"takallam bibuṭʾin min faḍlika","en":"Please speak slowly (to a man).","ja":"ゆっくり話してください。"},{"ar":"مَا رَقْمُ هَاتِفِكَ؟","roman":"mā raqmu hātifika?","en":"What's your phone number?","ja":"電話番号は？"},{"ar":"هَلْ هَذَا الرَّقْمُ صَحِيحٌ؟","roman":"hal hādhā ar-raqmu ṣaḥīḥun?","en":"Is this number correct?","ja":"この番号で正しいですか？"},{"ar":"سَأُرْسِلُ رِسَالَةً بِالْبَرِيدِ الْإِلِكْتُرُونِيِّ.","roman":"sa-ursilu risālatan bil-barīdi al-iliktrūniyyi","en":"I'll send an email.","ja":"メールを送ります。"},{"ar":"شُكْرًا عَلَى اتِّصَالِكَ.","roman":"shukran ʿalā ittiṣālika","en":"Thank you for your call.","ja":"お電話ありがとうございます。"}],"dialogues":[{"title":"Call a company","turns":[{"role":"A","ar":"مَرْحَبًا، أَنَا مِنْ شَرِكَةٍ يَابَانِيَّةٍ.","en":"Hello, I'm from a Japanese company.","ja":"こんにちは。日本の会社の者です。"},{"role":"B","ar":"مَرْحَبًا بِكَ. كَيْفَ أُسَاعِدُكَ؟","en":"Welcome. How can I help you?","ja":"こんにちは。ご用件は？"},{"role":"A","ar":"هَلْ يُمْكِنُنِي التَّحَدُّثُ إِلَى الْمُدِيرِ؟","en":"May I speak to the manager?","ja":"マネージャーと話せますか？"},{"role":"B","ar":"هُوَ مَشْغُولٌ الْآنَ.","en":"He is busy now.","ja":"彼は今忙しいです。"},{"role":"A","ar":"مَتَى يُمْكِنُنِي أَنْ أَتَّصِلَ مَرَّةً أُخْرَى؟","en":"When can I call again?","ja":"いつかけ直せますか？"},{"role":"B","ar":"بَعْدَ السَّاعَةِ الثَّالِثَةِ.","en":"After 3 o'clock.","ja":"3時以降です。"}],"twist":"The manager becomes available sooner. Student must confirm time before hanging up."},{"title":"Ask for clarification","turns":[{"role":"A","ar":"سَأُرْسِلُ الْعَيِّنَةَ يَوْمَ الْخَمِيسِ.","en":"I'll send the sample on Thursday.","ja":"木曜日にサンプルを送ります。"},{"role":"B","ar":"عُذْرًا، لَا أَسْمَعُكَ جَيِّدًا.","en":"Sorry, I can't hear you well.","ja":"すみません、よく聞こえません。"},{"role":"A","ar":"سَأُرْسِلُ الْعَيِّنَةَ يَوْمَ الْخَمِيسِ.","en":"I'll send the sample on Thursday.","ja":"木曜日に送ります。"},{"role":"B","ar":"هَلْ قُلْتَ يَوْمَ الْخَمِيسِ؟","en":"Did you say Thursday?","ja":"木曜日と言いましたか？"},{"role":"A","ar":"نَعَمْ، يَوْمَ الْخَمِيسِ.","en":"Yes, Thursday.","ja":"はい、木曜日です。"},{"role":"B","ar":"شُكْرًا، الْآنَ فَهِمْتُ.","en":"Thanks, now I understand.","ja":"ありがとうございます、分かりました。"}],"twist":"Teacher changes Thursday to Tuesday and says it once faster; learner must confirm."},{"title":"Follow up in writing","turns":[{"role":"A","ar":"هَلْ وَصَلَتْكَ رِسَالَتِي؟","en":"Did my message reach you?","ja":"私のメッセージは届きましたか？"},{"role":"B","ar":"نَعَمْ، وَصَلَتْنِي الْيَوْمَ.","en":"Yes, it reached me today.","ja":"はい、今日届きました。"},{"role":"A","ar":"هَلْ عِنْدَكَ أَيُّ سُؤَالٍ؟","en":"Do you have any questions?","ja":"質問はありますか？"},{"role":"B","ar":"نَعَمْ، عِنْدِي سُؤَالٌ عَنِ السِّعْرِ.","en":"Yes, I have a question about the price.","ja":"はい、価格について質問があります。"},{"role":"A","ar":"سَأُرْسِلُ التَّفَاصِيلَ بِالْبَرِيدِ الْإِلِكْتُرُونِيِّ.","en":"I'll send details by email.","ja":"詳細はメールで送ります。"},{"role":"B","ar":"شُكْرًا، سَأَنْتَظِرُ رِسَالَتَكَ.","en":"Thanks, I'll wait for your message.","ja":"ありがとうございます。メールを待ちます。"}],"twist":"Recipient needs one more detail; student asks what detail is missing."}],"classes":[{"goal":"Make a greeting, introduction and request.","jaGoal":"","missions":[{"en":"Introduce yourself on the phone with no visual support.","ja":"画面を見ずに電話で自己紹介する。"},{"en":"Ask for the manager and understand that they are busy.","ja":"マネージャーへの取次ぎを頼む。"},{"en":"Leave a simple request to call again.","ja":"折り返しを依頼する。"}],"questions":[{"ar":"مَنْ يَتَكَلَّمُ؟","en":"Who's speaking?","ja":"どちら様ですか？"},{"ar":"مِنْ أَيِّ شَرِكَةٍ أَنْتَ؟","en":"Which company are you from?","ja":"どちらの会社ですか？"},{"ar":"مَتَى تَتَّصِلُ مَرَّةً أُخْرَى؟","en":"When will you call again?","ja":"いつかけ直しますか？"}]},{"goal":"Ask for repetition and confirm numbers and dates.","jaGoal":"","missions":[{"en":"speaking partner dictates an order number, learner repeats it.","ja":"注文番号を復唱して確認する。"},{"en":"One phrase is too fast: ask the other person to slow down.","ja":"速すぎる発話に対してゆっくり話すよう依頼する。"},{"en":"Confirm a meeting day; speaking partner changes it mid-call.","ja":"会議の日程変更を聞き取って確認する。"}],"questions":[{"ar":"هَلْ تَسْمَعُنِي؟","en":"Can you hear me?","ja":"聞こえますか？"},{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ الرَّقْمَ؟","en":"Can you repeat the number?","ja":"番号を繰り返してもらえますか？"},{"ar":"هَلْ هَذَا صَحِيحٌ؟","en":"Is this correct?","ja":"合っていますか？"}]},{"goal":"Combine phone, work, price and delivery phrases.","jaGoal":"","missions":[{"en":"Call a customer about a sample shipment.","ja":"サンプル配送について電話する。"},{"en":"Confirm the price and promise an email.","ja":"価格を確認しメール連絡を約束する。"},{"en":"Recover when you cannot understand an answer.","ja":"聞き取れない状況から会話を立て直す。"}],"questions":[{"ar":"هَلْ وَصَلَتْكَ الرِّسَالَةُ؟","en":"Did the message arrive?","ja":"メールは届きましたか？"},{"ar":"مَا السُّؤَالُ؟","en":"What is the question?","ja":"質問は何ですか？"},{"ar":"هَلْ يُمْكِنُنَا أَنْ نَلْتَقِيَ غَدًا؟","en":"Can we meet tomorrow?","ja":"明日会えますか？"}]}],"test":[{"en":"Ask: Could you repeat that?","ja":"繰り返してもらえますか？","answer":{"ar":"هَلْ يُمْكِنُكَ أَنْ تُكَرِّرَ؟","roman":"hal yumkinuka an tukarrira","en":"Ask: Could you repeat that?","ja":"繰り返してもらえますか？"}},{"en":"Say: I can't hear you well.","ja":"よく聞こえません。","answer":{"ar":"لَا أَسْمَعُكَ جَيِّدًا.","roman":"lā asmaʿuka jayyidan","en":"Say: I can't hear you well.","ja":"よく聞こえません。"}},{"en":"Ask to speak to the manager.","ja":"マネージャーと話したいです。","answer":{"ar":"هَلْ يُمْكِنُنِي التَّحَدُّثُ إِلَى الْمُدِيرِ؟","roman":"hal yumkinunī at-taḥadduthu ilā al-mudīri","en":"Ask to speak to the manager.","ja":"マネージャーと話したいです。"}},{"en":"Say: I'll call again.","ja":"また電話します。","answer":{"ar":"سَأَتَّصِلُ مَرَّةً أُخْرَى.","roman":"sa-attaṣilu marratan ukhrā","en":"Say: I'll call again.","ja":"また電話します。"}},{"en":"Ask: Is this number correct?","ja":"この番号は正しいですか？","answer":{"ar":"هَلْ هَذَا الرَّقْمُ صَحِيحٌ؟","roman":"hal hādhā ar-raqmu ṣaḥīḥun","en":"Ask: Is this number correct?","ja":"この番号は正しいですか？"}},{"en":"Say: I'll send an email.","ja":"メールを送ります。","answer":{"ar":"سَأُرْسِلُ رِسَالَةً بِالْبَرِيدِ الْإِلِكْتُرُونِيِّ.","roman":"sa-ursilu risālatan bil-barīdi al-iliktrūniyyi","en":"Say: I'll send an email.","ja":"メールを送ります。"}}],"checks":["I can ask at least four relevant questions / 4つ以上の質問ができる","I can answer without a script / 台本なしで答えられる","I can clarify when misunderstood / 聞き返しや説明ができる","I can reuse phrases from previous weeks / 以前の表現を使える","I can retell the conversation after feedback / 修正後に言い直せる"]}</script><script src="../assets/lesson-v3.js"></script><script defer src="../assets/site-navigation.js"></script></body></html>
